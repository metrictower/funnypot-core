name: update-templates

# Keep funnypot in lock-step with nuclei. Weekly (and on demand) this pulls the latest
# nuclei-templates release, recompiles the index, proves it against REAL nuclei, and
# opens a PR with the refreshed artifact — only if everything is green.
#
# Note: parsing/compiling happens HERE, once. Consumers never parse templates; they just
# `composer update` to pick up the new prebuilt index.

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      tag:
        description: 'nuclei-templates tag (blank = latest release)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  recompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, ctype
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Resolve nuclei-templates tag
        id: tpl
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(git ls-remote --tags --sort=-v:refname \
              https://github.com/projectdiscovery/nuclei-templates.git \
              | grep -oE 'refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | sed 's#refs/tags/##')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Selected nuclei-templates tag: $TAG"

      - name: Fetch nuclei-templates
        run: |
          git clone --depth 1 --branch "${{ steps.tpl.outputs.tag }}" \
            https://github.com/projectdiscovery/nuclei-templates.git /tmp/nuclei-templates

      - name: Recompile index
        run: |
          php -d memory_limit=2G bin/funnypot compile /tmp/nuclei-templates/http \
            --out=resources/compiled/nuclei-index.full.php

      - name: Recompile funnypot templates and fold new pages
        run: |
          # A fresh index has no funnypot routes; recompile the attack + route templates
          # and fold brand-new product pages back in (merge-routes is idempotent).
          php bin/funnypot compile-emulators
          php bin/funnypot compile-routes
          # Param routes reserve ids against the freshly compiled attack set (build-fails on a
          # cross-set id collision), so run this after compile-emulators.
          php bin/funnypot compile-params
          php bin/funnypot merge-routes

      - name: Unit + compiler tests
        run: vendor/bin/phpunit

      - name: Golden acceptance (real nuclei)
        run: bash tests/acceptance/run.sh

      - name: License check (upstream must be on the allow-list)
        run: bash scripts/ci/check-license.sh /tmp/nuclei-templates resources/upstream-licenses/nuclei-templates.LICENSE.md

      - name: Fingerprint-safety check
        run: php scripts/ci/check-fingerprint-safety.php --index=resources/compiled/funnypot-attack.php --index=resources/compiled/funnypot-routes.php --index=resources/compiled/funnypot-param.php

      - name: Open PR with refreshed index
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: recompile index from nuclei-templates ${{ steps.tpl.outputs.tag }}"
          branch: auto/update-templates
          delete-branch: true
          title: "Update compiled index — nuclei-templates ${{ steps.tpl.outputs.tag }}"
          body: |
            Automated recompile from nuclei-templates `${{ steps.tpl.outputs.tag }}`.

            The unit suite and the real-nuclei golden acceptance both passed, so the
            refreshed index still satisfies every asserted template.
          add-paths: |
            resources/compiled/nuclei-index.full.php
            resources/compiled/manifest.json
            resources/compiled/skipped.json
            resources/compiled/funnypot-attack.php
            resources/compiled/funnypot-routes.php
            resources/compiled/funnypot-routes-index.php
            resources/compiled/funnypot-param.php
            resources/compiled/funnypot-protocols.php
            resources/upstream-licenses/nuclei-templates.LICENSE.md
