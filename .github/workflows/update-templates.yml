name: update-templates

# Keep funnypot in lock-step with nuclei. Weekly (and on demand) this pulls the latest
# nuclei-templates release, recompiles the index, proves it against REAL nuclei, and
# opens a PR with the refreshed artifact — only if everything is green.
#
# Note: parsing/compiling happens HERE, once. Consumers never parse templates; they just
# `composer update` to pick up the new prebuilt index.

on:
  # Weekly cron PAUSED 2026-08-24 (FP-0039) — workflow_dispatch-only during rapid dev so the
  # rule-refresh crons don't auto-open PRs. Re-enable the schedule once dev settles and we want
  # the weekly nuclei-templates refresh back.
  # schedule:
  #   - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      tag:
        description: 'nuclei-templates tag (blank = latest release)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  recompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, ctype
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Resolve nuclei-templates tag
        id: tpl
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(git ls-remote --tags --sort=-v:refname \
              https://github.com/projectdiscovery/nuclei-templates.git \
              | grep -oE 'refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | sed 's#refs/tags/##')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Selected nuclei-templates tag: $TAG"

      - name: Fetch nuclei-templates
        run: |
          git clone --depth 1 --branch "${{ steps.tpl.outputs.tag }}" \
            https://github.com/projectdiscovery/nuclei-templates.git /tmp/nuclei-templates

      - name: Pinned full rebuild (compile + build DAG), moving the pin to the new tag
        run: |
          # `build-corpus` is the ONE full rebuild: compile http/ at the checkout's revision, then the
          # `funnypot build` DAG (recompile attack + route + param templates, fold brand-new product
          # pages into the fresh index, refresh source_tree/counts + the manifest.json fingerprint,
          # rebuild the decoy manifest last). Same orchestrator as `composer check` / the artifact-law
          # gate, so this PR can never trip its own drift gate. `--bump` is what makes moving the
          # recorded upstream pin deliberate; the route-key delta is printed for the PR reviewer.
          php -d memory_limit=2G bin/funnypot build-corpus /tmp/nuclei-templates --bump

      - name: Route-integrity gate (lint-routes)
        run: php -d memory_limit=2G bin/funnypot lint-routes

      - name: Unit + compiler tests
        run: vendor/bin/phpunit

      - name: Golden acceptance (real nuclei)
        run: bash tests/acceptance/run.sh

      - name: License check (upstream must be on the allow-list)
        run: bash scripts/ci/check-license.sh /tmp/nuclei-templates resources/upstream-licenses/nuclei-templates.LICENSE.md

      - name: Fingerprint-safety check
        run: php -d memory_limit=1G scripts/ci/check-fingerprint-safety.php --index=resources/compiled/funnypot-attack.php --index=resources/compiled/funnypot-routes.php --index=resources/compiled/funnypot-param.php --index=resources/compiled/nuclei-index.full.php --index=resources/compiled/funnypot-routes-index.php

      - name: Runtime fingerprint-safety check (render corpus)
        run: php -d memory_limit=1G scripts/ci/check-runtime-fingerprint-safety.php

      - name: Open PR with refreshed index
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: recompile index from nuclei-templates ${{ steps.tpl.outputs.tag }}"
          branch: auto/update-templates
          delete-branch: true
          title: "Update compiled index — nuclei-templates ${{ steps.tpl.outputs.tag }}"
          body: |
            Automated recompile from nuclei-templates `${{ steps.tpl.outputs.tag }}`.

            The unit suite and the real-nuclei golden acceptance both passed, so the
            refreshed index still satisfies every asserted template.

            The upstream pin (`manifest.json` `upstream_sha`) moved to this tag. Review the
            route-key delta in the build log; if the count fell, `tests/CorpusProvenanceTest.php`
            `ROUTE_KEY_FLOOR` must be lowered in this PR as the reviewed record of accepted loss.
          add-paths: |
            resources/compiled/nuclei-index.full.php
            resources/compiled/manifest.json
            resources/compiled/skipped.json
            resources/compiled/funnypot-attack.php
            resources/compiled/funnypot-routes.php
            resources/compiled/funnypot-routes-index.php
            resources/compiled/funnypot-param.php
            resources/compiled/funnypot-manifest.php
            templates/generated
            templates/attack-ai
            resources/upstream-licenses/nuclei-templates.LICENSE.md
