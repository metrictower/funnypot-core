name: tests

on:
  # Auto-runs PAUSED 2026-08-24 (FP-0039) — workflow_dispatch-only while we iterate + run the
  # suite locally, to stop CI credit burn + failure emails. The intended LIVE trigger is
  # pull_request ONLY (merge requests) — never `push`, so rapid-dev commits don't each spend CI.
  # To re-enable when the operator says so: uncomment the pull_request block below (one edit).
  # Do NOT add `push`.
  workflow_dispatch:
  # pull_request:
  #   branches: [main]

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.3', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, ctype
          coverage: none

      # composer.lock is gitignored (library convention) so `composer install` resolves fresh
      # each run; the config.platform.php pin keeps that resolution deterministic from
      # composer.json. Cache the composer download dir keyed on composer.json (+ PHP version) so
      # matrix jobs reuse downloads instead of fetching every package cold.
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Unit + compiler tests
        # On PHP 7.3 the tokenizer crashes the process when it token_get_all()s the
        # ~5.8 MB compiled nuclei index while the rest of the suite runs in the same
        # invocation, so that one case is split into its own run via the
        # `large-artifact` group. 8.x tokenizes it fine in one pass.
        run: |
          if [ "${{ matrix.php }}" = "7.3" ]; then
            vendor/bin/phpunit --exclude-group large-artifact
            vendor/bin/phpunit --group large-artifact
          else
            vendor/bin/phpunit
          fi

  acceptance:
    name: Real-nuclei acceptance (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, ctype
          coverage: none

      # composer.lock is gitignored (library convention); cache the composer download dir keyed
      # on composer.json so this job stops fetching every package cold.
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-php8.3-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php8.3-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Serves the compiled index with a php -S server and runs real nuclei (Docker)
      # against it, asserting every golden template still fires.
      - name: Golden acceptance
        run: bash tests/acceptance/run.sh
