id: attack-lfi-windows
severity: high
priority: 30
tags: [attack, lfi, traversal, windows]
# Windows-flavoured LFI/traversal target -> fake win.ini. Higher priority than the unix
# rule so a traversal that names a Windows file (e.g. ..\..\windows\win.ini) serves win.ini.
match:
  - in: request
    regex: '(?:win\.ini|boot\.ini|windows[\\/]|system32|c:[\\/])'
response:
  headers:
    Content-Type: "text/plain; charset=utf-8"
  body: "{{canned.winini}}"
expect: ["[extensions]"]
