id: attack-imds-gcp
severity: critical
priority: 85
tags: [attack, ssrf, cloud-metadata, imds, gcp]
# FP-0471: GCP compute metadata emulation. SSRFmap and friends fetch the GCP metadata tree at
# metadata.google.internal/computeMetadata/v1/ (header `Metadata-Flavor: Google`) AND the legacy
# headerless /computeMetadata/v1beta1/. 90-imds previously matched `/computeMetadata/v1/` but served the
# AWS STS blob (a wrong-body coherence bug — a GCP path returning AWS creds); 90 is narrowed to AWS-only
# and THIS rule owns the GCP tree with a coherent GCP body. We emit `Metadata-Flavor: Google` on every
# response and serve regardless of the request header (a scanner that omits it is still bait). Walkable
# tree via behavior:branch; leaves are inert {{fake.*}} honeytokens (canary ya29. OAuth2 token). Inert:
# nothing executed, no request byte reflected. Fingerprint-safe: fake numeric ids use dec:N>=9 and hex
# runs, so no bare 6-digit-9 run; no scanner/CRS matcher string in any body.
match:
  - in: path
    regex: '^/computeMetadata/v1(?:beta1)?(?:/|$)'
    ci: true
status: 200
response:
  headers:
    Content-Type: "application/text"
    Metadata-Flavor: "Google"
  body: |
    instance/
    project/
behavior: branch
branch:
  cases:
    - when: { in: path, regex: '/project/numeric-project-id', ci: true }
      response:
        headers: { Content-Type: "application/text", Metadata-Flavor: "Google" }
        body: "{{fake.gcp_projnum:dec:12}}"
    - when: { in: path, regex: '/project/project-id', ci: true }
      response:
        headers: { Content-Type: "application/text", Metadata-Flavor: "Google" }
        body: "{{pick:gcp_adj:striped,amber,lunar,quiet,cobalt,nimble}}-{{pick:gcp_noun:field,harbor,summit,delta,grove,ridge}}-{{fake.gcp_projtail:hex:6}}"
    - when: { in: path, regex: '/project/attributes/ssh-keys', ci: true }
      response:
        headers: { Content-Type: "application/text", Metadata-Flavor: "Google" }
        body: "admin:ssh-rsa AAAAB3NzaC1yc2E{{fake.gcp_sshkey:b64:356}} admin"
    - when: { in: path, regex: '/service-accounts/default/token', ci: true }
      response:
        headers: { Content-Type: "application/json", Metadata-Flavor: "Google" }
        body: "{\"access_token\":\"ya29.{{fake.gcp_oauth:b64url:140}}\",\"expires_in\":3599,\"token_type\":\"Bearer\"}"
    - when: { in: path, regex: '/service-accounts/default/email', ci: true }
      response:
        headers: { Content-Type: "application/text", Metadata-Flavor: "Google" }
        body: "{{fake.gcp_projnum:dec:12}}-compute@developer.gserviceaccount.com"
    - when: { in: path, regex: '/service-accounts(/default)?/?$', ci: true }
      response:
        headers: { Content-Type: "application/text", Metadata-Flavor: "Google" }
        body: |
          default/
    - when: { in: path, regex: '/instance/hostname', ci: true }
      response:
        headers: { Content-Type: "application/text", Metadata-Flavor: "Google" }
        body: "{{pick:gcp_host:instance-1,gke-node-1,app-vm}}.c.{{fake.gcp_projtail:hex:6}}.internal"
    - when: { in: path, regex: '/instance/zone', ci: true }
      response:
        headers: { Content-Type: "application/text", Metadata-Flavor: "Google" }
        body: "projects/{{fake.gcp_projnum:dec:12}}/zones/{{pick:gcp_zone:us-central1-a,europe-west1-b,asia-east1-c}}"
    - when: { in: path, regex: '/instance/machine-type', ci: true }
      response:
        headers: { Content-Type: "application/text", Metadata-Flavor: "Google" }
        body: "projects/{{fake.gcp_projnum:dec:12}}/machineTypes/{{pick:gcp_mt:e2-medium,n2-standard-2,e2-standard-4}}"
    - when: { in: path, regex: '/instance/id', ci: true }
      response:
        headers: { Content-Type: "application/text", Metadata-Flavor: "Google" }
        body: "{{fake.gcp_instid:dec:19}}"
    - when: { in: path, regex: '/instance/?$', ci: true }
      response:
        headers: { Content-Type: "application/text", Metadata-Flavor: "Google" }
        body: |
          hostname
          id
          machine-type
          service-accounts/
          zone
    - when: { in: path, regex: '/project/?$', ci: true }
      response:
        headers: { Content-Type: "application/text", Metadata-Flavor: "Google" }
        body: |
          attributes/
          numeric-project-id
          project-id
expect:
  - "instance/"
