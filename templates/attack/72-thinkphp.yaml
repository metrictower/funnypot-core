id: attack-thinkphp-rce
severity: critical
priority: 72
tags: [attack, rce, thinkphp]
# ThinkPHP invokefunction / s-param worm probe (one of the highest-volume PHP worm scans).
# Return a fake phpinfo page; the code is never executed.
match:
  - in: request
    regex: '(?:think.{0,6}app.{0,30}invokefunction|invokefunction.{0,40}call_user_func_array|s=[/\\]index[/\\].{0,20}phpinfo)'
response:
  headers:
    Content-Type: "text/html; charset=utf-8"
  body: |
    <!DOCTYPE html><html><head><title>phpinfo()</title></head><body>
    <h1 class="p">PHP Version 7.4.33</h1>
    <table>
    <tr><td class="e">System</td><td class="v">Linux web01 5.15.0 x86_64</td></tr>
    <tr><td class="e">Server API</td><td class="v">FPM/FastCGI</td></tr>
    </table>
    <p>This output was generated by phpinfo().</p>
    </body></html>
expect: ['phpinfo()', 'PHP Version']
