id: attack-wp-login
severity: high
# Priority 39, NOT the 97 the filename suggests: rule 41 (attack-cmdi-unix) matches ANY request
# surface carrying `&pwd` — a shell-metacharacter '&' immediately before the unix `pwd` command —
# and the real WordPress login field name IS `pwd`, so `log=x&pwd=y` collides with that heuristic
# and would shadow this rule at any priority >= 41. 39 is the next free slot below it (see how
# 26-wp-xmlrpc.yaml documents the same kind of priority pick).
priority: 39
tags: [attack, wordpress, login, credential-oracle]
owns_path: [/wp-login.php]
# Request-aware WordPress wp-login.php credential ORACLE. Route 50 keys the bare /wp-login.php as a
# static GET page (open-registration persona); this rule claims the same path via owns_path so a
# POST reaches the attack tier ahead of the static stub — a GET still misses the POST condition below
# and falls through unchanged to route 50's page (classify() re-serves the static bundle on decline).
# ZERO EXECUTION: the only body reads are the bounded `log`/`pwd` fields, captured purely as match-gates
# for the decoy-session mint — NEVER reflected. The login-error page always names the FIXED persona
# username `admin`, never the submitted one, so a crafted username can never surface in the response.
#
# MOCK-AUTH MINT (behavior: decoy-session, mode: mint) — the phpMyAdmin pair's exact pattern applied to
# wp-login. A plausible non-empty log/pwd mints the signed `s=1` decoy cookie and 302s to the FIXED
# literal /wp-admin/ (the authored `redirect`; never a submitted value, so no open redirect). An
# empty/whitespace/implausible credential DECLINES to the base `response` below — this SAME login-error
# page, HTTP 200, byte-identical to today (no 302, no session cookie). The mint is scoped to PARITY with
# phpMyAdmin: the FIRST plausible POST "logs in" (the any-credential-acceptance tell is a separate
# follow-up — FP-0286-adjacent — that needs credential-pinning, out of scope here).
#
# KEY-OFF DEFAULT = byte-identical to today: the signing key is a hard kill switch checked FIRST
# (handleDecoySession), so an unkeyed deploy declines before a DecoySession is ever built and serves this
# base page exactly as before. The only deliberate rollout-wide byte change is the site-name literal: the
# two `{{pick:...}}` site names became `{{persona.company.name}}` so this page names the SAME deploy-stable
# company the /wp-admin dashboard shows (the envelope/behavior is otherwise identical; no test pins the
# names). The mint sets ONLY the signed decoy cookie — never an unsigned wordpress_logged_in-style value —
# and its cookie NAME is `wordpress_logged_in_{{persona.wordpress.cookieHash}}`, per-deploy (not a
# fleet-wide literal) and matched by rule 104's gate. Chrome/domain mirror route 50 (the GET login page,
# also persona-named) so GET and POST stay one coherent host.
#
# PATH/METHOD MATCH MUST STAY AS PERMISSIVE AS owns_path: ownsPath() claims any case/trailing-slash
# variant of /wp-login.php (PathNormalizer::ownershipKey lower-cases + strips ALL trailing slashes,
# not just one — rtrim() keeps going), so the path regex tolerates any COUNT of trailing slashes
# (`/*$`, not `/?$`) to match. A stricter match here would DECLINE on a variant the override already
# claimed. On a decline,
# classify() keeps scanning the REST of the attack rules in priority order (matchRule() is a full
# linear scan, not scoped to this rule) before falling back to the exact-store `POST /wp-login.php`
# entry — the real compiled corpus keys that exact path with a `wordpress`-tagged
# wordpress-weak-credentials bundle (302, `wordpress_logged_in` — a fake login SUCCESS) alongside
# white-label-cms, and a `pwd`-shaped body can also trip rule 41 (attack-cmdi-unix) before either. Both
# `user`/`pass` captures are OPTIONAL lookaheads (each `(?=...)?`) so the rule still matches EVERY POST —
# even an empty body, or one missing a field — preserving the never-fall-through property above; the mint
# reads the captures purely to decide mint-vs-decline (a missing/empty field simply declines).
match:
  - in: path
    regex: '(?:^|/)wp-login\.php/*$'
    ci: true
  - in: method
    regex: '^POST$'
    ci: true
  - in: body
    # Two independent OPTIONAL lookaheads (mirrors rule 103, but optional so an absent field still
    # matches): find log/pwd wherever they sit in the body, in any field order. Match-gates only — the
    # captures are NEVER reflected.
    regex: '^(?:(?=(?:.*&)?log=(?P<user>[^&]{0,64})))?(?:(?=(?:.*&)?pwd=(?P<pass>[^&]{0,64})))?'
    capture: true
    ci: false
status: 200
response:
  headers:
    Content-Type: "text/html; charset=UTF-8"
    Expires: "Wed, 11 Jan 1984 05:00:00 GMT"
    Cache-Control: "no-cache, must-revalidate, max-age=0"
    Set-Cookie: "wordpress_test_cookie=WP+Cookie+check; path=/; HttpOnly"
  body: |
    <!DOCTYPE html>
    <html lang="en-US">
    <head>
    <meta charset="UTF-8" />
    <title>Log In &lsaquo; {{persona.company.name}} &#8212; WordPress</title>
    <link rel='stylesheet' href='https://blog.{{persona.company.domain}}/wp-includes/css/dist/block-library/style.min.css' />
    </head>
    <body class="login no-js login-action-login wp-core-ui">
    <div id="login">
    <h1><a href="https://blog.{{persona.company.domain}}/">{{persona.company.name}}</a></h1>
    <p class="message register">Register For This Site</p>
    <div id="login_error" class="notice notice-error"><p><strong>Error:</strong> The password you entered for the username <strong>admin</strong> is incorrect. <a href="https://blog.{{persona.company.domain}}/wp-login.php?action=lostpassword">Lost your password?</a></p></div>
    <form name="loginform" id="loginform" action="https://blog.{{persona.company.domain}}/wp-login.php" method="post">
    <p><label for="user_login">Username or Email Address<br />
    <input type="text" name="log" id="user_login" class="input" value="" size="20" autocapitalize="off" /></label></p>
    <div class="user-pass-wrap">
    <label for="user_pass">Password<br />
    <div class="wp-pwd">
    <input type="password" name="pwd" id="user_pass" class="input password-input" value="" size="20" autocomplete="current-password" />
    </div>
    </label>
    </div>
    <p class="forgetmenot"><input name="rememberme" type="checkbox" id="rememberme" value="forever" /> <label for="rememberme">Remember Me</label></p>
    <p class="submit">
    <input type="submit" name="wp-submit" id="wp-submit" class="button button-primary button-large" value="Log In" />
    <input type="hidden" name="redirect_to" value="https://blog.{{persona.company.domain}}/wp-admin/" />
    <input type="hidden" name="testcookie" value="1" />
    </p>
    </form>
    <p id="nav">
    <a href="https://blog.{{persona.company.domain}}/wp-login.php?action=register">Register</a> |
    <a href="https://blog.{{persona.company.domain}}/wp-login.php?action=lostpassword">Lost your password?</a>
    </p>
    </div>
    </body>
    </html>
behavior: decoy-session
decoy-session:
  mode: mint
  # Per-deploy cookie name (real WP appends a 32-hex COOKIEHASH to `wordpress_logged_in_`), so the fleet
  # never shares one fixed auth-cookie name. Deploy-stable via the persona seed, so rule 104's gate reads
  # the identical name; DecoySessionProbe is name-agnostic regardless.
  cookie_name: 'wordpress_logged_in_{{persona.wordpress.cookieHash}}'
  cookie_path: /
  # FIXED literal redirect target — the wp-admin dashboard rule 104 gates. Never a submitted value.
  redirect: /wp-admin/
expect: ['login_error', 'wp-login.php']
