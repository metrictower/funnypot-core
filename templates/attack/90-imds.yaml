id: attack-cloud-imds
severity: high
priority: 90
tags: [attack, ssrf, cloud-metadata, imds]
# A direct probe for the AWS instance-metadata service. Return a well-formed fake IAM credential blob —
# inert, seeded per attacker. No outbound call is ever made (the OOB-SSRF variant is deliberately not
# emulated). The AWS role-name listing lives at /iam/security-credentials/ (91-imds-base.yaml, priority
# 89); this rule serves the STS blob at the deeper /iam/security-credentials/<role> leaf, which that
# rule's match lookahead hands back here.
#
# FP-0471: narrowed to AWS only. This rule previously also matched `/computeMetadata/v1/` (GCP) and
# `/metadata/instance` (Azure) but served THIS AWS STS body there — a wrong-body coherence bug (a GCP/
# Azure path returning AWS creds). The GCP tree is now owned by 85-imds-gcp.yaml and Azure by
# 86-imds-azure.yaml, each with a coherent per-cloud body; those two alternatives are dropped here.
#
# INERT credentials: the temporary-credential shape is exact (ASIA-prefixed key, all the STS
# fields incl. Code:Success/LastUpdated/Type/Expiration) so it baits a secret scanner, but every
# value is a random per-attacker digest — never a working AWS credential. Using it gets nothing.
match:
  - in: path
    regex: '(?:/latest/meta-data/iam/security-credentials|/latest/dynamic/instance-identity)'
response:
  headers:
    Content-Type: "application/json"
  body: |
    {
      "Code" : "Success",
      "LastUpdated" : "2024-11-14T09:37:22Z",
      "Type" : "AWS-HMAC",
      "AccessKeyId" : "ASIA{{fake.imdsak:hexupper:16}}",
      "SecretAccessKey" : "{{fake.imdssecret:b64:40}}",
      "Token" : "{{fake.imdstoken:b64:100}}",
      "Expiration" : "2030-01-01T00:00:00Z"
    }
expect: ['AccessKeyId', 'SecretAccessKey']
