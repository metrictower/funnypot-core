id: attack-lfi-hostname
severity: high
priority: 22
tags: [attack, lfi, traversal]
# LFI targeting /etc/hostname -> a single plausible hostname line, NOT passwd. Ahead of the
# generic unix rule so a hostname request returns the right file shape.
match:
  - in: request
    regex: 'etc/hostname'
response:
  headers:
    Content-Type: "text/plain; charset=utf-8"
  body: "{{canned.hostname}}"
# No expect: — the hostname is now per-deploy seeded (FP-0277) and there is no cross-fleet hostname
# marker to pin; `web-prod-01` was absent from the nuclei index / CRS corpus, so pinning any fixed
# literal would only re-introduce a (smaller) fleet-correlation tell.
