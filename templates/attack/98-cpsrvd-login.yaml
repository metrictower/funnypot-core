id: attack-cpsrvd-login
severity: high
# Priority 42, NOT the 98 the filename suggests: the broad `in: request` archetypes 44-ssti-twig,
# 45-ssti-numeric, 46-php-glastopf, 50-sqli (and, further out, 60-open-redirect/65-xss-reflect) carry
# no path constraint at all, so an injection-laced `user=`/`pass=` value (e.g. `user=admin' OR
# '1'='1' --`) would otherwise reach one of THOSE first and answer with a generic attack body instead
# of this oracle's login-failed response — a real cpsrvd form answers ANY bad login, payload or not,
# the same way. 42 is a free slot below all of them (between 41-cmdi-unix and 44-ssti-twig), the same
# fix 97-wp-login.yaml already applies at priority 39 for the same class of collision.
priority: 42
tags: [attack, cpanel, whm, cpsrvd, panel, login, credential-oracle]
owns_path: [/login/]
# Request-aware cpsrvd /login/ credential ORACLE, shared by BOTH cPanel (route 382) and WHM (route
# 383): both panels' login forms POST to the same cpsrvd `/login/` endpoint, so one rule covers both
# — the oracle has no way to tell a /cpanel POST from a /whm POST apart, and neither does real cpsrvd
# (it answers both from the one `/login/` handler). /login/ has no exact-store route of its own (only
# the GET-served /cpanel and /whm pages do), so this rule's owns_path claim is belt-and-suspenders:
# it lets a future static /login page be overridden the same way 97-wp-login.yaml overrides route 50.
# Being path-anchored to /login/ (the `path` match condition below), pulling this rule's priority
# below the broad archetypes only intercepts /login/ POSTs — it does NOT shadow those rules on any
# other path, so their coverage elsewhere is unaffected.
#
# ZERO EXECUTION: the ONLY body read is the bounded `user` field, captured purely to gate the match —
# it is NEVER reflected in either branch. There is NO success path: real cpsrvd answers bad
# credentials with a 401 (JSON when the AJAX `login_only=1` flag is set, the HTML login-failed page
# otherwise) — never a redirect, never an authenticated session. The `cpsession` cookie emitted here
# is the same INERT pre-auth token a real cpsrvd sets before login succeeds (leading `%3a` encodes an
# empty username slot); it grants nothing. Gated to POST: any other verb misses (no route here at
# all) → plain 404.
#
# `behavior: branch` picks the JSON case when the request carries `login_only=1` in the query (the
# AJAX path real cPanel/WHM's login form JS uses); every other POST here — with or without a
# different query — falls through to the base `response` below, the HTML login-failed page (real
# cpsrvd's non-AJAX POST answer). Server + Version stay lockstep with routes 382/383 (one host).
#
# PATH/METHOD MATCH MUST STAY AS PERMISSIVE AS owns_path: ownsPath() claims any case/trailing-slash
# variant of /login/ (PathNormalizer::ownershipKey lower-cases + strips ALL trailing slashes, not
# just one — rtrim() keeps going), so the path regex tolerates any COUNT of trailing slashes (`/*$`,
# not `/?$`) to match. A stricter match here would DECLINE on a variant the override already
# claimed — classify() then falls through to resolveEntry(), which re-resolves that same variant
# onto the live szhe-default-login bundle above. The `user` capture is likewise optional (matches
# even with no `user=` field, or a body missing entirely) so a POST with any body still reaches this
# oracle instead of that bundle.
match:
  - in: path
    regex: '(?:^|/)login/*$'
    ci: true
  - in: method
    regex: '^POST$'
    ci: true
  - in: body
    regex: '(?:(?:^|&)user=([^&]{0,64}))?'   # optional: capture-gate only when present, never reflected
    capture: true
    ci: false
status: 401
response:
  headers:
    Content-Type: "text/html; charset=utf-8"
    Server: "cpsrvd/11.118.0.13"
    Set-Cookie: "cpsession=%3a{{fake.cp_sid:hexupper:8}}%2c{{fake.cp_ob:hex:32}}; HttpOnly; path=/; port=2083; secure"
  body: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="/cpsess0000000000/styled/basic/css/cjt.css">
    </head>
    <body class="cpanel-login-page">
    <div id="cpanel_lm_container" class="login-container">
    <div class="brand"><h1>cPanel &amp; WHM</h1></div>
    <div class="notice error">The login is invalid.</div>
    <form action="/login/?login_only=1" method="post" id="login_form" name="login_form">
    <input type="hidden" name="goto_uri" value="/">
    <div class="form-group">
    <label for="user">Username</label>
    <input type="text" id="user" name="user" autocomplete="username" placeholder="Enter your username.">
    </div>
    <div class="form-group">
    <label for="pass">Password</label>
    <input type="password" id="pass" name="pass" autocomplete="current-password" placeholder="Enter your password.">
    </div>
    <button type="submit" id="login_submit" class="btn-primary">Log in</button>
    </form>
    <p class="notice">You can reach cPanel on port 2083 and WHM on port 2087.</p>
    <div class="copyright">cPanel &amp; WHM Version 118.0.13</div>
    </div>
    </body>
    </html>
behavior: branch
branch:
  cases:
    - when: { in: query, regex: '(?:^|[?&])login_only=1' }
      response:
        status: 401
        headers:
          Content-Type: 'text/plain; charset="utf-8"'
          Server: "cpsrvd/11.118.0.13"
          Set-Cookie: "cpsession=%3a{{fake.cp_sid:hexupper:8}}%2c{{fake.cp_ob:hex:32}}; HttpOnly; path=/; port=2083; secure"
        body: "{\"status\":0,\"message\":\"see_login_log\"}"
expect: ['The login is invalid.', 'cpsrvd/11.118.0.13']
