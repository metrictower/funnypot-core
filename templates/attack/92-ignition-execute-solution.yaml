id: attack-ignition-execute-solution
severity: high
priority: 92
tags: [attack, laravel, ignition, rce]
# Request-aware Laravel Ignition execute-solution (CVE-2021-3129). The path has no route key, so a
# POST reaches the attack tier. ZERO EXECUTION by construction: the ONLY body read is the FIRST
# posted "solution" class name, captured into the named group `solution` (bounded to a PHP-class
# leaf, [A-Za-z_][A-Za-z0-9_]{0,95} — already inert, and a letter-initial leaf can never form the
# denied \b9\d{5}\b token when reflected). Cases dispatch on that ONE capture via the `match.solution`
# surface, never re-scanning the raw body (a planted second "solution" cannot steer the dispatch,
# mirroring the xmlrpc match.1 discipline). Every case returns a CANNED JSON string:
# parameters.viewFile / variableName are NEVER read, no file/include/eval, zero egress. On the
# position-blind port ($r===null) no case can evaluate, so the base response (below) serves — the
# safe degradation. Gated to POST: any other verb falls through (no route here) to the plain 404.
match:
  - in: path
    regex: '(?:^|/)_ignition/execute-solution/?$'
    ci: false
  - in: method
    regex: '^POST$'
    ci: false
  - in: body
    regex: '"solution"\s*:\s*"[^"]*?(?P<solution>[A-Za-z_][A-Za-z0-9_]{0,95})"'
    capture: true
    ci: false
status: 200
behavior: branch
branch:
  cases:
    # The CVE payload class. A real hardened install rejects the crafted parameters; we return that
    # canned validation error WITHOUT ever reading parameters.viewFile / variableName — no execution.
    - when: { in: match.solution, regex: '^MakeViewVariableOptionalSolution$', ci: false }
      response:
        headers: { Content-Type: "application/json" }
        body: |
          {"message":"The parameters passed to the solution are invalid."}
    # Other advertised runnable solutions: a canned success acknowledgement, nothing run.
    - when: { in: match.solution, regex: '^(?:GenerateAppKeySolution|RunMigrationsSolution)$', ci: false }
      response:
        headers: { Content-Type: "application/json" }
        body: |
          {"success":true}
# Base response = unknown/absent solution AND the position-blind port fallback. Reflects the ONE
# captured leaf (letter-initial, so JSON-safe and denylist-safe); renders empty on the port.
response:
  headers: { Content-Type: "application/json" }
  body: |
    {"message":"Solution \"{{match.solution}}\" not found."}
expect: ['Solution', 'not found']
