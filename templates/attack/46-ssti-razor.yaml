id: attack-ssti-razor
severity: high
priority: 46
tags: [attack, ssti, razor]
# FP-0418: the Razor `@(x*y)` SSTI arithmetic dialect — the one template style Caido's SSTI math oracle
# probes that 45-ssti-numeric does not cover (its prefix set is ${{ {{ ${ #{ <%= { ; Razor's `@(` is
# distinct). The other six Caido styles ({{..}}, ${..}, <%= .. %>, {..}, [[${..}]], %{..}) already reflect
# the product via 45. A sibling template (not a 45 edit) keeps the `@(`/`)` pair isolated so it cannot
# mis-pair with 45's `{`/`}` delimiters.
#
# Same safety posture as 45: the reflected value is the integer result of Support\SafeArithmetic (hand-
# written parser, NEVER eval/a template engine/a callback); the capture is whitelisted to digits + - * / %
# ( ) spaces, so the output is always pure digits. html_safe_captures (compile-time assertion) marks it
# HTML-safe-by-construction, so it needs no isolated origin and reflects_input would be wrong. A non-
# arithmetic `@(...)` (e.g. a Razor helper call) fails the operand grammar; overflow/div-by-zero decline
# to the inert base page, never a 500.
html_safe_captures: true
match:
  - in: request
    regex: '@\(\s*(?P<expr>(?=[0-9() \t]{0,31}[-+*/%])[0-9(][0-9+\-*/%() \t]{0,30}[0-9)])\s*\)'
status: 200
behavior: expr-eval
expr-eval:
  expr: expr
  bind: result
  max_len: 32
  max_operand: 2147483647
  response:
    headers:
      Content-Type: "text/html; charset=utf-8"
    body: "{{match.result}}\n"
# Base response: served when the expression declines — the same per-deploy-seeded inert home page 45 uses
# (one host, one home page), no reflected input, no scanner marker.
response:
  headers:
    Content-Type: "text/html; charset=utf-8"
  body: "<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><title>{{attack.page.title:home}}</title></head><body>\n{{attack.page.body:home}}\n</body></html>\n"
