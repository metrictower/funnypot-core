id: attack-phpmyadmin-gate
severity: high
# Priority 21: a free slot in the same low band the Phase-2b login oracles use to sit below the
# broad `in: request` archetypes (44-ssti-twig/45-ssti-numeric/46-php-glastopf/50-sqli/
# 60-open-redirect/65-xss-reflect carry no path constraint at all — see 97-wp-login.yaml's comment
# for the full reasoning). 21/22 are free across templates/attack, templates/attack-crs, AND
# templates/attack-ai (checked against all three merged dirs — attack-ai's own login-adjacent rules
# sit at 32-38/42/43, priority collides with 100-grafana-login/98-cpsrvd-login/99-phppgadmin-login
# there are harmless ties broken by id, but a FREE number keeps this pair's sort position legible).
# Sorts directly before 103-phpmyadmin-login (priority 22), the POST mint half of the same pair —
# the two are disjoint by method so the relative order can't change which one fires, but they're
# kept adjacent the same way 26/attack-wp-xmlrpc sorts directly before 27/attack-wp-xmlrpc-get.
priority: 21
tags: [attack, phpmyadmin, mysql, panel, login, mock-auth]
owns_path: [/phpmyadmin/, /phpmyadmin/index.php, /pma/, /phpMyAdmin/]
# Request-aware phpMyAdmin panel GATE (GET/HEAD): claims the panel roots via owns_path so
# classify() runs the attack tier ahead of route 240's static login stub. Route 240 stays (it's what
# feeds resolveEntry() a hit at all, so the M2 real-route guard — never shadow a live host route —
# still applies to these paths); this rule's owns_path override means route 240's OWN body is never
# actually served for these paths once the decoy-session key is enabled, only its store presence
# matters. See that template's own note.
#
# `behavior: decoy-session` mode `gate` renders the authed FakeRecords placeholder ONLY on a
# verified authenticated phpMyAdmin cookie (DecoySession::isAuthenticated) — anything else (no cookie, a
# garbage value, a validly-signed but wrong-class pre-auth marker, the signing key disabled, or a path/method
# variant this rule itself declines) falls back to the base `response` below: this SAME faithful
# login page. Fail-closed by construction — the ONLY path to the authed body is a verified authenticated cookie (see
# TemplateAttackEmulator::handleDecoySession's docblock for the full invariant list).
#
# FP-0517: this body is a byte-faithful clone of the real phpMyAdmin (pmahomme theme) login page —
# the sailboat logo, the `Welcome to phpMyAdmin` heading, the tab-headed Language + Log in cards, the
# Bootstrap grid rows, and the real protocol field names (pma_username/pma_password/token/set_session/
# server/lang). It is FLEET-CONSTANT on purpose, exactly as the real login is byte-constant across
# every real install: matching real pMA means a scanner clusters this box WITH the millions of real
# phpMyAdmin installs rather than with a distinct honeypot vocabulary. This REVERSES FP-0005's
# per-deploy class-prefix / version variation (that was a workaround for invented markup — a non-real
# class name like `pma-wrap` is itself a tell to any scanner that knows the real page). Only the
# per-request `token`/`set_session` values vary ({{fake.*}}), the same shape real pMA emits. The CSS
# and logo are re-derived (never vendored from the GPL upstream); the page is self-contained (inline
# CSS + inline SVG logo) so it renders correctly with no external theme asset to 404 and give the
# emulation away.
#
# PATH/METHOD MATCH MUST STAY AS PERMISSIVE AS owns_path: ownsPath() claims any case/trailing-slash
# variant of these paths (PathNormalizer::ownershipKey lower-cases + strips ALL trailing slashes),
# so the path regex tolerates any COUNT of trailing slashes (`/*$`, not `/?$`) and any case
# (`ci: true`) — a stricter match here would DECLINE on a variant the override already claimed. HEAD
# is matched the same as GET (a real phpMyAdmin answers both the same way for this page) so a HEAD
# probe gets this same login page on a decline — never route 240's older stub, and never the authed
# body (the gate only ever renders that from a verified cookie, regardless of method).
match:
  - in: path
    regex: '^/(?:phpmyadmin|pma)(?:/index\.php)?/*$'
    ci: true
  - in: method
    regex: '^(?:GET|HEAD)$'
    ci: false
status: 200
response:
  headers:
    Content-Type: "text/html; charset=utf-8"
  body: |
    <!doctype html>
    <html lang="en" dir="ltr">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex,nofollow,notranslate">
    <title>phpMyAdmin</title>
    <style>
    :root{color-scheme:light}
    *{box-sizing:border-box}
    body{margin:0;font-family:sans-serif;font-size:82.5%;background:#fff;color:#000;line-height:1.4}
    #page_content{padding:1em}
    .container{max-width:34em;margin:0 auto}
    .logo{display:block;text-align:center;margin:1.5em auto .3em;text-decoration:none}
    .logo svg{max-width:100%;height:auto}
    h1{text-align:center;font-size:1.5em;font-weight:bold;color:#444;margin:.2em 0 1.2em}
    .card{position:relative;border:1px solid #999;border-radius:4px;background:#f3f3f3;margin:1.1em auto;padding-top:.4em}
    .card-header{position:absolute;top:-0.85em;left:.75em;background:#fff;border:1px solid #999;border-bottom:none;border-radius:4px 4px 0 0;padding:.15em .6em;font-weight:bold;font-size:1em}
    .card-header a{margin-left:.25em;text-decoration:none;color:#235a81;font-weight:normal}
    .card-body{padding:1em}
    .card-footer{background:#e6e6e6;border-top:1px solid #ccc;padding:.55em 1em;text-align:right;border-radius:0 0 4px 4px}
    .row{display:flex;align-items:center}
    .mb-3{margin-bottom:1em}
    .mb-4{margin-bottom:1.4em}
    .col-12{width:100%}
    .col-sm-4{flex:0 0 34%;max-width:34%}
    .col-sm-8{flex:0 0 66%;max-width:66%}
    .col-form-label{font-weight:normal}
    .form-control{display:block;width:100%;padding:.35em .5em;border:1px solid #a3a3a3;border-radius:3px;font-size:1em;line-height:1.4}
    .form-select{display:block;width:100%;padding:.35em .5em;border:1px solid #a3a3a3;border-radius:3px;font-size:1em;background:#fff}
    .btn-primary{padding:.3em .9em;background:linear-gradient(#fcfcfc,#e3e3e3);border:1px solid #a3a3a3;border-radius:3px;color:#333;font-size:1em;cursor:pointer}
    .btn-primary:hover{background:linear-gradient(#fff,#ececec)}
    .hide{display:none}
    .js-show{display:block}
    .alert-danger{color:#9a2a2a;background:#f2dede;border:1px solid #ebccd1;border-radius:3px;padding:.5em .75em;margin:.5em 0}
    .ic_b_help{display:inline-block;width:1em;height:1em;border-radius:50%;background:#235a81;color:#fff;font-size:.8em;line-height:1.25em;text-align:center;vertical-align:middle}
    </style>
    </head>
    <body class="loginform lang-en dir-ltr">
    <div id="page_content">
    <div class="container">
    <div class="row">
    <div class="col-12">
    <a href="https://www.phpmyadmin.net/" target="_blank" rel="noopener noreferrer" class="logo">
    <svg xmlns="http://www.w3.org/2000/svg" width="298" height="118" viewBox="0 0 298 118" role="img" aria-label="phpMyAdmin">
    <path d="M150 6 L150 63 L108 63 Z" fill="#fbfbfb" stroke="#aeb7c4" stroke-width="1.5"/>
    <path d="M156 17 L156 63 L196 63 Z" fill="#eef1f6" stroke="#aeb7c4" stroke-width="1.5"/>
    <rect x="149" y="6" width="2.4" height="60" fill="#8b96a8"/>
    <path d="M92 66 L208 66 L190 85 L110 85 Z" fill="#6b83a6"/>
    <path d="M74 94 q11 -7 22 0 t22 0 t22 0 t22 0 t22 0 t22 0 t22 0" fill="none" stroke="#9fb0c8" stroke-width="2.2"/>
    <text x="150" y="114" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="27" font-style="italic" font-weight="bold"><tspan fill="#6c6c6c">php</tspan><tspan fill="#e8820c">My</tspan><tspan fill="#6c6c6c">Admin</tspan></text>
    </svg>
    </a>
    <h1>Welcome to <bdo dir="ltr" lang="en">phpMyAdmin</bdo></h1>
    <noscript>
    <div class="alert-danger" role="alert">Javascript must be enabled past this point!</div>
    </noscript>
    <div class="hide" id="js-https-mismatch">
    <div class="alert-danger" role="alert">There is a mismatch between HTTPS indicated on the server and client. This can lead to a non working phpMyAdmin or a security risk. Please fix your server configuration to indicate HTTPS properly.</div>
    </div>
    <div class="hide js-show">
    <div class="card mb-4">
    <div class="card-header"><span id="languageSelectLabel">Language</span></div>
    <div class="card-body">
    <form method="get" action="index.php?route=/&amp;lang=en" class="disableAjax">
    <input type="hidden" name="lang" value="en"><input type="hidden" name="token" value="{{fake.token:hex:32}}">
    <select name="lang" class="form-select autosubmit" lang="en" dir="ltr" id="languageSelect" aria-labelledby="languageSelectLabel">
    <option value="en" selected>English</option>
    <option value="en_gb">English (United Kingdom)</option>
    <option value="fr">Fran&ccedil;ais - French</option>
    <option value="de">Deutsch - German</option>
    <option value="es">Espa&ntilde;ol - Spanish</option>
    </select>
    </form>
    </div>
    </div>
    <form method="post" id="login_form" action="index.php?route=/" name="login_form" class="disableAjax hide js-show">
    <input type="hidden" name="lang" value="en"><input type="hidden" name="token" value="{{fake.token:hex:32}}">
    <input type="hidden" name="set_session" value="{{fake.set_session:hex:32}}">
    <div class="card mb-4">
    <div class="card-header">Log in<a href="/phpmyadmin/doc/html/index.html" target="documentation"><span class="ic_b_help" title="Documentation">?</span></a></div>
    <div class="card-body">
    <div class="row mb-3">
    <label for="input_username" class="col-sm-4 col-form-label">Username:</label>
    <div class="col-sm-8">
    <input type="text" name="pma_username" id="input_username" value="" class="form-control" autocomplete="username" spellcheck="false">
    </div>
    </div>
    <div class="row">
    <label for="input_password" class="col-sm-4 col-form-label">Password:</label>
    <div class="col-sm-8">
    <input type="password" name="pma_password" id="input_password" value="" class="form-control" autocomplete="current-password" spellcheck="false">
    </div>
    </div>
    <input type="hidden" name="server" value="1">
    </div>
    <div class="card-footer">
    <input class="btn btn-primary" value="Log in" type="submit" id="input_go">
    </div>
    </div>
    </form>
    </div>
    </div>
    </div>
    </div>
    </body>
    </html>
behavior: decoy-session
decoy-session:
  mode: gate
  cookie_name: phpMyAdmin
  cookie_path: /phpmyadmin
  domain: '{{persona.company.domain}}'
  table_key: users
  rows: 8
  # Real phpMyAdmin sits behind Apache DirectorySlash: a bare `/phpmyadmin` 301s to `/phpmyadmin/` so
  # the login form's relative `action="index.php?route=/"` resolves to the owned `/phpmyadmin/index.php`
  # instead of escaping to a bare `/index.php` this decoy does not own.
  canonical_slash: true
expect: ['<title>phpMyAdmin', 'id="login_form"', 'pma_username', 'pma_password', 'id="input_go"', 'Welcome to ', 'class="logo"']
