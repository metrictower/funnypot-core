id: attack-oidc-userinfo-accept
severity: high
priority: 123
tags: [attack, oidc, jwt, mock-auth, token-burn, cost-amplification]
# FP-0379 — the OIDC userinfo accept-loop. funnypot dangles jwks/openid BAIT (395-openid-configuration,
# 396-jwks-json) but, before this, NOTHING consumed a token: a forged alg:none / key-confusion / tampered
# JWT hit a flat 401, so an AI pentester concluded "hardened, not exploitable" and LEFT. This decoy converts
# that dead-end into a token-burn LOOP. It OWNS the standard OIDC userinfo path /auth/userinfo (where a client
# PRESENTS its bearer) and ACCEPTS ANY JWT-shaped bearer with NO validation — accepting a forgery is exactly
# the deception — returning a tantalizing "almost-admin" userinfo body: near-admin roles/scopes (billing-admin
# / reports:read) but never super_admin or admin:*, plus _links into deeper decoy routes, so claim-permutation
# attempts (role swap / scope tweak / sub change) always find *slightly more* instead of a 401 wall.
#
# INERT (the hard invariant): there is no session, no secret check, no real data, no outbound call. The
# template DSL has no auth/session/socket primitive, so "acceptance" is purely a cosmetic 200-vs-401 over a
# seeded body. The bearer test is a PURE BOOLEAN GATE (no capture:true) and the 200 body reflects ZERO
# attacker bytes — every value is a persona/fake seeded constant, never a real identity. jwks stays the inert
# public-only 396 surface; this grants only the fabricated dead-end JSON. Status is template-chosen (invariant
# #5; no model-driven 3xx). Generic OIDC claims carry no scanner/matcher signature (invariant #1).
#
# TWO-CLAIMANT ARRANGEMENT (coherence gate, FP-0379 plan-review C1 + code-review M1): the advertised
# /auth/userinfo must resolve in BOTH attackEmulation modes, AND the bearer-less 401 must stay byte-coherent
# with its /auth/* siblings under EVERY style (realistic / taunt / prompt-injection seeding). The 405
# new_page owns the bearer-less 401 ENTIRELY: it is the attackEmulation-OFF baseline AND, when attack
# emulation is on, THIS rule's top-level match requires the bearer, so a bearer-less request DECLINES the
# owns_path rule and falls through (Honeypot::classifyContent — a declined owns_path rule is not a 404; it
# resolves to the new_page store verdict) to that same 405 baseline, served via RouteTemplateEmulator with the
# style's taunt/injection carrier applied — identically to /auth, /auth/login, /auth/token. This rule ONLY
# supplies the bearer-bearing 200 upgrade (owns_path → matchOnOwnedPath Tier-1, before the store lookup). The
# new_page shadow is recorded in resources/route-integrity.php.
owns_path:
  - '/auth/userinfo'
# Both conditions are ANDed: a request matches (and this rule serves the 200) ONLY when the path is
# /auth/userinfo AND a JWT-shaped bearer is present. A bearer-less request fails the second condition, declines
# the rule, and falls through to the 405 new_page 401 baseline (coherent in every style). The bearer test is a
# PURE BOOLEAN GATE — no capture:true — so the 200 body below reflects ZERO attacker bytes.
match:
  # Path (ci, trailing-slash tolerant via PathNormalizer::ownershipKey — the owns_path variant-coverage rule).
  - in: path
    regex: '^/auth/userinfo/*$'
    ci: true
  # ACCEPT-ANY-BEARER (the whole point): any JWT-shaped bearer — forged alg:none, wrong-key-signed, tampered —
  # is accepted with NO signature/secret validation. ci so a lower-case `bearer` scheme still matches.
  - in: header:authorization
    regex: '^Bearer\s+[A-Za-z0-9._-]+'
    ci: true
status: 200
# The "almost-admin" userinfo body: near-admin roles/scopes (billing-admin / reports:read) but never
# super_admin or admin:*, plus _links into deeper decoy routes, so claim permutation always finds slightly
# more. Every value is a persona/fake seeded constant — never a real identity, never a reflected attacker byte.
response:
  headers:
    Content-Type: "application/json"
  body: |
    {
      "sub": "{{fake.oidcsub:hex:32}}",
      "name": "{{persona.user.admin.username}}",
      "preferred_username": "{{persona.user.admin.username}}",
      "email": "{{persona.user.admin.email}}",
      "email_verified": true,
      "org": "{{persona.company.name}}",
      "roles": ["staff", "billing-admin", "reports-admin"],
      "scope": "openid profile email reports:read billing:read",
      "_links": {
        "self": "https://{{persona.company.domain}}/auth/userinfo",
        "admin_console": "https://{{persona.company.domain}}/admin",
        "api_root": "https://{{persona.company.domain}}/api/v1",
        "service_health": "https://{{persona.company.domain}}/api/health"
      }
    }
# Acceptance witnesses are checked against the rendered 200 response (the only response this rule serves).
expect:
  - '"roles": ["staff", "billing-admin"'
  - '"scope": "openid profile email reports:read'
