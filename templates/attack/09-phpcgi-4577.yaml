id: attack-phpcgi-4577
severity: critical
priority: 9
tags: [attack, php-cgi, rce, cve-2024-4577]
# php-cgi CVE-2024-4577 (the 2024 Windows soft-hyphen successor to CVE-2012-1823). The
# %AD-encoded option smuggles -d allow_url_include=1 -d auto_prepend_file=php://input. Common
# PoCs run phpinfo(); we return a fake phpinfo. Never executed.
match:
  - in: query
    regex: '%ad(?:d|s)?'
response:
  headers:
    Content-Type: "text/html; charset=utf-8"
  body: |
    <!DOCTYPE html><html><head><title>phpinfo()</title></head><body>
    <h1 class="p">PHP Version 8.1.10</h1>
    <table>
    <tr><td class="e">System</td><td class="v">Windows NT WEB01 10.0 build 17763</td></tr>
    <tr><td class="e">Server API</td><td class="v">CGI/FastCGI</td></tr>
    </table>
    <p>This output was generated by phpinfo().</p>
    </body></html>
expect: ['phpinfo()', 'PHP Version']
