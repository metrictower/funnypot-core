id: attack-cmdi-arith
severity: high
priority: 42
tags: [attack, cmdi, command-injection, reflector, artemis]
# FP-0386 + FP-0466: dynamic arithmetic command-injection reflector for anti-reflection DAST (CERT-Polska
# Artemis / Commix et al). The scanner does NOT trust a static `echo vulnerable`; it injects
# `echo {left}$(({a} op {b})){right}` (optionally with an inner `$(echo {mid})` confirmation) using fresh
# random `left`/`mid`/`right` anchor tokens and random operands, and confirms ONLY if the body contains
# `{left}{a op b}{mid}{right}` — the marker forms only if the shell evaluated the arithmetic AND the
# attacker's exact tokens bracket it. 41-cmdi-unix returns a fixed uid=0(root) and never computes, so it
# cannot form this marker. Here `behavior: expr-eval` computes `a op b` (op ∈ + - *) with
# Support\SafeArithmetic (hand-written recursive-descent integer parser — NEVER eval/shell/callback) and
# reflects {left}{result}{mid}{right} inside a plausible command-output frame. (FP-0466 generalised this
# from FP-0386's hex-anchor/multiplication-only form; the sibling 49-cmdi-expr-util / 51-cmdi-winarith
# carry the `expr` and Windows `set /a` dialects.)
#
# REFLECTING decoy: it echoes the attacker's anchor tokens verbatim, so (per the project rule, like
# 65-xss-reflection-escalation / 60-open-redirect) it is gated behind Config::serveReflector():
# reflects_input: true + reflect_class: cmdi ⇒ serves ONLY from an isolated-origin box with the class
# enabled and the request authorized. Embedded hosts (isolatedOrigin=false) and the position-blind
# synthesize() port never serve it (detection still recorded; degrades to the host 404). Safe to author
# raw: the anchors are whitelisted to [A-Za-z0-9]{3,16} (no <>&"' / CR/LF/NUL can appear) and the result
# is a bounded signed integer; SafeArithmetic declines (→ base page, never a 500) on overflow/out-of-grammar.
# Time-based (sleep 5 vs sleep 0) is deliberately NOT here — a synchronous engine sleep is a DoS
# amplifier + self-fingerprint; it is an app-tier / store-deferred follow-up (spec §4/§6).
reflects_input: true
reflect_class: cmdi
match:
  - in: request
    # FP-0466: the POSIX $((A op B)) arithmetic-expansion bracketed by two alnum tokens is the Artemis/
    # Commix-distinctive shape; the distinctive `$((` syntax (not anchor length) is the specificity. An
    # optional leading `echo` tightens it; the operator is any of + - *; an optional inner `$(echo MID)`
    # confirmation group (Commix) is captured too. capture:true selects left/expr/mid/right for the
    # response markers. Widened from FP-0386's hex-mul-only form (the ticket probes use uppercase anchors
    # and +/- operators); SafeArithmetic evaluates A op B (zero exec) and declines out-of-grammar.
    regex: '(?:echo\s+)?(?P<left>[A-Za-z0-9]{3,16})\$\(\(\s*(?P<expr>\d{1,10}\s*[+\-*]\s*\d{1,10})\s*\)\)(?:\$\((?:echo\s+)?(?P<mid>[A-Za-z0-9]{3,16})\))?(?P<right>[A-Za-z0-9]{3,16})'
    capture: true
status: 200
behavior: expr-eval
expr-eval:
  expr: expr
  bind: result
  max_len: 24
  max_operand: 2147483647
  response:
    headers:
      Content-Type: "text/plain; charset=utf-8"
    body: |
      $ sh -c 'id; echo {{match.left}}$((...)){{match.mid}}{{match.right}}'
      uid=0(root) gid=0(root) groups=0(root)
      {{match.left}}{{match.result}}{{match.mid}}{{match.right}}
# Base response: served when the expression declines (overflow / out of grammar / non-arithmetic) —
# a plain, marker-free diagnostic line, never a 500 (only-upgrade invariant).
response:
  headers:
    Content-Type: "text/plain; charset=utf-8"
  body: |
    uid=0(root) gid=0(root) groups=0(root)
expect:
  - 'uid=0(root)'
