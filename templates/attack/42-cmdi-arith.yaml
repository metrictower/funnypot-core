id: attack-cmdi-arith
severity: high
priority: 42
tags: [attack, cmdi, command-injection, reflector, artemis]
# FP-0386: dynamic arithmetic command-injection reflector for anti-reflection DAST (CERT-Polska
# Artemis et al). Artemis does NOT trust a static `echo vulnerable`; it injects
# `echo {left}$(({a}*{b})){right}` with fresh 8-hex `left`/`right` tokens and random operands, and
# confirms ONLY if the body contains `{left}{a*b}{right}` — the marker forms only if the shell
# evaluated the arithmetic AND the attacker's exact tokens bracket it. 41-cmdi-unix returns a fixed
# uid=0(root) and never computes, so it cannot form this marker. Here `behavior: expr-eval` computes
# the product with Support\SafeArithmetic (hand-written recursive-descent integer parser — NEVER
# eval/shell/callback) and reflects {left}{product}{right} inside a plausible command-output frame.
#
# REFLECTING decoy: it echoes the attacker's `left`/`right` tokens verbatim, so (per the project rule,
# like 65-xss-reflection-escalation / 60-open-redirect) it is gated behind Config::serveReflector():
# reflects_input: true + reflect_class: cmdi ⇒ serves ONLY from an isolated-origin box with the class
# enabled and the request authorized. Embedded hosts (isolatedOrigin=false) and the position-blind
# synthesize() port never serve it (detection still recorded; degrades to the host 404). Safe to author
# raw: `left`/`right` are whitelisted to [a-f0-9]{6,16} (no <>&"' / CR/LF/NUL can appear) and the
# product is pure digits; SafeArithmetic declines (→ base page, never a 500) on overflow/out-of-grammar.
# Time-based (sleep 5 vs sleep 0) is deliberately NOT here — a synchronous engine sleep is a DoS
# amplifier + self-fingerprint; it is an app-tier / store-deferred follow-up (spec §4/§6).
reflects_input: true
reflect_class: cmdi
match:
  - in: request
    # The $((d*d)) arithmetic-expansion bracketed by two hex tokens is Artemis-distinctive; an optional
    # leading `echo` tightens it. capture:true selects these groups for the response markers.
    regex: '(?:echo\s+)?(?P<left>[a-f0-9]{6,16})\$\(\((?P<expr>\d{1,10}\*\d{1,10})\)\)(?P<right>[a-f0-9]{6,16})'
    capture: true
status: 200
behavior: expr-eval
expr-eval:
  expr: expr
  bind: result
  max_len: 24
  max_operand: 2147483647
  response:
    headers:
      Content-Type: "text/plain; charset=utf-8"
    body: |
      $ sh -c 'id; echo {{match.left}}$((...)){{match.right}}'
      uid=0(root) gid=0(root) groups=0(root)
      {{match.left}}{{match.result}}{{match.right}}
# Base response: served when the expression declines (overflow / out of grammar / non-arithmetic) —
# a plain, marker-free diagnostic line, never a 500 (only-upgrade invariant).
response:
  headers:
    Content-Type: "text/plain; charset=utf-8"
  body: |
    uid=0(root) gid=0(root) groups=0(root)
expect:
  - 'uid=0(root)'
