id: attack-fiberhome-login
severity: info
priority: 105
tags: [attack, fiberhome, panel, login]
# Own the complete canonical Fiberhome form target, but match only POST and sort after the existing
# priority-63 CVE rule. This path/method-only fallback deliberately accepts empty or malformed login
# bodies: every attempt gets the same inert failure page and no request byte reaches the response.
owns_path: ['/boaform/admin/formLogin']
match:
  - in: path
    regex: '^/boaform/admin/formLogin/*$'
    ci: false
  - in: method
    regex: '^POST$'
    ci: true
status: 200
response:
  headers:
    Content-Type: "text/html; charset=utf-8"
  body: |
    <html><head><title>Web User Login</title></head><body>
    <form method="post" action="/boaform/admin/formLogin">
    <input type="text" name="username">
    <input type="password" name="psd">
    <input type="submit" value="Login">
    </form>
    <p>Authentication failed. Please try again.</p>
    </body></html>
expect:
  - 'Web User Login'
  - 'action="/boaform/admin/formLogin"'
  - 'name="username"'
  - 'name="psd"'
  - 'Authentication failed. Please try again.'
