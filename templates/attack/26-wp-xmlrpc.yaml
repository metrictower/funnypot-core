id: attack-wp-xmlrpc
severity: high
# Suggested priority 24 was taken by attack-lfi-smbconf; 26/27 is the next free pair, kept
# adjacent so this POST dispatcher sorts directly before the 27 GET/fallback rule.
priority: 26
tags: [attack, wordpress, xmlrpc]
# Request-aware WordPress xmlrpc.php — POST method dispatch. Fires on any PREFIXED path ending
# /xmlrpc.php (/wp/xmlrpc.php, /news/xmlrpc.php, …). The bare /xmlrpc.php is an exact-store
# corpus key answered before the attack tier (still dressed by templates/route/30-xmlrpc.yaml);
# retiring that shadow is deferred. The methodName is captured at the TOP level so the unknown-
# method base response can reflect it — a branch-case capture would be discarded.
match:
  - in: path
    regex: '(?:^|/)xmlrpc\.php$'
  - in: body
    regex: '<methodName>\s*([\w.]{1,64})'
    capture: true
status: 200
behavior: branch
branch:
  cases:
    # Introspection: the full advertised method list. Describes methods only, implements nothing.
    - when: { in: body, regex: '<methodName>\s*system\.listMethods' }
      response:
        headers: { Content-Type: "text/xml; charset=UTF-8" }
        body: |
          <?xml version="1.0" encoding="UTF-8"?>
          <methodResponse>
            <params>
              <param>
                <value>
                <array><data>
            <value><string>system.multicall</string></value>
            <value><string>system.listMethods</string></value>
            <value><string>system.getCapabilities</string></value>
            <value><string>demo.addTwoNumbers</string></value>
            <value><string>demo.sayHello</string></value>
            <value><string>pingback.extensions.getPingbacks</string></value>
            <value><string>pingback.ping</string></value>
            <value><string>mt.publishPost</string></value>
            <value><string>mt.getTrackbackPings</string></value>
            <value><string>mt.supportedTextFilters</string></value>
            <value><string>mt.supportedMethods</string></value>
            <value><string>mt.setPostCategories</string></value>
            <value><string>mt.getPostCategories</string></value>
            <value><string>mt.getRecentPostTitles</string></value>
            <value><string>mt.getCategoryList</string></value>
            <value><string>metaWeblog.getUsersBlogs</string></value>
            <value><string>metaWeblog.deletePost</string></value>
            <value><string>metaWeblog.newMediaObject</string></value>
            <value><string>metaWeblog.getCategories</string></value>
            <value><string>metaWeblog.getRecentPosts</string></value>
            <value><string>metaWeblog.getPost</string></value>
            <value><string>metaWeblog.editPost</string></value>
            <value><string>metaWeblog.newPost</string></value>
            <value><string>blogger.deletePost</string></value>
            <value><string>blogger.editPost</string></value>
            <value><string>blogger.newPost</string></value>
            <value><string>blogger.getRecentPosts</string></value>
            <value><string>blogger.getPost</string></value>
            <value><string>blogger.getUserInfo</string></value>
            <value><string>blogger.getUsersBlogs</string></value>
            <value><string>wp.restoreRevision</string></value>
            <value><string>wp.getRevisions</string></value>
            <value><string>wp.getPostTypes</string></value>
            <value><string>wp.getPostType</string></value>
            <value><string>wp.getPostFormats</string></value>
            <value><string>wp.getMediaLibrary</string></value>
            <value><string>wp.getMediaItem</string></value>
            <value><string>wp.getCommentStatusList</string></value>
            <value><string>wp.getCommentCount</string></value>
            <value><string>wp.getComment</string></value>
            <value><string>wp.getComments</string></value>
            <value><string>wp.deleteComment</string></value>
            <value><string>wp.editComment</string></value>
            <value><string>wp.newComment</string></value>
            <value><string>wp.getOptions</string></value>
            <value><string>wp.setOptions</string></value>
            <value><string>wp.getPageTemplates</string></value>
            <value><string>wp.getPageStatusList</string></value>
            <value><string>wp.getPostStatusList</string></value>
            <value><string>wp.getCommentStatusList</string></value>
            <value><string>wp.getMediaItem</string></value>
            <value><string>wp.getProfile</string></value>
            <value><string>wp.editProfile</string></value>
