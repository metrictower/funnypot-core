id: attack-wp-xmlrpc
severity: high
# Suggested priority 24 was taken by attack-lfi-smbconf; 26/27 is the next free pair, kept
# adjacent so this POST dispatcher sorts directly before the 27 GET/fallback rule.
priority: 26
tags: [attack, wordpress, xmlrpc]
owns_path: [/xmlrpc.php]
# Request-aware WordPress xmlrpc.php — POST method dispatch. Fires on any path ending /xmlrpc.php,
# including the bare /xmlrpc.php: the bare path is an exact-store key, and this rule claims it via
# owns_path so classify() runs the attack tier ahead of the static stub (falling back to the stub
# only if this rule declines). Gated to POST: real WP answers any other verb with the 405 (rule 27).
#
# The FIRST top-level <methodName> is captured (anchored after <methodCall>, skipping leading
# comments so a decoy name can't win) into captures[1]; branch cases dispatch on that ONE parsed
# method via the `match.1` surface, so a planted secondary <methodName> can't steer the dispatch,
# and the unknown-method base reflects the true method.
match:
  - in: path
    # ci: true (not the case-sensitive PHP-filesystem rationale this used to document): ownsPath()
    # claims any case/trailing-slash variant of /xmlrpc.php (PathNormalizer::ownershipKey lower-cases
    # + strips ALL trailing slashes), so this match must be at least as permissive or a variant
    # request DECLINEs here after ownsPath() already claimed it — see 97-wp-login.yaml's comment for
    # the full reasoning. `(?:/|$)` already tolerates any number of trailing slashes: it isn't
    # end-anchored, so it matches as soon as ONE trailing slash (or end of string) follows
    # `xmlrpc.php`, and any further trailing slashes are simply unconsumed extra text.
    regex: '(?:^|/)xmlrpc\.php(?:/|$)'
    ci: true
  - in: method
    regex: '^POST$'
    ci: false
  - in: body
    regex: '<methodCall\b[^>]*>\s*(?:<!--[\s\S]{0,1024}?-->\s*)*<methodName\b[^>]*>\s*(?:<!\[CDATA\[\s*)?([\w.]{0,64})'
    capture: true
    ci: false
status: 200
behavior: branch
branch:
  cases:
    # ?rsd preempts method dispatch for ANY method/verb — real WP serves the RSD document first.
    # Mirrors rule 27's rsd case (duplicated until a shared-snippet mechanism exists).
    - when: { in: query, regex: '(?:^|&)rsd(?:[=&]|$)' }
      response:
        status: 200
        headers: { Content-Type: "text/xml; charset=UTF-8" }
        body: |
          <?xml version="1.0" encoding="UTF-8"?>
          <rsd version="1.0" xmlns="http://archipelago.phrasewise.com/rsd">
            <service>
              <engineName>WordPress</engineName>
              <engineLink>https://wordpress.org/</engineLink>
              <homePageLink>https://{{persona.company.domain}}/</homePageLink>
              <apis>
                <api name="WordPress" blogID="1" preferred="true" apiLink="https://{{persona.company.domain}}/xmlrpc.php" />
                <api name="Movable Type" blogID="1" preferred="false" apiLink="https://{{persona.company.domain}}/xmlrpc.php" />
                <api name="MetaWeblog" blogID="1" preferred="false" apiLink="https://{{persona.company.domain}}/xmlrpc.php" />
                <api name="Blogger" blogID="1" preferred="false" apiLink="https://{{persona.company.domain}}/xmlrpc.php" />
                <api name="WP-API" blogID="1" preferred="false" apiLink="https://{{persona.company.domain}}/wp-json/" />
              </apis>
            </service>
          </rsd>
    # Introspection: the full advertised method list. Describes methods only, implements nothing.
    # Every advertised name is handled — by a case below, or (system.multicall, demo.addTwoNumbers)
    # by a dedicated priority-23 rule that sorts ahead of this dispatcher — so none falls to the
    # -32601 base. Real WP's list is array_keys() of its method map: no unhandled or duplicate entries.
    - when: { in: match.1, regex: '^system\.listMethods$', ci: false }
