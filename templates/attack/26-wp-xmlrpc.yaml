    # system.multicall is handled by the dedicated priority-23 iterate rule (true N-in→N-out fan-out),
    # which sorts ahead of this dispatcher — so it never reaches a case here.
    # Liveness probe.
    - when: { in: match.1, regex: '^demo\.sayHello$', ci: false }
      response:
        headers: { Content-Type: "text/xml; charset=UTF-8" }
        body: |
