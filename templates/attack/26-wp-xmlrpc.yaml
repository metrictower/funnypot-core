            <value><string>wp.getUser</string></value>
            <value><string>wp.getTaxonomies</string></value>
            <value><string>wp.getTaxonomy</string></value>
            <value><string>wp.getTerms</string></value>
            <value><string>wp.getTerm</string></value>
            <value><string>wp.deleteTerm</string></value>
            <value><string>wp.editTerm</string></value>
            <value><string>wp.newTerm</string></value>
            <value><string>wp.getPosts</string></value>
            <value><string>wp.getPost</string></value>
            <value><string>wp.deletePost</string></value>
            <value><string>wp.editPost</string></value>
            <value><string>wp.newPost</string></value>
            <value><string>wp.getPageList</string></value>
            <value><string>wp.editPage</string></value>
            <value><string>wp.deletePage</string></value>
            <value><string>wp.newPage</string></value>
            <value><string>wp.getPages</string></value>
            <value><string>wp.getPage</string></value>
            <value><string>wp.getAuthors</string></value>
            <value><string>wp.getTags</string></value>
            <value><string>wp.getCategories</string></value>
            <value><string>wp.newCategory</string></value>
            <value><string>wp.deleteCategory</string></value>
            <value><string>wp.suggestCategories</string></value>
            <value><string>wp.uploadFile</string></value>
            <value><string>wp.deleteFile</string></value>
            <value><string>wp.getUsersBlogs</string></value>
                </data></array>
                </value>
              </param>
            </params>
          </methodResponse>
    # Capabilities struct — describes the server, grants nothing.
    - when: { in: body, regex: '<methodName>\s*system\.getCapabilities' }
      response:
        headers: { Content-Type: "text/xml; charset=UTF-8" }
        body: |
          <?xml version="1.0" encoding="UTF-8"?>
          <methodResponse>
            <params>
              <param>
                <value>
                <struct>
                  <member><name>xmlrpc</name><value><struct>
                    <member><name>specUrl</name><value><string>http://www.xmlrpc.com/spec</string></value></member>
                    <member><name>specVersion</name><value><int>1</int></value></member>
                  </struct></value></member>
                  <member><name>faults_interop</name><value><struct>
                    <member><name>specUrl</name><value><string>http://xmlrpc-epi.sourceforge.net/specs/rfc.fault_codes.php</string></value></member>
                    <member><name>specVersion</name><value><int>20010516</int></value></member>
                  </struct></value></member>
                  <member><name>system.multicall</name><value><struct>
                    <member><name>specUrl</name><value><string>http://www.xmlrpc.com/discuss/msgReader$1208</string></value></member>
                    <member><name>specVersion</name><value><int>1</int></value></member>
                  </struct></value></member>
                </struct>
                </value>
              </param>
            </params>
          </methodResponse>
    # system.multicall — STOPGAP. A real multicall fans out N sub-calls to N result entries; that
    # needs the deferred `iterate` primitive. Until then, serve a fixed single-entry array carrying
    # the bad-credentials fault: bounded (no amplification) and, since brute tools wrap
    # wp.getUsersBlogs here, it upholds the credential-oracle invariant — never authenticates.
    - when: { in: body, regex: '<methodName>\s*system\.multicall' }
      response:
        headers: { Content-Type: "text/xml; charset=UTF-8" }
        body: |
          <?xml version="1.0" encoding="UTF-8"?>
          <methodResponse>
            <params>
              <param>
                <value>
                <array><data>
                <value><struct>
                  <member><name>faultCode</name><value><int>403</int></value></member>
                  <member><name>faultString</name><value><string>Incorrect username or password.</string></value></member>
                </struct></value>
                </data></array>
                </value>
              </param>
            </params>
          </methodResponse>
    # Liveness probe.
    - when: { in: body, regex: '<methodName>\s*demo\.sayHello' }
      response:
        headers: { Content-Type: "text/xml; charset=UTF-8" }
        body: |
          <?xml version="1.0" encoding="UTF-8"?>
          <methodResponse>
            <params>
              <param>
                <value>
                <string>Hello!</string>
                </value>
              </param>
            </params>
          </methodResponse>
    # pingback.ping — ZERO EGRESS. Returns the authentic pre-fetch fault (target not usable) a real
    # WordPress emits BEFORE it would ever fetch the source URL. It is a static template response;
    # the source/target URIs are never read, so nothing here can touch the network.
    - when: { in: body, regex: '<methodName>\s*pingback\.ping' }
      response:
        headers: { Content-Type: "text/xml; charset=UTF-8" }
        body: |
          <?xml version="1.0" encoding="UTF-8"?>
          <methodResponse>
            <fault>
              <value>
              <struct>
                <member><name>faultCode</name><value><int>33</int></value></member>
                <member><name>faultString</name><value><string>The specified target URL cannot be used as a target. It either does not exist, or it is not a pingback-enabled resource.</string></value></member>
              </struct>
              </value>
            </fault>
          </methodResponse>
    # Credential-brute ORACLE — the bait. Every wp./mt./metaWeblog./blogger. method requires auth;
    # WordPress answers bad credentials with faultCode 403 "Incorrect username or password.". There
    # is NO success branch anywhere: this looks like a real login oracle but never grants anything.
    - when: { in: body, regex: '<methodName>\s*(?:wp|mt|metaWeblog|blogger)\.' }
      response:
        headers: { Content-Type: "text/xml; charset=UTF-8" }
        body: |
          <?xml version="1.0" encoding="UTF-8"?>
          <methodResponse>
            <fault>
              <value>
              <struct>
                <member><name>faultCode</name><value><int>403</int></value></member>
                <member><name>faultString</name><value><string>Incorrect username or password.</string></value></member>
              </struct>
              </value>
            </fault>
          </methodResponse>
# No branch default: an unknown method falls through to this base response — the -32601 fault,
# reflecting the top-level captured method name via {{match.1}} (bounded to [\w.], so XML-safe).
response:
  headers: { Content-Type: "text/xml; charset=UTF-8" }
  body: |
    <?xml version="1.0" encoding="UTF-8"?>
    <methodResponse>
      <fault>
        <value>
        <struct>
          <member><name>faultCode</name><value><int>-32601</int></value></member>
          <member><name>faultString</name><value><string>server error. requested method {{match.1}} does not exist.</string></value></member>
        </struct>
        </value>
      </fault>
    </methodResponse>
expect: ['methodResponse', 'faultCode', '-32601']
