    # pingback.ping — ZERO EGRESS. Returns the authentic pre-fetch fault (target not usable) a real
    # WordPress emits BEFORE it would ever fetch the source URL. It is a static template response;
    # the source/target URIs are never read, so nothing here can touch the network.
    - when: { in: match.1, regex: '^pingback\.ping$', ci: false }
      response:
        headers: { Content-Type: "text/xml; charset=UTF-8" }
        body: |
          <?xml version="1.0" encoding="UTF-8"?>
          <methodResponse>
            <fault>
              <value>
                <struct>
                  <member>
                    <name>faultCode</name>
                    <value><int>33</int></value>
                  </member>
                  <member>
                    <name>faultString</name>
                    <value><string>The specified target URL cannot be used as a target. It either does not exist, or it is not a pingback-enabled resource.</string></value>
                  </member>
                </struct>
              </value>
            </fault>
          </methodResponse>
