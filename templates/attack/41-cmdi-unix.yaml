id: attack-cmdi-unix
severity: critical
priority: 41
tags: [attack, rce, command-injection]
# Shell metacharacter (; | & newline backtick $()) immediately before a unix recon command
# -> canned uid=0(root) output. Never runs a command.
match:
  - in: request
    regex: '(?:[;|&\n`]|\$\(|%0a|%7c|%26)\s*(?:id|whoami|uname|cat\s|ls\s|pwd|ifconfig)'
response:
  headers:
    Content-Type: "text/plain; charset=utf-8"
  body: "{{canned.uid}}"
expect: ["uid=0(root)"]
