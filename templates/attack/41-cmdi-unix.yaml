id: attack-cmdi-unix
severity: critical
priority: 41
tags: [attack, rce, command-injection]
# Shell metacharacter (; | & newline backtick $()) immediately before a unix recon command
# -> canned uid=0(root) output. Never runs a command. The (?![=\w]) guard is on the BARE-token recon
# words only (id/whoami/uname/pwd/ifconfig): it rejects a query-string param key (`&id=`, `&pwd=`,
# `&uname=`) where the `&` is a param delimiter not a shell background operator, and an identifier that
# merely starts with a recon word (`&idle=`), while still matching the genuine shell forms (`;id`,
# `|whoami`, `` `id` ``, `$(id)`, `&&id`, `%0aid`). The `cat\s`/`ls\s` branches require trailing
# whitespace, so a param key (`&cat=`) never matched them — they stay UNGUARDED so a bareword argument
# (`;cat passwd`, `;ls secret`) is still detected. FP-0581.
match:
  - in: request
    regex: '(?:[;|&\n`]|\$\(|%0a|%7c|%26)\s*(?:(?:id|whoami|uname|pwd|ifconfig|ps|uptime)(?![=\w])|cat\s|ls\s)'
response:
  headers:
    Content-Type: "text/plain; charset=utf-8"
  body: "{{canned.uid}}"
# FP-0597: branch the recon command to COHERENT seeded output (the shared CannedData set added in
# v0.7.81 for 42b). Before, every matched command served uid=0 — so `;ls`/`;pwd`/`;uname`/`;ps` returned
# a uid line, the same tell FP-0578 fixed on the SpEL/OGNL path. `id` and a bare injection keep uid=0 (the
# RCE-confirm marker). `cat /etc/passwd` is answered by the LFI rule (attack-lfi-unix wins its path), so
# it needs no branch here; `hostname` is owned by the generated CRS rule (out of scope — FP-0597 note).
behavior: branch
branch:
  cases:
    - when: { in: request, regex: '\bls\b', ci: true }
      response:
        headers: { Content-Type: "text/plain; charset=utf-8" }
        body: "{{canned.ls}}"
    - when: { in: request, regex: '\bps\b', ci: true }
      response:
        headers: { Content-Type: "text/plain; charset=utf-8" }
        body: "{{canned.ps}}"
    - when: { in: request, regex: '\bpwd\b', ci: true }
      response:
        headers: { Content-Type: "text/plain; charset=utf-8" }
        body: "{{canned.pwd}}"
    - when: { in: request, regex: '\buname\b', ci: true }
      response:
        headers: { Content-Type: "text/plain; charset=utf-8" }
        body: "{{canned.uname}}"
    - when: { in: request, regex: '\buptime\b', ci: true }
      response:
        headers: { Content-Type: "text/plain; charset=utf-8" }
        body: "{{canned.uptime}}"
    - when: { in: request, regex: '\bwhoami\b', ci: true }
      response:
        headers: { Content-Type: "text/plain; charset=utf-8" }
        body: "root\n"
expect: ["uid=0(root)"]
