id: attack-wp-xmlrpc-get
severity: info
# Sorts directly after the 26 POST dispatcher (attack-wp-xmlrpc): that rule only matches a POST
# whose body carries a parseable <methodCall>/<methodName>, so every request reaching here is a
# GET, a non-POST verb, a bodyless/empty POST, an RSD probe, or a POST whose body is not a
# parseable methodCall.
priority: 27
tags: [attack, wordpress, xmlrpc]
# Request-aware xmlrpc.php fallback for the non-dispatch requests. Same PREFIXED-path scope as
# rule 26 (the bare /xmlrpc.php is served from the exact store before the attack tier). The
# `contains` needle gives the runtime a cheap, case-insensitive path pre-filter (it may over-select;
# the authoritative regex then rejects); the anchored, case-SENSITIVE regex enforces the real
# /xmlrpc.php segment boundary (so /notxmlrpc.php never matches) while allowing PATH_INFO.
match:
  - in: path
    contains: 'xmlrpc.php'
  - in: path
    regex: '(?:^|/)xmlrpc\.php(?:/|$)'
    ci: false
status: 405
behavior: branch
branch:
  cases:
    # GET /xmlrpc.php?rsd — the Really Simple Discovery document a real WordPress serves.
    - when: { in: query, regex: '(?:^|&)rsd(?:[=&]|$)' }
      response:
        status: 200
        headers: { Content-Type: "text/xml; charset=UTF-8" }
        body: |
          <?xml version="1.0" encoding="UTF-8"?>
          <rsd version="1.0" xmlns="http://archipelago.phrasewise.com/rsd">
            <service>
              <engineName>WordPress</engineName>
              <engineLink>https://wordpress.org/</engineLink>
              <homePageLink>https://{{persona.company.domain}}/</homePageLink>
              <apis>
                <api name="WordPress" blogID="1" preferred="true" apiLink="https://{{persona.company.domain}}/xmlrpc.php" />
                <api name="Movable Type" blogID="1" preferred="false" apiLink="https://{{persona.company.domain}}/xmlrpc.php" />
                <api name="MetaWeblog" blogID="1" preferred="false" apiLink="https://{{persona.company.domain}}/xmlrpc.php" />
                <api name="Blogger" blogID="1" preferred="false" apiLink="https://{{persona.company.domain}}/xmlrpc.php" />
                <api name="WP-API" blogID="1" preferred="false" apiLink="https://{{persona.company.domain}}/wp-json/" />
              </apis>
            </service>
          </rsd>
    # A POST reaching this rule carried no parseable methodName, so it is a malformed request body:
    # the authentic IXR parse fault, HTTP 200 with the code inside the XML. The `method` surface
    # tells this apart from a true GET (which has an empty body too) so an empty/garbage POST gets
    # -32700 here rather than the 405 below. Byte structure matches IXR_Error::getXml(). Case-
    # SENSITIVE (ci:false): a lowercase `post` fails WordPress's `'POST' != REQUEST_METHOD` check and
    # gets the 405 base, never this parse fault.
    - when: { in: method, regex: '^POST$', ci: false }
      response:
        status: 200
        headers: { Content-Type: "text/xml; charset=UTF-8" }
        body: |
          <?xml version="1.0" encoding="UTF-8"?>
          <methodResponse>
            <fault>
              <value>
                <struct>
                  <member>
                    <name>faultCode</name>
                    <value><int>-32700</int></value>
                  </member>
                  <member>
                    <name>faultString</name>
                    <value><string>parse error. not well formed</string></value>
                  </member>
                </struct>
              </value>
            </fault>
          </methodResponse>
# No branch default: a GET (or any non-POST) without ?rsd falls through to this base — the exact
# plain-text 405 a real WordPress returns. The charset has NO space after the semicolon: real WP
# emits it via header('Content-Type: text/plain') + PHP's default_charset append. Double-quoted
# scalar so there is NO trailing newline (a block scalar would add one, a byte-diff tell against
# the real die() output).
response:
  headers:
    Content-Type: "text/plain;charset=UTF-8"
    Allow: "POST"
  body: "XML-RPC server accepts POST requests only."
expect: ['XML-RPC server accepts POST requests only.', 'Allow']
