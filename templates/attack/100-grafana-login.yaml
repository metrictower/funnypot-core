id: attack-grafana-login
severity: high
# Priority 38, a free slot below the broad `in: request` archetypes 44-ssti-twig/45-ssti-numeric/
# 46-php-glastopf/50-sqli (no path constraint at all), so an injection-laced `user` value at
# /grafana/login still reaches THIS oracle instead of one of those generic bodies — the same fix
# 97-wp-login.yaml (39), 98-cpsrvd-login.yaml (42), and 99-phppgadmin-login.yaml (43) already apply
# for the same class of collision.
priority: 38
tags: [attack, grafana, panel, login, credential-oracle]
owns_path: [/grafana/login]
# Request-aware Grafana /grafana/login credential ORACLE, coherent with route 379's login shell
# (Grafana 10.4.2, appSubUrl /grafana). Route 379 keys GET /grafana/login, and resolveEntry falls a
# login POST back onto that GET key — so without owns_path a POST would be answered by route 379's
# static shell. This rule claims the path via owns_path so the POST reaches the attack tier ahead of
# that static stub (the override is load-bearing here, not insurance).
#
# ZERO EXECUTION: the ONLY body field read is the bounded `user` field, captured only to reflect
# nothing (the response is fully static regardless) — it is NEVER reflected. There is NO success path:
# real Grafana answers bad credentials with a static 401 `password-auth.failed` JSON body; it never
# sets a `grafana_session` cookie until login succeeds (route 379's cookie is pre-auth chrome only,
# unrelated to this failure path). Single static failure body — no `behavior: branch` needed. Gated to
# POST: a GET (or any non-POST verb) misses the method condition, so the override declines and falls
# back to route 379's GET login shell.
#
# PATH/METHOD/BODY MATCH STAY AS PERMISSIVE AS owns_path: ownsPath() claims any case/trailing-slash
# variant of /grafana/login, so a stricter match here would DECLINE on a variant the override already
# claimed and fall back to route 379's GET login shell for what is really a POST credential attempt.
# That fallback is benign here (a login shell, not a fake login success), but the match is kept
# consistent with the other three login oracles for the same reason: the response never reads `user`,
# so making the capture optional (matches with no `user` field, or no body at all) cannot change what
# gets served.
#
# The trailing-slash tolerance is scoped to the `grafana/login` branch only — the bare `login` alias
# (any single last segment named `login`, `grafana/` prefix or not) keeps its EXACT pre-existing shape,
# no trailing slash. That alias already overlaps 98-cpsrvd-login.yaml's owned `/login/` on the
# no-trailing-slash form (this rule sorts first, priority 38 < 42) — a pre-existing, harmless
# oracle-vs-oracle mismatch (both are safe fake-failure responses), not a safety bug. Adding trailing-
# slash tolerance to that bare alias too would newly swallow cpsrvd's owned `/login/` form and break
# its tests; keeping it exact avoids widening that overlap while still fixing the real target here.
match:
  - in: path
    regex: '(?:^|/)(?:grafana/login/?|login)$'
    ci: true
  - in: method
    regex: '^POST$'
    ci: true
  - in: body
    regex: '(?:"user"\s*:\s*"([^"]{0,64})")?'   # optional: capture-gate only when present, never reflected
    capture: true
    ci: false
status: 401
response:
  headers:
    Content-Type: "application/json"
    X-Content-Type-Options: "nosniff"
    X-Frame-Options: "deny"
    X-XSS-Protection: "1; mode=block"
    Cache-Control: "no-store"
  body: '{"statusCode":401,"messageId":"password-auth.failed","message":"Invalid username or password"}'
expect: ['password-auth.failed']
