id: route-phpmyadmin-changelog
priority: 375
# Brand-new page: the phpMyAdmin ChangeLog file (no nuclei template at this path). A version-recon
# scanner reads /phpmyadmin/ChangeLog to lift the exact phpMyAdmin version from its top entry. Served
# text/plain (the file's real type; a text/html tell would drop to minimal synth). The version matches
# the /phpmyadmin/ login footer (5.2.x) — one host, one install. phpMyAdmin manages MySQL/MariaDB, so
# this is coherent with the persona WordPress MySQL db; it never claims Postgres. Entries mirror the
# real upstream RELEASE_5_2_1 ChangeLog (the `- issue #NNNNN` format, verbatim release dates); issue
# ids are 5-digit and non-9-led, dates are hyphenated (no bare 6-digit run).
new_page:
  method: GET
  paths: ['/phpmyadmin/ChangeLog']
  sig: 0
  status: 200
  severity: info
  tags: [phpmyadmin, version, disclosure]
  name: 'phpMyAdmin ChangeLog (version disclosure)'
  body_words: ['phpMyAdmin', 'ChangeLog']
response:
  headers:
    Content-Type: "text/plain; charset=utf-8"
  body: |
    phpMyAdmin - ChangeLog
    ======================

    5.2.1 (2023-02-07)
    - issue #17522 Fix case where the routes cache file is invalid
    - issue #17506 Fix error when configuring 2FA without XMLWriter or Imagick
    - issue        Fix blank page when some error occurs
    - issue #17519 Fix Export pages not working in certain conditions
    - issue #17496 Fix error in table operation page when partitions are broken
    - issue #17271 Fix database names not showing on Processes tab

    5.2.0 (2022-05-10)
    - issue #16521 Upgrade Bootstrap to version 5
    - issue #16521 Drop support for Internet Explorer and others
    - issue        Upgrade to shapefile 3
    - issue #16555 Bump minimum PHP version to 7.2

    5.1.3 (2022-02-10)
    - issue #17308 Fix broken pagination links in the navigation sidebar
    - issue #17331 Fix MariaDB has no support for system variable "disabled_storage_engines"
    - issue #17315 Fix unsupported operand types in Results.php when running "SHOW PROCESSLIST" SQL query

    For older entries see https://www.phpmyadmin.net/old-stable/
taunt: { mode: line, open: '#' }
expect:
  - '5.2.1 (2023-02-07)'
  - 'phpMyAdmin - ChangeLog'
