id: route-confluence-dashboard
priority: 420
# FP-0465: Confluence front-door dashboard carrying the version fingerprint CVE-2023-22515 scanners
# grep for. The 22515 detector matches `<span id='footer-build-information'>8.5.1</span>` against
# `8\.(0\.[0-4]|1\.[0-4]|2\.[0-3]|3\.[0-2]|4\.[0-2]|5\.[0-1])`; the version here is
# {{persona.confluence.version}} (pool entirely <=8.5.1), so every deploy renders an affected-side,
# per-deploy-varying version — one coherent value across the dashboard, server-info and setup surfaces.
# Inert: static HTML, no request byte reflected, served from any origin. `footer-build-information` is
# the genuine Atlassian footer DOM id (a real product artifact, NOT a scanner/CRS matcher string), so
# the fingerprint invariant is untouched. Version is a dotted literal (no bare 6-digit run). Self-
# contained inline CSS (no external theme asset to 301-canonicalise). severity high (the new_page
# ceiling; a critical page would never serve).
new_page:
  method: GET
  paths: ['/dashboard.action']
  sig: 0
  status: 200
  severity: high
  tags: [confluence, atlassian, dashboard, version, disclosure]
  name: 'Confluence dashboard (version disclosure)'
  body_words: ['Confluence', 'footer-build-information']
response:
  headers:
    Content-Type: "text/html;charset=UTF-8"
  body: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - Confluence</title>
    <style>
    body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;color:#172b4d;background:#fff}
    #header{background:#fff;border-bottom:2px solid #0052cc;padding:0 20px;height:48px;display:flex;align-items:center}
    #header .logo{font-weight:700;color:#0052cc;font-size:18px}
    #main{max-width:960px;margin:24px auto;padding:0 20px}
    h1{font-size:24px;font-weight:500;margin:0 0 16px}
    .panel{background:#f4f5f7;border:1px solid #dfe1e6;border-radius:3px;padding:16px;margin-bottom:16px}
    #footer{border-top:1px solid #dfe1e6;color:#6b778c;font-size:12px;text-align:center;padding:16px;margin-top:40px}
    </style>
    </head>
    <body>
    <div id="header"><span class="logo">Confluence</span></div>
    <div id="main">
    <h1>Dashboard</h1>
    <div class="panel">Welcome to Confluence. Recent spaces and updates appear here once you sign in.</div>
    </div>
    <div id="footer">
    Powered by Atlassian Confluence <span id='footer-build-information'>{{persona.confluence.version}}</span>
    </div>
    </body>
    </html>
expect:
  - "footer-build-information"
