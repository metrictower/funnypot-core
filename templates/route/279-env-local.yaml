id: route-envfile-local
priority: 279
# Brand-new page: a dropped /.env.local. Same host identity as /.env.production (same DB
# name/user/password and the same AWS/Stripe/SendGrid/JWT secrets — one host, one identity), but
# it declares a LOCAL environment (APP_ENV=local, APP_DEBUG=true, DB_HOST=127.0.0.1) so the two
# dropped files read as the same deployment's prod and local configs, not a byte-identical clone.
# The id deliberately avoids the substring `env-`: the /.env enrich (route-dotenv) selects on
# template needles and findRule is global — an id carrying `env-` would let that enrich hijack this
# page and serve it as application/octet-stream instead of text/plain.
new_page:
  method: GET
  paths: ['/.env.local']
  sig: 0
  status: 200
  severity: high
  tags: [exposure, config-disclosure, secrets]
  name: 'Exposed environment file (.env.local)'
  body_words: ['AWS_SECRET_ACCESS_KEY']
response:
  headers:
    Content-Type: "text/plain; charset=utf-8"
  body: |
    APP_ENV=local
    APP_DEBUG=true

    DB_CONNECTION=pgsql
    DB_HOST=127.0.0.1
    DB_PORT=5432
    DB_DATABASE={{persona.db.name}}
    DB_USERNAME={{persona.db.user}}
    DB_PASSWORD={{persona.db.password}}

    AWS_ACCESS_KEY_ID={{persona.cloud.aws.accessKeyId}}
    AWS_SECRET_ACCESS_KEY={{persona.cloud.aws.secretKey}}
    AWS_DEFAULT_REGION={{persona.cloud.aws.region}}

    STRIPE_SECRET_KEY={{persona.cloud.stripe.secretKey}}
    SENDGRID_API_KEY={{persona.cloud.sendgrid.apiKey}}
    JWT_SECRET={{persona.secret.jwt}}
taunt: { mode: line, open: '#' }
expect:
  - 'APP_ENV=local'
  - 'APP_DEBUG=true'
  - 'AWS_ACCESS_KEY_ID=AKIA'
  - 'AWS_SECRET_ACCESS_KEY='
  - 'STRIPE_SECRET_KEY=sk_live_'
  - 'SENDGRID_API_KEY=SG.'
