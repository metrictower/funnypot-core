id: route-wp-json
priority: 344
# Brand-new page: the WordPress REST API index at /wp-json — the discovery root a scanner reads to
# enumerate namespaces, routes and whether user enumeration is open. Persona-seeded name/url. Served
# application/json. Opens with a lone `{` for the JSON taunt. No numbers that form a denied digit run.
new_page:
  method: GET
  paths: ['/wp-json']
  sig: 0
  status: 200
  severity: info
  tags: [exposure, api, wordpress, discovery]
  name: 'Exposed WordPress REST API index'
  body_words: ['namespaces', 'routes']
response:
  headers:
    Content-Type: "application/json"
  body: |
    {
    "name": "{{persona.company.name}}",
    "description": "{{persona.company.name}} — Just another WordPress site",
    "url": "https://{{persona.company.domain}}",
    "home": "https://{{persona.company.domain}}",
    "gmt_offset": "0",
    "timezone_string": "",
    "namespaces": [ "oembed/1.0", "wp/v2", "wp-site-health/v1" ],
    "authentication": [],
    "routes": {
      "/": { "namespace": "", "methods": [ "GET" ] },
      "/wp/v2/posts": { "namespace": "wp/v2", "methods": [ "GET", "POST" ] },
      "/wp/v2/users": { "namespace": "wp/v2", "methods": [ "GET", "POST" ] }
    },
    "_links": {
      "help": [ { "href": "https://developer.wordpress.org/rest-api/" } ]
    }
    }
taunt: { mode: inline_field, key: '_comment' }
expect:
  - '"namespaces":'
  - '"wp/v2"'
  - '"routes":'
