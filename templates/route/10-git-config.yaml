id: route-git-config
priority: 10
# Exposed .git/config — believable git config, decoy example.com remote, no credentials.
match:
  template_needle: [git-config, git]
response:
  headers:
    Content-Type: "text/plain; charset=utf-8"
  body: |
    [core]
    	repositoryformatversion = 0
    	filemode = true
    	bare = false
    	logallrefupdates = true
    [remote "origin"]
    	url = https://git.example.com/internal/{{pick:app,platform,api,web,core}}.git
    	fetch = +refs/heads/*:refs/remotes/origin/*
    [branch "{{pick:main,master,develop,release}}"]
    	remote = origin
    	merge = refs/heads/{{pick:main,master,develop,release}}
taunt: { mode: line, open: '#' }
expect: ['[core]', '[remote "origin"]']
