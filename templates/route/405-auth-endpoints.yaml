id: route-surface-auth
priority: 405
# Brand-new page (FP-0233): the auth archetype — an RFC 7807 problem+json 401, the shape the OIDC
# discovery document (395) and the OpenAPI docs point their auth endpoints at. Maps to /auth,
# /auth/login, /auth/token, /auth/userinfo and /api/v2/auth/login (all GET here; the corpus already
# carries the POST forms). /api/v2/auth/login stays COMPILED for harmless extra coverage, but since
# FP-0278 the 345 /api/v2 index links /auth/login instead (no robots root covers /api/v2/auth/login),
# so nothing advertises /api/v2/auth/login — it is reachable-if-guessed, never a linked-but-unadvertised
# tell. /auth/userinfo (FP-0379) is the OIDC userinfo endpoint 395 now advertises; this 401 is its
# canonical baseline for a bearer-less request in EVERY mode. With attack emulation off it is the only
# claimant. With attack emulation on, 123-oidc-userinfo-accept owns_path and matches ONLY a bearer-bearing
# request (serving the 200 almost-admin upgrade); a bearer-less request DECLINES that rule and falls through
# to this same 401 baseline — served here via RouteTemplateEmulator, so its taunt/injection carrier stays
# byte-coherent with /auth, /auth/login and /auth/token in every style (code-review M1).
# Inert: GET, 401, no request byte reflected, fully persona-seeded (serves from any
# origin). A 401 is the honest answer an unauthenticated GET of an auth endpoint gives — so the
# discovery links resolve to a real inert decoy, not a 404 hole. Content-Type is the problem+json
# media type (the endpoint's real error type). Opens with a lone `{` for the inline-field JSON
# taunt. The status value is a bare 3-digit code (no 6-digit run).
new_page:
  method: GET
  paths: ['/auth', '/auth/login', '/auth/token', '/auth/userinfo', '/api/v2/auth/login']
  sig: 0
  status: 401
  severity: info
  weight: 100000
  tags: [exposure, api, discovery]
  name: 'Exposed auth endpoint (401)'
  body_words: ['"title":', '"detail":']
response:
  headers:
    Content-Type: "application/problem+json"
  body: |
    {
    "type": "about:blank",
    "title": "Unauthorized",
    "status": 401,
    "detail": "A valid bearer token is required to access this endpoint."
    }
taunt: { mode: inline_field, key: '_comment' }
expect:
  - '"title": "Unauthorized"'
  - '"status": 401'
  - '"detail":'
