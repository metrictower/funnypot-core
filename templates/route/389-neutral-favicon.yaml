id: route-neutral-favicon
priority: 389
# FP-0230 persona-coherent favicon. Self-generated collision blob (a generic self-drawn ring
# mark, NO vendor artwork) whose Shodan favicon hash == 891788695. Provenance + forge:
# resources/favicons/README.md. Served image/x-icon (no charset); bytes base64-at-rest.
new_page:
  method: GET
  paths: ['/favicon.ico']
  sig: 0                # a favicon fetch always serves (not a probe-gated root entry)
  status: 200
  severity: info
  tags: [favicon, favicon, exposure]
  name: 'Neutral favicon'
  weight: 25            # win the polluted /favicon.ico key often; a neutral (no known-product hash) icon
response:
  headers: { Content-Type: 'image/x-icon' }
  body_b64: ''
