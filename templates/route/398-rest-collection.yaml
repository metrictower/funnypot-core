id: route-surface-collection
priority: 398
# Brand-new page (FP-0233): the REST collection archetype — a paginated JSON envelope
# ({"data":[...],"page":,"per_page":,"total":}) shared by the collection endpoints the docs +
# sitemap advertise (/api/v1/users, /api/v1/orders, /admin/users, /users, /api/v2/*). One
# structurally distinct SHAPE mapped to several literal paths: the render is persona-seeded (not
# path-seeded), so these paths serve byte-identically — that is fine for resolution (every path is
# a real inert decoy) and the archetype's job is to be one distinct crawl node, not many (FP-0174).
# FP-0278: paths: is the fleet-identical SUPERSET of collection nouns (Support\SurfaceGraph::
# collectionPaths — every noun under /api/v1,/api/v2,/,/admin), so every noun ANY deploy can advertise
# resolves to this inert decoy; a deploy advertises only its seeded subset (docs/sitemap/nav), so a
# prober guessing an un-advertised noun still lands on a coherent 200 (never an advertised-but-404).
# The pool is grep-verified corpus-unowned, so each compiled key is surface-owned at weight 100000.
# A test pins paths: === SurfaceGraph::collectionPaths() so the pool and the artifact never drift.
# Inert: GET, 200, no request byte reflected, fully persona-seeded (serves from any origin). The
# envelope carries NO pager `_links` (review fix): a `next` link with total:3 + per_page:25 is a
# self-contradiction (page 1 of 3 items has no next page), and a `self` pointer naming /api/v1/users
# contradicts the same bytes served at /orders, /admin/users, … — total:3 with no next/self is
# internally coherent for a small collection served at several paths. Opens with a lone `{` for the
# inline-field JSON taunt. Row ids are dec:5 (no bare 6-digit run).
new_page:
  method: GET
  paths:
    - '/api/v1/users'
    - '/api/v2/users'
    - '/users'
    - '/admin/users'
    - '/api/v1/orders'
    - '/api/v2/orders'
    - '/orders'
    - '/admin/orders'
    - '/api/v1/customers'
    - '/api/v2/customers'
    - '/customers'
    - '/admin/customers'
    - '/api/v1/accounts'
    - '/api/v2/accounts'
    - '/accounts'
    - '/admin/accounts'
    - '/api/v1/invoices'
    - '/api/v2/invoices'
    - '/invoices'
    - '/admin/invoices'
    - '/api/v1/products'
    - '/api/v2/products'
    - '/products'
    - '/admin/products'
    - '/api/v1/members'
    - '/api/v2/members'
    - '/members'
    - '/admin/members'
    - '/api/v1/clients'
    - '/api/v2/clients'
    - '/clients'
    - '/admin/clients'
    - '/api/v1/projects'
    - '/api/v2/projects'
    - '/projects'
    - '/admin/projects'
    - '/api/v1/subscriptions'
    - '/api/v2/subscriptions'
    - '/subscriptions'
    - '/admin/subscriptions'
    - '/api/v1/payments'
    - '/api/v2/payments'
    - '/payments'
    - '/admin/payments'
    - '/api/v1/tickets'
    - '/api/v2/tickets'
    - '/tickets'
    - '/admin/tickets'
  sig: 0
  status: 200
  severity: info
  weight: 100000
  tags: [exposure, api, discovery]
  name: 'Exposed REST collection'
  body_words: ['"data":', '"per_page":']
response:
  headers:
    Content-Type: "application/json"
  body: |
    {
    "data": [
      { "id": {{fake.rc_id1:dec:5}}, "ref": "{{fake.rc_ref1:hex:12}}", "name": "{{fake.person.full:rc1}}", "state": "active", "created_at": "2024-11-04T09:12:33Z" },
      { "id": {{fake.rc_id2:dec:5}}, "ref": "{{fake.rc_ref2:hex:12}}", "name": "{{fake.person.full:rc2}}", "state": "active", "created_at": "2024-12-18T14:47:05Z" },
      { "id": {{fake.rc_id3:dec:5}}, "ref": "{{fake.rc_ref3:hex:12}}", "name": "{{fake.person.full:rc3}}", "state": "disabled", "created_at": "2025-01-27T21:03:58Z" }
    ],
    "page": 1,
    "per_page": 25,
    "total": 3
    }
taunt: { mode: inline_field, key: '_comment' }
expect:
  - '"data":'
  - '"per_page": 25'
  - '"total": 3'
