id: route-surface-collection
priority: 398
# Brand-new page (FP-0233): the REST collection archetype — a paginated JSON envelope
# ({"data":[...],"page":,"per_page":,"total":,"_links":}) shared by the collection endpoints the
# docs + sitemap advertise (/api/v1/users, /api/v1/orders, /admin/users, /users, /api/v2/*). One
# structurally distinct SHAPE mapped to several literal paths: the render is persona-seeded (not
# path-seeded), so these paths serve byte-identically — that is fine for resolution (every path is
# a real inert decoy) and the archetype's job is to be one distinct crawl node, not many (FP-0174).
# Inert: GET, 200, no request byte reflected, fully persona-seeded (serves from any origin). The
# _links pager URLs are absolute apex (one host identity; linter ignores scheme URLs). Opens with a
# lone `{` for the inline-field JSON taunt. Row ids are dec:5 (no bare 6-digit run).
new_page:
  method: GET
  paths: ['/api/v1/users', '/api/v1/orders', '/admin/users', '/users', '/api/v2/users', '/api/v2/orders']
  sig: 0
  status: 200
  severity: info
  weight: 100000
  tags: [exposure, api, discovery]
  name: 'Exposed REST collection'
  body_words: ['"data":', '"per_page":']
response:
  headers:
    Content-Type: "application/json"
  body: |
    {
    "data": [
      { "id": {{fake.rc_id1:dec:5}}, "ref": "{{fake.rc_ref1:hex:12}}", "name": "{{fake.person.full:rc1}}", "state": "active", "created_at": "2024-11-04T09:12:33Z" },
      { "id": {{fake.rc_id2:dec:5}}, "ref": "{{fake.rc_ref2:hex:12}}", "name": "{{fake.person.full:rc2}}", "state": "active", "created_at": "2024-12-18T14:47:05Z" },
      { "id": {{fake.rc_id3:dec:5}}, "ref": "{{fake.rc_ref3:hex:12}}", "name": "{{fake.person.full:rc3}}", "state": "disabled", "created_at": "2025-01-27T21:03:58Z" }
    ],
    "page": 1,
    "per_page": 25,
    "total": 3,
    "_links": {
      "self": "https://{{persona.company.domain}}/api/v1/users?page=1",
      "next": "https://{{persona.company.domain}}/api/v1/users?page=2"
    }
    }
taunt: { mode: inline_field, key: '_comment' }
expect:
  - '"data":'
  - '"per_page": 25'
  - '"_links":'
