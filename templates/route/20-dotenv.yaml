id: route-dotenv
priority: 20
# Exposed production .env for a believable SaaS. Every value is an inert decoy rendered per
# attacker (so the file can't be fingerprinted by a constant), but each is shaped to match the
# exact regex a secret scanner (gitleaks / trufflehog / nuclei) fires on — so an attacker who runs
# their own tooling over the loot gets a screen full of "valid" findings and chases dead keys.
# Inert by construction: the host is the persona's own coined vanity domain (non-resolving), the
# RDS/ElastiCache hostnames carry random cluster ids that resolve nowhere, and the key bodies
# authenticate nowhere. AWS id + secret are kept adjacent because trufflehog only emits an AWS
# finding when it co-locates the pair.
# Coherence (FP-0284): the company/domain, the DB story and the AWS region all render from the ONE
# per-deploy PersonaIdentity, so this /.env agrees with wp-config, /.aws/config, terraform.tfstate
# and the /@fs mirror on a single region and DB story per deployment — never two regions or two DB
# hosts in one deploy. The region drives both the RDS host segment and the ElastiCache short code.
# The exposed-.env nuclei bundle is keyed by CVE id (not an "env" string), so match it by a
# required body word instead of a template-name needle — APP_DEBUG= is specific to a .env file.
# The needles stay narrow on purpose: a broad `env-` would substring-hijack unrelated bundles
# (e.g. `reactapp-env-js` at /config.js, served by route-react-runtime-env) and dress them as a
# Laravel .env. The real /.env is covered by the APP_DEBUG= body axis, not by a name needle.
match:
  template_needle: [dotenv, exposed-config, environment]
  body_word_contains: ['APP_DEBUG=']
response:
  headers:
    # The exposed-.env nuclei template (CVE-2017-16894) matches a Content-Type of
    # application/octet-stream, so serve that or the rich body fails the bundle's header matcher.
    Content-Type: "application/octet-stream"
  body: |
    APP_NAME={{persona.company.name}}
    APP_ENV=production
    APP_KEY=base64:{{fake.app_key:b64:44}}
    APP_DEBUG=false
    APP_URL=https://{{persona.company.domain}}

    LOG_CHANNEL=stack

    DB_CONNECTION=pgsql
    DB_HOST=db-{{fake.pghost:hex:12}}.cluster-cg{{fake.pgacct:hex:9}}.{{persona.cloud.aws.region}}.rds.amazonaws.com
    DB_PORT=5432
    DB_DATABASE={{persona.db.name}}
    DB_USERNAME={{persona.db.user}}
    DB_PASSWORD={{persona.db.password}}

    REDIS_HOST=cache-{{fake.redishost:hex:12}}.0001.{{persona.cloud.aws.regionCode}}.cache.amazonaws.com
    REDIS_PORT=6379
    REDIS_PASSWORD={{fake.redispass:hex:32}}

    # AWS — S3 uploads + SES
    AWS_ACCESS_KEY_ID={{persona.cloud.aws.accessKeyId}}
    AWS_SECRET_ACCESS_KEY={{persona.cloud.aws.secretKey}}
    AWS_DEFAULT_REGION={{persona.cloud.aws.region}}
    AWS_BUCKET={{persona.company.slug}}-prod-uploads

    # Stripe — billing
    STRIPE_KEY=pk_live_{{fake.stripe_pk:hex:24}}
    STRIPE_SECRET=sk_live_{{fake.stripe_sk:hex:24}}
    STRIPE_WEBHOOK_SECRET=whsec_{{fake.stripe_whsec:hex:32}}

    # Mail — SendGrid
    MAIL_MAILER=smtp
    MAIL_HOST=smtp.sendgrid.net
    MAIL_PORT=587
    MAIL_USERNAME=apikey
    SENDGRID_API_KEY=SG.{{fake.sg1:hex:22}}.{{fake.sg2:hex:43}}

    JWT_SECRET={{fake.jwtsecret:hex:64}}
    SLACK_WEBHOOK_URL=https://hooks.slack.com/services/T{{fake.slackt:hex:8}}/B{{fake.slackb:hex:8}}/{{fake.slacktok:hex:24}}
taunt: { mode: line, open: '#' }
expect:
  - 'APP_KEY=base64:'
  - 'AWS_ACCESS_KEY_ID=AKIA'
  - 'AWS_SECRET_ACCESS_KEY='
  - 'STRIPE_SECRET=sk_live_'
  - 'whsec_'
  - 'SENDGRID_API_KEY=SG.'
