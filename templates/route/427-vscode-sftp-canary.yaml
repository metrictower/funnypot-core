id: route-vscode-sftp
priority: 427
# FP-0423 (Part 1): enrich (NOT new_page) the corpus `vscode-sftp` bundle — the keys /.vscode/sftp.json,
# /sftp.json, /.config/sftp.json (body words name/host/protocol, typed Content-Type application/json).
# Minimal synth emits only those bare words ("name":\n"protocol":\n"host":) — INVALID JSON with no
# credentials, so INtrack's vscode_sftp_worm.py extracts None and never pivots. Here we dress it into a
# believable, valid-JSON VS Code SFTP config carrying a SEEDED canary credential, so the worm parses it,
# grabs the creds, and tries them against SSH/FTP (the cross-protocol pivot — correlated app-side, FP-0562).
#
# Needle is the narrow `vscode-sftp` (the bare `vscode` would hijack 13 unrelated keys). The credential is
# {{persona.db.user}}/{{persona.db.password}} — DEPLOY-STABLE (so a re-scan sees one identity and the app
# tier can recognise it on an SSH/FTP login) and already re-rolled past the \b9\d{5}\b denylist by
# PersonaIdentity::password(), so no new fingerprint risk; coherent with the SAME creds leaked in /.env,
# /secrets.json and /.vscode/settings.json (one credential story per deploy). {{fake.*}} is deliberately
# NOT used: it is per-request-seeded, so it would not be correlatable. host is the persona's non-resolving
# vanity domain; remotePath is the /var/www/<slug> docroot (coherent with phpinfo/FPD, not /var/www/html).
# FLAT object, scalar values only — INtrack's extractor is the naive regex {[^}]+}, so a nested object
# would truncate before the credentials. The inline_field _comment taunt corpus is brace-free, so the
# naive regex still spans the whole object. INERT: no request byte reflected, no real credential.
match:
  template_needle: [vscode-sftp]
response:
  headers:
    Content-Type: "application/json"
  body: |
    {
    "name": "{{persona.company.name}} production",
    "host": "deploy.{{persona.company.domain}}",
    "protocol": "sftp",
    "port": 22,
    "username": "{{persona.db.user}}",
    "password": "{{persona.db.password}}",
    "remotePath": "/var/www/{{persona.company.slug}}",
    "uploadOnSave": false
    }
taunt: { mode: inline_field, key: '_comment' }
expect:
  - '"name":'
  - '"host":'
  - '"protocol":'
  - '"username":'
  - '"password":'
