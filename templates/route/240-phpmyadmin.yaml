id: route-phpmyadmin
priority: 240
# Brand-new page: a phpMyAdmin login screen (no nuclei template at these paths).
new_page:
  method: GET
  paths: ['/phpmyadmin/', '/phpMyAdmin/', '/pma/', '/phpmyadmin/index.php']
  sig: 0
  status: 200
  severity: high
  tags: [phpmyadmin, panel, exposure]
  name: 'phpMyAdmin login'
  body_words: ['phpMyAdmin']
set_cookie: phpMyAdmin
response:
  headers:
    Content-Type: "text/html; charset=utf-8"
  body: |
    <!DOCTYPE HTML>
    <html lang="en"><head><title>phpMyAdmin</title>
    <link rel="stylesheet" type="text/css" href="phpmyadmin.css.php" />
    </head>
    <body class="loginform">
    <div class="container">
    <h1>Welcome to phpMyAdmin</h1>
    <form method="post" action="index.php" name="login_form" class="login">
    <fieldset>
    <legend>Log in</legend>
    <label for="input_username">Username:</label>
    <input type="text" name="pma_username" id="input_username" value="root" />
    <label for="input_password">Password:</label>
    <input type="password" name="pma_password" id="input_password" />
    </fieldset>
    <input type="submit" value="Go" id="input_go" />
    </form>
    <div class="footer">phpMyAdmin {{pick:5.2.1,5.1.3,4.9.7}}</div>
    </div>
    </body></html>
taunt: { mode: block, open: '<!--', close: '-->' }
expect: ['phpMyAdmin', 'pma_username']
