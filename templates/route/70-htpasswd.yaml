id: route-htpasswd
priority: 70
# Exposed .htpasswd — modern bcrypt hashes, per-attacker and inert. $2y$10$ cost matches current
# Apache/nginx htpasswd -B output, so an attacker's own gitleaks/trufflehog run lights up on real
# bcrypt findings while the bodies authenticate nowhere.
match:
  template_needle: [htpasswd]
response:
  headers:
    Content-Type: "text/plain; charset=utf-8"
  body: |
    admin:$2y$10${{fake.bcadmin:hex:53}}
    deploy:$2y$10${{fake.bcdeploy:hex:53}}
    backup:$2y$10${{fake.bcbackup:hex:53}}
    webmaster:$2y$10${{fake.bcwebmaster:hex:53}}
    jenkins:$2y$10${{fake.bcjenkins:hex:53}}
    legacy:{SHA}{{fake.shalegacy:b64:27}}=
taunt: { mode: line, open: '#' }
expect: ['$2y$', '{SHA}']
