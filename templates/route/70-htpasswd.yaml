id: route-htpasswd
priority: 70
# Exposed .htpasswd — {SHA} markers with inert fakeHex-derived hash bodies, never real.
match:
  template_needle: [htpasswd]
response:
  headers:
    Content-Type: "text/plain; charset=utf-8"
  body: |
    admin:{SHA}{{fake.sha-admin:b64:28}}
    deploy:{SHA}{{fake.sha-deploy:b64:28}}
    backup:{SHA}{{fake.sha-backup:b64:28}}
    webmaster:{SHA}{{fake.sha-webmaster:b64:28}}
taunt: { mode: line, open: '#' }
expect: ['{SHA}']
