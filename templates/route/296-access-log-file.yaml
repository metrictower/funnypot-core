id: route-access-log
priority: 296
# Enrich: the corpus routes /access.log, /logs/access.log and /application/logs/access.log to the
# `access-log-file` bundle (body word `"GET /`, header witness text/plain). Minimal synth would emit
# a bare `"GET /` line; here we dress a believable combined-format web access log — a browser
# session interleaved with the scanner traffic every public host sees. Client IPs come from a pool
# of real, routable public addresses (NO RFC-5737 doc ranges, which read as placeholder); three
# rotations of one 16-address pool give distinct-looking clients per seed. Referer/Host derive from
# the persona domain so the log agrees with this host's other disclosures.
#
# Number safety: IP octets and status codes are <=3 digits and split by non-word chars, so no octet
# can form a bare-6-digit run; response sizes use dec:3/dec:4 (never dec:6). The needle is the full
# upstream id — findRule is global. (/log/access.log ALSO carries this `access-log-file` needle, but
# its bundle is iceflow-witnessed, so the dedicated iceflow enrich (route-iceflow-vpn-log, priority
# 290) is checked first and serves the coherent ICEFLOW body there — this generic body never fires
# on that path.)
match:
  template_needle: [access-log-file]
response:
  headers:
    Content-Type: "text/plain; charset=utf-8"
