id: route-openapi-json
priority: 330
# Enrich: the corpus routes /openapi.json to two bundles — this rule dresses the `openapi` bundle
# (body words `openapi`, `paths`; header word `application/openapi+json`). The `openapi` needle is a
# bare generic substring — unique against the current corpus, but the needle-uniqueness guard
# (EmulatorBreadthTest) locks it so a future corpus refresh that introduced a colliding t-id fails CI
# before a release is signed. Minimal synth would emit the bare words; here we serve a real OpenAPI
# 3.0 document leaking this host's API surface and server URL. The description is framework-neutral
# (no docroot), so it never contradicts the Swagger 2.0 doc served at /v2/api-docs. The example
# Authorization value is a JWT-shaped token — a real HS256 header segment plus seed-derived payload
# and signature segments — matching the doc's own `bearerFormat: JWT`, NOT the raw HMAC signing
# secret the config pack discloses. The Content-Type is EXACTLY `application/openapi+json` — the media
# type the header word demands (plain application/json would miss it and drop the response to minimal
# synth). Body is byte-identical to the /swagger.json new_page for one host. Opens with a lone `{` so
# the JSON taunt keeps it parseable; the order id is dec:5 (never a bare 6-digit run). The `paths`
# body word is present.
match:
  template_needle: [openapi]
response:
  headers:
    Content-Type: "application/openapi+json"
  body: |
    {
    "openapi": "3.0.3",
    "info": {
      "title": "{{persona.company.name}} API",
      "description": "Internal REST API for {{persona.company.name}}. Not for public distribution.",
      "version": "1.8.2",
      "contact": { "email": "{{persona.user.admin.email}}" }
    },
    "servers": [
      { "url": "https://{{persona.company.domain}}", "description": "Production" }
    ],
    "paths": {
      "/api/v1/{{surface.noun:c1}}": {
        "get": {
          "summary": "List {{surface.noun:c1}}",
          "responses": { "200": { "description": "OK" }, "401": { "description": "Unauthorized" } }
        }
      },
      "/api/v1/{{surface.noun:c2}}": {
        "get": {
          "summary": "List {{surface.noun:c2}}",
          "responses": { "200": { "description": "OK" }, "401": { "description": "Unauthorized" } }
        }
      },
      "/api/v1/{{surface.noun:d1}}": {
        "get": {
          "summary": "Service {{surface.noun:d1}}",
          "responses": { "200": { "description": "OK" } }
        }
      },
      "/api/v1/{{surface.noun:d2}}": {
        "get": {
          "summary": "Service {{surface.noun:d2}}",
          "responses": { "200": { "description": "OK" }, "401": { "description": "Unauthorized" } }
        }
      },
      "/metrics": {
        "get": {
          "summary": "Prometheus metrics",
          "responses": { "200": { "description": "OK" } }
        }
      },
      "/webhooks": {
        "get": {
          "summary": "List webhook subscriptions",
          "responses": { "200": { "description": "OK" }, "401": { "description": "Unauthorized" } }
        }
      },
      "/auth/login": {
        "post": {
          "summary": "Authenticate and receive a bearer token",
          "responses": { "200": { "description": "OK" }, "400": { "description": "Bad Request" }, "401": { "description": "Unauthorized" } }
        }
      },
      "/auth/token": {
        "post": {
          "summary": "Exchange credentials for a bearer token",
          "responses": { "200": { "description": "OK" }, "401": { "description": "Unauthorized" } }
        }
      }
    },
    "components": {
      "securitySchemes": {
        "bearerAuth": { "type": "http", "scheme": "bearer", "bearerFormat": "JWT" },
        "apiKey": { "type": "apiKey", "in": "header", "name": "X-API-Key" }
      },
      "examples": {
        "authToken": { "summary": "Example Authorization header", "value": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ{{fake.jwtpayload:b64url:43}}.{{fake.jwtsig:b64url:43}}" }
      }
    }
    }
taunt: { mode: inline_field, key: '_comment' }
expect:
  - '"openapi": "3.0.3"'
  - '"paths"'
  - '"securitySchemes"'
  - 'Bearer '
