id: route-web-inf-web-xml
priority: 309
# Brand-new page: a leaked Java deployment descriptor at the exact /WEB-INF/web.xml path (the corpus
# only carries traversal/bypass variants of it). A believable Servlet 4.0 descriptor for a traditional
# Spring MVC WAR on Tomcat 9 — coherent with the manager table, catalina.out and the Actuator info
# block, all of which claim the same Tomcat 9 / Java 17 persona. INVARIANT: this is Servlet 4.0, whose
# namespace/types are `javax.*` (`http://xmlns.jcp.org/xml/ns/javaee`); Tomcat 10+ / Servlet 5.0 moved
# to `jakarta.*`, so this descriptor is only coherent while the persona's tomcat.version stays 9.0.x.
# The body is finite, static config text — nothing here is ever parsed or executed at runtime. It is
# deliberately inert: no DTD/DOCTYPE, no external entity or SYSTEM/PUBLIC identifier, no remote URL
# beyond the standard namespace/XSD identifiers, no credential, no upload/deploy action, no follow-up
# path this pack does not serve. The display name, application package and JNDI datasource name derive
# only from the persona company name/slug, so one host tells one story and two deploys differ.
new_page:
  method: GET
  paths: ['/WEB-INF/web.xml']
  sig: 0
  status: 200
  severity: medium
  tags: [tomcat, java, web-inf, exposure, information-disclosure]
  name: 'Exposed Java deployment descriptor (WEB-INF/web.xml)'
  body_words: ['<web-app', '<servlet-class>', '<url-pattern>']
response:
  headers:
    Content-Type: "application/xml"
  body: |
    <?xml version="1.0" encoding="UTF-8"?>
    <web-app xmlns="http://xmlns.jcp.org/xml/ns/javaee"
             xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
             xsi:schemaLocation="http://xmlns.jcp.org/xml/ns/javaee http://xmlns.jcp.org/xml/ns/javaee/web-app_4_0.xsd"
             version="4.0">
      <display-name>{{persona.company.name}}</display-name>
      <context-param>
        <param-name>spring.profiles.active</param-name>
        <param-value>production</param-value>
      </context-param>
      <context-param>
        <param-name>characterEncoding</param-name>
        <param-value>UTF-8</param-value>
      </context-param>
      <servlet>
        <servlet-name>dispatcher</servlet-name>
        <servlet-class>org.springframework.web.servlet.DispatcherServlet</servlet-class>
        <load-on-startup>1</load-on-startup>
      </servlet>
      <servlet-mapping>
        <servlet-name>dispatcher</servlet-name>
        <url-pattern>/</url-pattern>
      </servlet-mapping>
      <servlet>
        <servlet-name>api</servlet-name>
        <servlet-class>com.{{persona.company.slug}}.web.ApiServlet</servlet-class>
        <load-on-startup>2</load-on-startup>
      </servlet>
      <servlet-mapping>
        <servlet-name>api</servlet-name>
        <url-pattern>/api/*</url-pattern>
      </servlet-mapping>
      <session-config>
        <session-timeout>30</session-timeout>
      </session-config>
      <resource-ref>
        <res-ref-name>jdbc/{{persona.company.slug}}DataSource</res-ref-name>
        <res-type>javax.sql.DataSource</res-type>
        <res-auth>Container</res-auth>
      </resource-ref>
    </web-app>
taunt: { mode: block, open: '<!--', close: '-->' }
expect:
  - '<web-app'
  - 'version="4.0"'
  - '<servlet-class>'
  - '<url-pattern>'
  - 'javax.sql.DataSource'
