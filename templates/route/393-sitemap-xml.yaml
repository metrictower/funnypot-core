id: route-surface-sitemap
priority: 393
# Brand-new page (FP-0233): the crawl spine. A recon crawler (and a task-graph AI agent) reads
# /sitemap.xml to enumerate the whole surface in one GET, then spawns a follow-up per <loc>. This
# is the connected-graph lever: every <loc> here is a COMPILED literal endpoint or a compiled doc
# URL (the surface-graph new_page bundles 393-405 + the api-docs cluster 330-345), so every path a
# planner expands resolves to an inert decoy — no partial-tree tell over the advertised surface.
# FP-0278: the <loc> SET, ORDER and resource NOUNS are a per-deploy-seeded subset ({{surface.sitemap}}
# off the deploy identity seed via Support\SurfaceGraph), so two deploys expose different but
# internally-coherent graphs instead of one fleet-correlation tell — the spine paths (docs +
# well-known + /api,/api/v1) and the seeded noun paths stay advertised so nothing a doc/robots/nav
# links ever dangles, and the ops paths (/metrics,/status,/debug,/auth/token) are robots-only (a real
# site never sitemaps them). One host identity: every URL is the apex {{persona.company.domain}}
# (matching robots.txt and the OpenAPI servers[].url). Absolute <loc> URLs are what real sitemaps
# carry and are same-host so katana follows them; the route-integrity linter deliberately ignores
# scheme-prefixed URLs (they are not href/action/fetch/js-url spans), so tests/SurfaceGraphRoutingTest
# is the real enforcement that each <loc> resolves. Served application/xml (a sitemap's real type).
# Block XML comment taunt after the root element (valid XML misc-after-root). No bare 6-digit run.
new_page:
  method: GET
  paths: ['/sitemap.xml', '/sitemap', '/sitemap_index.xml']
  sig: 0
  status: 200
  severity: info
  weight: 100000
  tags: [exposure, api, sitemap, discovery]
  name: 'Exposed sitemap (API surface graph)'
  body_words: ['<urlset', '<loc>']
response:
  headers:
    Content-Type: "application/xml; charset=utf-8"
  body: |
    <?xml version="1.0" encoding="UTF-8"?>
    <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
    {{surface.sitemap}}
    </urlset>
taunt: { mode: block, open: '<!--', close: '-->' }
expect:
  - '<urlset'
  - '</urlset>'
  - '<loc>https://'
