id: route-phpinfo
priority: 60
# phpinfo() recon dump — the single most-probed PHP leak. Served INERT: the body is static, never a
# real phpinfo() call. The PHP version is the persona's ({{persona.php.version}}), the same source any
# X-Powered-By the deploy derives from the persona would advertise, so the page never contradicts the
# host's declared PHP version. Paths/modules are persona-coherent: the docroot carries the company
# slug, and both pdo_mysql and pdo_pgsql are loaded (this host runs a MySQL WordPress AND a pgsql app,
# matching the other disclosure surfaces).
new_page:
  method: GET
  paths: ['/phpinfo.php', '/phpinfo', '/info.php']
  sig: 0
  status: 200
  severity: medium
  tags: [recon, phpinfo, exposure]
  name: 'PHP info page disclosure'
  body_words: ['phpinfo()', 'PHP Version']
  # /info.php is also a niche D-Link DIR-816L XSS bundle in the corpus. A real phpinfo at /info.php is
  # far more common than that appliance, so a heavy tier makes phpinfo the persona most seeds serve
  # there; the D-Link bundle keeps a minority slice and full detection (weight biases SERVING, never
  # detection). /phpinfo.php and /phpinfo are brand-new single-bundle keys, so the weight is inert
  # there.
  weight: 8
match:
  # template_needle keeps dressing any upstream nuclei template whose needle is phpinfo/php-info.
  # pid links this body to the folded new-page bundle (pid = route-phpinfo) explicitly.
  template_needle: [phpinfo, php-info]
  pid: [route-phpinfo]
response:
  headers:
    Content-Type: "text/html; charset=utf-8"
  body: |
    <!DOCTYPE html>
    <html><head><title>phpinfo()</title></head>
    <body>
    <h1 class="p">PHP Version {{persona.php.version}}</h1>
    <table>
    <tr><td class="e">System</td><td class="v">Linux {{persona.company.slug}}-web01 5.15.0-generic x86_64</td></tr>
    <tr><td class="e">Server API</td><td class="v">FPM/FastCGI</td></tr>
    <tr><td class="e">Document Root</td><td class="v">/var/www/{{persona.company.slug}}/public</td></tr>
    <tr><td class="e">Loaded Configuration File</td><td class="v">/etc/php/php.ini</td></tr>
    </table>
    <h2>PHP Extension</h2>
    <table>
    <tr><td class="e">Core</td><td class="v">{{persona.php.version}}</td></tr>
    <tr><td class="e">openssl</td><td class="v">enabled</td></tr>
    <tr><td class="e">curl</td><td class="v">enabled</td></tr>
    <tr><td class="e">json</td><td class="v">enabled</td></tr>
    <tr><td class="e">mbstring</td><td class="v">enabled</td></tr>
    <tr><td class="e">pdo_mysql</td><td class="v">enabled</td></tr>
    <tr><td class="e">pdo_pgsql</td><td class="v">enabled</td></tr>
    </table>
    <p>This output was generated by phpinfo().</p>
    </body></html>
taunt: { mode: block, open: '<!--', close: '-->' }
expect: ['phpinfo()', 'PHP Version']
