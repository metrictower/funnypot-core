id: route-phpinfo
priority: 60
# phpinfo() recon dump — plausible version/extension rows for an example host, no real env.
match:
  template_needle: [phpinfo, php-info]
response:
  headers:
    Content-Type: "text/html; charset=utf-8"
  body: |
    <!DOCTYPE html>
    <html><head><title>phpinfo()</title></head>
    <body>
    <h1 class="p">PHP Version {{pick:8.1.27,8.2.18,7.4.33,8.0.30}}</h1>
    <table>
    <tr><td class="e">System</td><td class="v">Linux {{pick:web01,app-node-1,php-fpm,srv-web}} 5.15.0 x86_64</td></tr>
    <tr><td class="e">Server API</td><td class="v">FPM/FastCGI</td></tr>
    <tr><td class="e">Document Root</td><td class="v">/var/www/example.com/public</td></tr>
    <tr><td class="e">Loaded Configuration File</td><td class="v">/etc/php/php.ini</td></tr>
    </table>
    <h2>PHP Extension</h2>
    <table>
    <tr><td class="e">openssl</td><td class="v">enabled</td></tr>
    <tr><td class="e">pdo_mysql</td><td class="v">enabled</td></tr>
    </table>
    <p>This output was generated by phpinfo().</p>
    </body></html>
taunt: { mode: block, open: '<!--', close: '-->' }
expect: ['phpinfo()', 'PHP Version']
