id: route-adminer
priority: 140
# Adminer database login page — dresses the existing adminer-panel bundle.
#
# FP-0521: byte-faithful clone of the real Adminer 6.1.1 login (default + dark themes). Real markup
# (#lang / #menu logo / #content Login bar / table.layout form), real field names (auth[driver]/
# server/username/password/db, the hidden token, the permanent-login checkbox, the language select).
# Self-contained: inline CSS + inline SVG logo, both themes via `prefers-color-scheme`. Must NOT
# reference-and-serve external CSS — on the WordPress host an unowned `?file=default.css` path is
# 301'd by WordPress redirect_canonical and never loads, so the page would render unstyled (FP-0526).
# CSS/logo are re-derived, never vendored (Adminer is apache-2 upstream; re-derive facts, don't copy).
match:
  template_needle: [adminer-panel]
set_cookie: PHPSESSID
response:
  headers:
    Content-Type: "text/html; charset=utf-8"
  body: |
    <!DOCTYPE html>
    <html lang="en" dir="ltr">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Login - Adminer</title>
    <style>
    :root{--bg:#fff;--fg:#000;--dim:#eee;--lit:#ddf;--page:#fff}
    @media (prefers-color-scheme:dark){:root{--bg:#002240;--fg:#9ab3c8;--dim:#0f3457;--lit:#011d35;--page:#111}}
    *{box-sizing:border-box}
    html{background:var(--page)}
    body{color:var(--fg);background:var(--bg);font:90%/1.25 Verdana,Arial,Helvetica,sans-serif;margin:0;min-width:fit-content}
    a{color:#36c}
    #lang{position:absolute;top:0;left:0;padding:.5em 1em}
    #lang select{font:inherit}
    #menu{position:absolute;top:2.4em;left:0;width:19em;border-inline-end:1px solid #999}
    #menu h1{font-size:150%;margin:0;padding:.8em .667em;border-bottom:1px solid #999;font-weight:normal;background:var(--dim)}
    #h1{color:#777;text-decoration:none;font-style:italic}
    #logo{vertical-align:middle;margin-inline-end:.35em}
    .version{color:#777;font-size:70%}
    #content{margin-inline-start:19em;padding:0 1em 2em}
    h2{font-size:150%;margin:0 0 20px;padding:.8em 1em;border-bottom:1px solid var(--fg);font-weight:normal;background:var(--lit)}
    table.layout{border-collapse:collapse;margin:0 0 1em}
    table.layout th{background:var(--dim);border:1px solid #999;text-align:start;padding:.25em .5em;font-weight:bold;white-space:nowrap}
    table.layout td{padding:.15em .3em}
    input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid #999;padding:.15em .3em}
    input[type=checkbox]{border:0}
    input[type=submit]{background:var(--dim);padding:.2em .8em;cursor:pointer}
    p{margin:.6em 0}
    @media (max-width:800px){#menu{position:static;width:auto;border:0}#content{margin-inline-start:0}#lang{position:static}}
    </style>
    </head>
    <body class=" adminer">
    <div id="lang">Language: <select name="lang"><option value="en" selected>English</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="es">Español</option><option value="ru">Русский</option><option value="zh">简体中文</option><option value="ja">日本語</option></select></div>
    <div id="content">
    <h2>Login</h2>
    <form action="" method="post">
    <div><input type="hidden" name="token" value="{{fake.adminer_token:dec:7}}:{{fake.adminer_token2:dec:7}}"></div>
    <table class="layout">
    <tr><th>System<td><select name="auth[driver]"><option value="server" selected>MySQL / MariaDB</option><option value="pgsql">PostgreSQL</option><option value="sqlite">SQLite</option><option value="mssql">MS SQL</option><option value="oracle">Oracle</option></select>
    <tr><th>Server<td><input name="auth[server]" value="db" title="hostname[:port] or :socket" placeholder="localhost" autocapitalize="off">
    <tr><th>Username<td><input name="auth[username]" id="username" autofocus value="" autocomplete="username" autocapitalize="off">
    <tr><th>Password<td><input type="password" name="auth[password]" autocomplete="current-password">
    <tr><th>Database<td><input name="auth[db]" value="" autocapitalize="off">
    </table>
    <p><input type="submit" value="Login">
    <label><input type="checkbox" name="auth[permanent]" value="1">Permanent login</label>
    </form>
    </div>
    <div id="menu">
    <h1><a href="https://www.adminer.org/" target="_blank" rel="noreferrer noopener" id="h1"><svg id="logo" width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><ellipse cx="9" cy="6" rx="7" ry="3" fill="none" stroke="#777" stroke-width="1.5"/><path d="M2 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6" fill="none" stroke="#777" stroke-width="1.5"/><path d="M2 12v6c0 1.7 3.1 3 7 3 1.2 0 2.3-.1 3.3-.3" fill="none" stroke="#777" stroke-width="1.5"/><circle cx="18" cy="17" r="5" fill="none" stroke="#36c" stroke-width="1.5"/><path d="M21.5 20.5L24 23" stroke="#36c" stroke-width="1.5"/></svg>Adminer</a> <span class="version">6.1.1</span></h1>
    </div>
    </body>
    </html>
taunt: { mode: block, open: '<!--', close: '-->' }
expect: ['Login - Adminer</title>', 'name="auth[driver]"', 'name="auth[password]"', 'id="username"', '>Login</h2>']
