id: route-credentials-txt
priority: 230
# Brand-new page: a dropped credentials.txt full of inert fake cloud/db secrets.
new_page:
  method: GET
  paths: ['/credentials.txt', '/creds.txt', '/backup/credentials.txt']
  sig: 0
  status: 200
  severity: high
  tags: [exposure, credentials, secrets]
  name: 'Exposed credentials.txt'
  body_words: ['AWS_SECRET_ACCESS_KEY']
response:
  headers:
    Content-Type: "text/plain; charset=utf-8"
  body: |
    # production credentials — rotate quarterly
    AWS_ACCESS_KEY_ID=AKIA{{fake.ak:hexupper:16}}
    AWS_SECRET_ACCESS_KEY={{fake.aws:b64:40}}
    DB_HOST=db.internal.example.com
    DB_USER=admin
    DB_PASSWORD={{fake.dbpass:hex:24}}
    API_TOKEN={{fake.api:hex:40}}
    SMTP_PASSWORD={{fake.smtp:hex:20}}
taunt: { mode: line, open: '#' }
expect: ['AWS_SECRET_ACCESS_KEY', 'DB_PASSWORD']
