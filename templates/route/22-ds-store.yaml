id: route-ds-store
priority: 22
# FP-0512: /.DS_Store binary disclosure decoy. A macOS Finder Bud1 blob that leaks plausible sibling
# names (assets, backup, config, includes, uploads, index.php, readme.html) a scanner mines for hidden
# paths to probe. Today /.DS_Store falls to the generic CRS-LFI "failed to open stream" line — a tell,
# since a static server never emits that. Clean-room authored (never a captured file): the buddy-
# allocator blob was generated from the format and verified to round-trip through an independent parser.
# Static body_b64 keeps this a patch (no binary_generator). Binary bodies are fingerprint-scanned
# headers-only; the listed names are generic and carry no signature string. Served application/octet-stream.
new_page:
  method: GET
  paths: ['/.DS_Store']
  sig: 0
  status: 200
  severity: medium
  tags: [exposure, disclosure, ds-store, binary]
  name: 'Exposed .DS_Store'
response:
  headers:
    Content-Type: "application/octet-stream"
  body_b64: ''
