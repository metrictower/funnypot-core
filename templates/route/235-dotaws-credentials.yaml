id: route-aws-cli-credentials
priority: 235
# Brand-new page: the AWS CLI credentials file the .aws listing (route 234) links — wiring it
# keeps that link live (an unresolved link off a directory listing is its own dead-link tell).
# Same persona cloud identity as route/230-credentials-txt.yaml, so a scanner that also pulls
# that surface sees one coherent AWS key pair, not two contradicting ones.
#
# A generic corpus template ('aws-credentials') already keys this same exact path with a
# detect-only bundle that has no authored body — its minimal synth renders a value-less
# `aws_access_key_id = ` line, a worse tell than the 404 this closes. The heavy weight makes
# THIS bundle the one the persona pick lands on (same fix compile-ai uses for the same class
# of corpus collision); detection of the corpus template is unaffected, only which body serves.
# id deliberately avoids the substring "aws-credentials" — route/40-wp-config.yaml's
# template_needle treats that substring as a signal to dress ANY bundle naming it into a full
# wp-config.php backup, by priority ahead of this rule's own pid match.
new_page:
  method: GET
  paths: ['/.aws/credentials']
  sig: 0
  status: 200
  severity: high
  tags: [exposure, cloud, aws, credentials]
  name: 'Exposed AWS CLI credentials'
  body_words: ['aws_access_key_id', 'aws_secret_access_key']
  weight: 1000
response:
  headers:
    Content-Type: "text/plain; charset=utf-8"
  body: |
    [default]
    aws_access_key_id = {{persona.cloud.aws.accessKeyId}}
    aws_secret_access_key = {{persona.cloud.aws.secretKey}}
expect: ['aws_access_key_id = AKIA', 'aws_secret_access_key = ']
