id: route-typo3conf-localconf
priority: 392
# Brand-new page: a leaked /typo3conf/localconf.php — the classic (pre-v6) TYPO3 site config the
# typo3conf listing (route 391) links to, so wiring it keeps that link live. Real localconf.php is a
# flat set of $typo_db_* assignments plus a few $TYPO3_CONF_VARS keys. The DB fields and the
# encryption key are persona-seeded, so this file discloses the SAME credentials as every other
# leaked config on the host (config.php, .env, web.config) — one host, one identity. Served as
# text/plain: a raw PHP source leak is disclosed, never executed, and NOT application/x-php (a tell).
# The id avoids the `web-config`/`wp-config` needles so none of those enrichers redresses it.
new_page:
  method: GET
  paths: ['/typo3conf/localconf.php']
  sig: 0
  status: 200
  severity: high
  tags: [exposure, cms, typo3, config-disclosure, secrets]
  name: 'Exposed TYPO3 localconf.php'
  body_words: ['$typo_db_password']
response:
  headers:
    Content-Type: "text/plain; charset=utf-8"
  body: |
    <?php
    // TYPO3 configuration file, generated by the install tool. Holds the local site settings.

    $typo_db_host = '{{persona.db.host}}';
    $typo_db = '{{persona.db.name}}';
    $typo_db_username = '{{persona.db.user}}';
    $typo_db_password = '{{persona.db.password}}';

    $TYPO3_CONF_VARS['SYS']['sitename'] = '{{persona.company.name}}';
    $TYPO3_CONF_VARS['SYS']['encryptionKey'] = '{{persona.secret.jwt}}';
    $TYPO3_CONF_VARS['BE']['adminEmail'] = '{{persona.user.admin.email}}';
taunt: { mode: line, open: '//' }
expect:
  - '$typo_db_password'
  - '$typo_db_username'
  - 'encryptionKey'
