id: route-composer-lock
priority: 82
# FP-0399: vulnerable PHP lockfile decoy at /composer.lock. /composer.lock and /composer.json share the
# corpus `composer-config` bundle; this enrich is route_key-guarded to /composer.lock (priority 82 < 83,
# wins that path) and serves a Composer 2 lockfile whose package versions are REAL OSV-listed vulnerable
# releases — facade/ignition 2.5.1 (CVE-2021-3129) and phpunit/phpunit 5.6.2 (CVE-2017-9841) directly match
# the box's Ignition (92) and PHPUnit (15) attack emulators, so a composer-audit/osv-scanner finding aligns
# with what the box already answers. Versions FIXED (detection payload); content-hash + source/dist refs
# {{fake.*}}-seeded (anti-correlation). Content-Type application/octet-stream = what a raw .lock GET
# returns (matches the bundle witness; SCA reads the bytes regardless of CT). Inert, no request reflected.
match:
  template_needle: [composer-config]
  route_key: ['GET /composer.lock']
response:
  headers:
    Content-Type: "application/octet-stream"
  body: |
    {
    "_readme": [
      "This file locks the dependencies of your project to a known state",
      "Read more about it at https://getcomposer.org/doc/01-basic-usage.md#installing-dependencies",
      "This file is @generated automatically"
    ],
    "content-hash": "{{fake.composer_hash:hex:32}}",
    "packages": [
      {
        "name": "laravel/framework",
        "version": "v8.40.0",
        "source": {"type": "git", "url": "https://github.com/laravel/framework.git", "reference": "{{fake.src_laravel:hex:40}}"},
        "dist": {"type": "zip", "url": "https://api.github.com/repos/laravel/framework/zipball/{{fake.src_laravel:hex:40}}", "reference": "{{fake.src_laravel:hex:40}}", "shasum": ""},
        "type": "library"
      },
      {
        "name": "facade/ignition",
        "version": "2.5.1",
        "source": {"type": "git", "url": "https://github.com/facade/ignition.git", "reference": "{{fake.src_ignition:hex:40}}"},
        "dist": {"type": "zip", "url": "https://api.github.com/repos/facade/ignition/zipball/{{fake.src_ignition:hex:40}}", "reference": "{{fake.src_ignition:hex:40}}", "shasum": ""},
        "type": "library"
      },
      {
        "name": "guzzlehttp/guzzle",
        "version": "6.5.4",
        "source": {"type": "git", "url": "https://github.com/guzzle/guzzle.git", "reference": "{{fake.src_guzzle:hex:40}}"},
        "dist": {"type": "zip", "url": "https://api.github.com/repos/guzzle/guzzle/zipball/{{fake.src_guzzle:hex:40}}", "reference": "{{fake.src_guzzle:hex:40}}", "shasum": ""},
        "type": "library"
      },
      {
        "name": "phpmailer/phpmailer",
        "version": "v5.2.16",
        "source": {"type": "git", "url": "https://github.com/PHPMailer/PHPMailer.git", "reference": "{{fake.src_phpmailer:hex:40}}"},
        "dist": {"type": "zip", "url": "https://api.github.com/repos/PHPMailer/PHPMailer/zipball/{{fake.src_phpmailer:hex:40}}", "reference": "{{fake.src_phpmailer:hex:40}}", "shasum": ""},
        "type": "library"
      },
      {
        "name": "symfony/http-kernel",
        "version": "v4.4.0",
        "source": {"type": "git", "url": "https://github.com/symfony/http-kernel.git", "reference": "{{fake.src_symfony:hex:40}}"},
        "dist": {"type": "zip", "url": "https://api.github.com/repos/symfony/http-kernel/zipball/{{fake.src_symfony:hex:40}}", "reference": "{{fake.src_symfony:hex:40}}", "shasum": ""},
        "type": "library"
      }
    ],
    "packages-dev": [
      {
        "name": "phpunit/phpunit",
        "version": "5.6.2",
        "source": {"type": "git", "url": "https://github.com/sebastianbergmann/phpunit.git", "reference": "{{fake.src_phpunit:hex:40}}"},
        "dist": {"type": "zip", "url": "https://api.github.com/repos/sebastianbergmann/phpunit/zipball/{{fake.src_phpunit:hex:40}}", "reference": "{{fake.src_phpunit:hex:40}}", "shasum": ""},
        "type": "library"
      }
    ],
    "aliases": [],
    "minimum-stability": "stable",
    "stability-flags": {},
    "prefer-stable": true,
    "prefer-lowest": false,
    "platform": {"php": ">=7.3"},
    "platform-dev": [],
    "plugin-api-version": "2.3.0"
    }
taunt: { mode: inline_field, key: '_comment' }
expect:
  - 'getcomposer.org'
  - '"laravel/framework"'
  - '"version": "2.5.1"'
