id: route-terraform-tfstate
priority: 231
# Brand-new page: a leaked terraform.tfstate — the classic "someone ran terraform apply on a
# laptop and the state file ended up in the webroot" exposure. Ships the resources a real infra
# state would carry (an IAM deploy key, the prod RDS instance, a random_password used to seed a
# secret) so id+secret pairs sit adjacent for trufflehog and the AWS id charset matches gitleaks.
new_page:
  method: GET
  paths: ['/terraform.tfstate', '/.terraform/terraform.tfstate', '/infra/terraform.tfstate']
  sig: 0
  status: 200
  severity: high
  tags: [exposure, terraform, secrets]
  name: 'Exposed terraform.tfstate'
  body_words: ['"terraform_version"']
response:
  headers:
    Content-Type: "application/json"
  body: |
    {
      "version": 4,
      "terraform_version": "1.6.2",
      "serial": 42,
      "resources": [
        {
          "type": "aws_iam_access_key",
          "name": "deploy",
          "provider": "provider[\"registry.terraform.io/hashicorp/aws\"]",
          "instances": [
            { "attributes": {
              "id": "{{persona.cloud.aws.accessKeyId}}",
              "secret": "{{persona.cloud.aws.secretKey}}",
              "user": "ci-deploy",
              "status": "Active"
            } }
          ]
        },
        {
          "type": "aws_db_instance",
          "name": "primary",
          "provider": "provider[\"registry.terraform.io/hashicorp/aws\"]",
          "instances": [
            { "attributes": {
              "identifier": "app-prod",
              "engine": "postgres",
              "instance_class": "db.r5.large",
              "allocated_storage": 200,
              "address": "db-{{fake.tfdbhost:hex:6}}.cluster-cg{{fake.tfdbacct:hex:9}}.eu-west-1.rds.amazonaws.com",
              "endpoint": "db-{{fake.tfdbhost:hex:6}}.cluster-cg{{fake.tfdbacct:hex:9}}.eu-west-1.rds.amazonaws.com:5432",
              "port": 5432,
              "username": "app_prod",
              "password": "{{fake.tfdbpass:hex:24}}"
            } }
          ]
        },
        {
          "type": "random_password",
          "name": "app_secret",
          "provider": "provider[\"registry.terraform.io/hashicorp/random\"]",
          "instances": [
            { "attributes": {
              "id": "none",
              "length": 32,
              "special": false,
              "result": "{{fake.tfrandpass:hex:32}}"
            } }
          ]
        }
      ]
    }
taunt: { mode: inline_field, key: '_comment' }
expect: ['"terraform_version"', 'aws_iam_access_key', 'aws_db_instance', 'random_password', '"id": "AKIA']
