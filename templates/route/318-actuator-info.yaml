id: route-actuator-info
priority: 318
# Enrich: the corpus routes /actuator/info (+ /info, /management/info, /management) to the
# `springboot-info` bundle (body words `"java"`, `"version"`, `"os"`; typed Content-Type
# application/json). Minimal synth would emit the bare words; here we serve a real Actuator /info
# build+java+os block. Versions are literals; the git commit id is hex (letters break any run).
match:
  template_needle: [springboot-info]
response:
  headers:
    Content-Type: "application/json"
  body: |
    {
      "app": {"name": "{{persona.company.slug}}-api", "encoding": "UTF-8"},
      "build": {
        "artifact": "{{persona.company.slug}}-api",
        "group": "com.{{persona.company.slug}}",
        "version": "1.8.2"
      },
      "git": {"branch": "main", "commit": {"id": "{{fake.gitsha:hex:7}}"}},
      "java": {"version": "17.0.10", "vendor": "Eclipse Adoptium"},
      "os": {"name": "Linux", "version": "5.15.0-105-generic", "arch": "amd64"}
    }
taunt: { mode: inline_field, key: '_comment' }
expect:
  - '"java"'
  - '"version"'
  - '"os"'
  - 'Eclipse Adoptium'
