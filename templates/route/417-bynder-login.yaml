id: route-bynder-login
priority: 417
# FP-0529: styled Bynder login for the shared poly-stack /login/ path; weight:100000 so a styled
# product login wins over the corpus minimal (PersonaSelector). Self-contained inline CSS + SVG
# (FP-0526). Re-derived, never vendored.
new_page:
  method: GET
  paths: ['/login/', '/login']
  sig: 0
  status: 200
  severity: low
  weight: 100000
  tags: [bynder, panel, login, exposure]
  name: 'Bynder login'
  body_words: ['Bynder']
response:
  headers:
    Content-Type: "text/html; charset=utf-8"
  body: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Bynder</title>
    <style>
    :root{color-scheme:light}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#0b1f3a;color:#1b1b1b;display:flex;align-items:center;justify-content:center;padding:1.5rem}
    .card{width:100%;max-width:24rem;background:#fff;border-radius:.6rem;box-shadow:0 .6rem 1.8rem rgba(0,0,0,.35);padding:2rem 1.75rem}
    .brand{text-align:center;margin-bottom:1.5rem}
    .brand svg{width:48px;height:48px}
    .brand .word{display:block;margin-top:.5rem;font-size:1.4rem;font-weight:700;color:#0b1f3a;letter-spacing:.3px}
    h1{font-size:1rem;font-weight:500;text-align:center;color:#5a6472;margin:0 0 1.4rem}
    .field{margin-bottom:1rem}
    label{display:block;margin-bottom:.35rem;font-size:.85rem;color:#5a6472}
    input{display:block;width:100%;padding:.6rem .75rem;border:1px solid #d2d8e0;border-radius:.3rem;font-size:1rem}
    .btn{width:100%;padding:.65rem;border:0;border-radius:.3rem;background:#1763ff;color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
    .btn:hover{background:#2f76ff}
    .foot{text-align:center;margin-top:1.4rem;font-size:.75rem;color:#9aa4b2}
    </style>
    </head>
    <body>
    <div class="card">
    <div class="brand">
    <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-label="Bynder"><rect x="4" y="4" width="40" height="40" rx="9" fill="#1763ff"/><path d="M17 15h8a6 6 0 0 1 0 12h-8z" fill="none" stroke="#fff" stroke-width="3"/><path d="M17 27h9a6 6 0 0 1 0 12h-9z" fill="none" stroke="#fff" stroke-width="3"/></svg>
    <span class="word">Bynder</span>
    </div>
    <h1>Sign in to your portal</h1>
    <form method="post" action="/login/">
    <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" autocomplete="username" autofocus>
    </div>
    <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password">
    </div>
    <button type="submit" class="btn">Log in</button>
    </form>
    <div class="foot">Powered by bynder.</div>
    </div>
    </body>
    </html>
taunt: { mode: block, open: '<!--', close: '-->' }
expect:
  - 'bynder.'
  - 'name="email"'
