id: route-composer-json
priority: 83
# FP-0399: PHP manifest decoy at /composer.json (the unguarded composer-config fallback; 82 route_key-guards
# /composer.lock, this dresses /composer.json + any other composer-config key). Companion to 82-composer-lock:
# the same REAL OSV-vulnerable Packagist set at caret ranges matching the lock's pinned versions, so manifest
# and lock agree. The composer-config bundle requires the body words "packages" (the repositories packagist
# URL) and "getcomposer.org" (the support.docs URL) and an application/octet-stream Content-Type (what a raw
# .json download reports) — all satisfied here. Versions FIXED; inert, no request reflected.
match:
  template_needle: [composer-config]
response:
  headers:
    Content-Type: "application/octet-stream"
  body: |
    {
    "name": "example/app",
    "description": "Internal application.",
    "type": "project",
    "require": {
      "php": ">=7.3",
      "laravel/framework": "^8.40",
      "facade/ignition": "^2.5",
      "guzzlehttp/guzzle": "^6.5",
      "phpmailer/phpmailer": "^5.2",
      "symfony/http-kernel": "^4.4"
    },
    "require-dev": {
      "phpunit/phpunit": "^5.6"
    },
    "repositories": [
      {"type": "composer", "url": "https://packagist.org/packages.json"}
    ],
    "support": {
      "docs": "https://getcomposer.org/doc/"
    },
    "minimum-stability": "stable",
    "prefer-stable": true,
    "config": {"vendor-dir": "vendor"}
    }
taunt: { mode: inline_field, key: '_comment' }
expect:
  - 'packages'
  - 'getcomposer.org'
  - 'laravel/framework'
