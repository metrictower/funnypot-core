id: route-wp-login
priority: 50
# WordPress wp-login.php with open registration. Site name + blog links are persona-derived
# ({{persona.company.name}} / blog.{{persona.company.domain}}) so this GET login page names the SAME
# deploy-stable company the POST credential oracle (attack rule 97) and the /wp-admin dashboard show —
# GET and POST on this path stay one coherent host (FP-0271 §2.6 N2; route-tier {{persona.*}} is
# already rendered at request time, as the pre-existing {{pick}} title was).
#
# INVISIBLE DECOY FIELD (FP-0495): the extra contact <input> is a honeypot. It is hidden by the
# `display:none` wrapper, out of the tab order (tabindex=-1), out of the a11y tree (aria-hidden) and
# out of autofill (autocomplete=off), so no real browser/user ever fills it — but a dumb form-filling
# bot does. Inert static HTML: core only RENDERS it; detection (a non-empty submit -> scripted-bot
# signal) is a separate serve-neutral concern (Support\LoginDecoyField), so this page is byte-identical
# whether or not the field is later tripped. The name is a {{pick:login_decoy_field:...}} off the render
# seed (crc32(seedFor($r)) — per-client-IP in prod / per-host by default), so it is NOT a fleet-wide
# constant and reads as an ordinary contact field, never a honeypot tell. It must stay byte-identical to
# attack rule 97's copy (same {{pick}} KEY + list) so a bot's GET-render name equals the POST detect name.
match:
  template_needle: [wordpress-login, wp-enabled-registration, wp-registration-enabled]
set_cookie: PHPSESSID
response:
  headers:
    Content-Type: "text/html; charset=UTF-8"
  body: |
    <!DOCTYPE html>
    <html lang="en-US">
    <head>
    <meta charset="UTF-8" />
    <title>Log In &lsaquo; {{persona.company.name}} &#8212; WordPress</title>
    <link rel='stylesheet' href='https://blog.{{persona.company.domain}}/wp-includes/css/dist/block-library/style.min.css' />
    <style>.{{persona.classPrefix}}-field-row{display:none}</style>
    </head>
    <body class="login no-js login-action-login wp-core-ui">
    <div id="login">
    <h1><a href="https://blog.{{persona.company.domain}}/">{{persona.company.name}}</a></h1>
    <p class="message register">Register For This Site</p>
    <form name="loginform" id="loginform" action="https://blog.{{persona.company.domain}}/wp-login.php" method="post">
    <p><label>Username or Email Address<br />
    <input type="text" name="log" class="input" /></label></p>
    <p><label>Password<br />
    <input type="password" name="pwd" class="input" /></label></p>
    <p class="{{persona.classPrefix}}-field-row"><label for="{{persona.classPrefix}}_ct">Contact</label>
    <input type="text" name="{{pick:login_decoy_field:contact_phone,company_fax,alt_email,secondary_email,office_ext,mobile_alt}}" id="{{persona.classPrefix}}_ct" value="" tabindex="-1" autocomplete="off" aria-hidden="true" /></p>
    <p class="submit"><input type="submit" name="wp-submit" value="Log In" /></p>
    </form>
    <p id="nav">
    <a href="https://blog.{{persona.company.domain}}/wp-login.php?action=register">Register</a> |
    <a href="https://blog.{{persona.company.domain}}/wp-login.php?action=lostpassword">Lost your password?</a>
    </p>
    </div>
    </body>
    </html>
taunt: { mode: block, open: '<!--', close: '-->' }
expect: ['Register For This Site', 'wp-login.php']
