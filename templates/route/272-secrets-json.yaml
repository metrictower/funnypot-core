id: route-secrets-json
priority: 272
# Brand-new page: a dropped secrets.json keying the host's DB / AWS / Stripe / SendGrid / JWT
# secrets. Persona-seeded so it stays coherent with every other leaked config. The body starts
# with a lone `{` so the JSON taunt (a "_comment" field after the first newline) keeps it parseable.
new_page:
  method: GET
  paths: ['/secrets.json']
  sig: 0
  status: 200
  severity: high
  tags: [exposure, config-disclosure, secrets]
  name: 'Exposed secrets.json'
  body_words: ['secretKey']
response:
  headers:
    Content-Type: "application/json"
  body: |
    {
    "db": {
      "host": "{{persona.db.host}}",
      "name": "{{persona.db.name}}",
      "user": "{{persona.db.user}}",
      "password": "{{persona.db.password}}"
    },
    "aws": {
      "accessKeyId": "{{persona.cloud.aws.accessKeyId}}",
      "secretKey": "{{persona.cloud.aws.secretKey}}",
      "region": "{{persona.cloud.aws.region}}"
    },
    "stripe": { "secretKey": "{{persona.cloud.stripe.secretKey}}" },
    "sendgrid": { "apiKey": "{{persona.cloud.sendgrid.apiKey}}" },
    "jwt": { "secret": "{{persona.secret.jwt}}" },
    "ai": {
      "openai": "{{persona.cloud.openai.projectKey}}",
      "openai_service_account": "{{persona.cloud.openai.serviceAccountKey}}",
      "anthropic": "{{persona.cloud.anthropic.apiKey}}",
      "huggingface": "{{persona.cloud.huggingface.token}}",
      "groq": "{{persona.cloud.groq.apiKey}}",
      "github": "{{persona.cloud.github.pat}}"
    },
    "registries": {
      "npm": "{{persona.cloud.npm.token}}",
      "pypi": "{{persona.cloud.pypi.token}}"
    },
    "slack": { "botToken": "{{persona.cloud.slack.botToken}}" },
    "payments": { "test_card": "{{persona.payment.cardNumber}}" }
    }
taunt: { mode: inline_field, key: '_comment' }
expect:
  - '"secretKey"'
  - 'AKIA'
  - 'sk_live_'
  - 'SG.'
  - 'sk-proj-'
  - 'ghp_'
  - 'sk-svcacct-'
  - 'npm_'
  - 'pypi-'
  - 'xoxb-'
