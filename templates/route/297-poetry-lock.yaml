id: route-poetry-lock
priority: 297
# FP-0542: vulnerable Python poetry.lock decoy (extends the FP-0399 lockfile suite to the Poetry layout).
# /poetry.lock is NOT a corpus route key -> new_page. A poetry project ships poetry.lock (exact pins) +
# pyproject.toml (298), so a poetry-layout target has no requirements.txt/Pipfile — this catches it.
# Reuses the SAME OSV-verified vulnerable Python set as /requirements.txt (85) + /Pipfile.lock (one host,
# one dependency story): Django 3.0.4 (CVE-2021-35042 / matches the django-admin decoy), PyYAML 5.1
# (CVE-2020-1747), urllib3 1.25.7 (CVE-2020-26137), Jinja2 2.10.1 (CVE-2020-28493). osv-scanner / pip-audit
# parse the [[package]] name+version pairs -> verifiable CVEs. Versions FIXED literals (the payload); the
# content-hash is seeded per-deploy. Valid parseable TOML. INERT: static bytes, no request reflected.
new_page:
  method: GET
  paths: ['/poetry.lock']
  sig: 0
  status: 200
  severity: high
  tags: [exposure, dependency-disclosure, vulnerable-dependency]
  name: 'Exposed Python poetry.lock with vulnerable packages'
  body_words: ['[[package]]']
response:
  headers:
    Content-Type: "text/plain; charset=utf-8"
  body: |
    [[package]]
    name = "django"
    version = "3.0.4"
    description = "A high-level Python Web framework that encourages rapid development."
    category = "main"
    optional = false
    python-versions = ">=3.6"

    [[package]]
    name = "pyyaml"
    version = "5.1"
    description = "YAML parser and emitter for Python"
    category = "main"
    optional = false
    python-versions = "*"

    [[package]]
    name = "urllib3"
    version = "1.25.7"
    description = "HTTP library with thread-safe connection pooling, file post, and more."
    category = "main"
    optional = false
    python-versions = ">=2.6, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*"

    [[package]]
    name = "jinja2"
    version = "2.10.1"
    description = "A very fast and expressive template engine."
    category = "main"
    optional = false
    python-versions = ">=2.7"

    [metadata]
    lock-version = "1.1"
    python-versions = "^3.8"
    content-hash = "{{fake.poetry_ch:hex:64}}"
# No taunt: a line-mode taunt can inject a malformed line into the TOML (invalid parse + a tell). The
# seeded content-hash already varies the body per deploy (anti-fingerprint).
expect:
  - 'name = "django"'
  - 'version = "3.0.4"'
  - 'name = "pyyaml"'
  - 'content-hash = "'
