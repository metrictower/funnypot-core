id: route-wp-json-v2-posts
priority: 346
# WordPress REST API posts collection: GET /wp-json/wp/v2/posts. Three published posts whose `author`
# ids (1/2/3) and `categories`/`tags` term ids resolve to the same persona author set and the term
# collections this pack also serves — one coherent site, no author or term that exists on one surface
# and not another. Dates are fixed ISO-8601 (deploy-stable, no wall-clock tell). weight wins the
# persona lottery over the bundled SEO detection bundle that also lands on this exact path.
new_page:
  method: GET
  paths: ['/wp-json/wp/v2/posts', '/wp-json/wp/v2/posts/']
  sig: 0
  status: 200
  severity: info
  tags: [exposure, api, wordpress, discovery]
  name: 'Exposed WordPress REST API posts'
  body_words: ['"type":"post"', '"rendered"']
  weight: 1000
