id: route-envfile-prod
priority: 271
# Brand-new page: a dropped production .env (.env.production) — the same believable Laravel-style
# shape as /.env, but every secret is persona-seeded so this file agrees with the host's other
# leaked configs (same AWS pair, DB password, Stripe/SendGrid/JWT secrets). The sibling /.env.local
# is its own page (279-env-local) so it can declare a coherent local (not production) environment.
# The id deliberately avoids the substring `env-`: the /.env enrich (route-dotenv) selects on a
# broad `env-` template_needle, and findRule is global — an id carrying `env-` would let that
# enrich hijack this page and serve it as application/octet-stream instead of text/plain.
new_page:
  method: GET
  paths: ['/.env.production']
  sig: 0
  status: 200
  severity: high
  tags: [exposure, config-disclosure, secrets]
  name: 'Exposed environment file (.env.production)'
  body_words: ['AWS_SECRET_ACCESS_KEY']
response:
  headers:
    Content-Type: "text/plain; charset=utf-8"
  body: |
    APP_ENV=production
    APP_DEBUG=false

    DB_CONNECTION=pgsql
    DB_HOST={{persona.db.host}}
    DB_PORT=5432
    DB_DATABASE={{persona.db.name}}
    DB_USERNAME={{persona.db.user}}
    DB_PASSWORD={{persona.db.password}}

    AWS_ACCESS_KEY_ID={{persona.cloud.aws.accessKeyId}}
    AWS_SECRET_ACCESS_KEY={{persona.cloud.aws.secretKey}}
    AWS_DEFAULT_REGION={{persona.cloud.aws.region}}

    STRIPE_SECRET_KEY={{persona.cloud.stripe.secretKey}}
    SENDGRID_API_KEY={{persona.cloud.sendgrid.apiKey}}
    JWT_SECRET={{persona.secret.jwt}}
taunt: { mode: line, open: '#' }
expect:
  - 'AWS_ACCESS_KEY_ID=AKIA'
  - 'AWS_SECRET_ACCESS_KEY='
  - 'STRIPE_SECRET_KEY=sk_live_'
  - 'SENDGRID_API_KEY=SG.'
