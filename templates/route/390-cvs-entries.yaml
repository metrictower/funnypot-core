id: route-vcs-cvs-entries
priority: 390
# Brand-new page: a leaked /CVS/Entries — the working-copy metadata file a CVS checkout leaves in
# every directory, the third VCS-metadata exposure beside the .git and .svn/.hg/.bzr pages. Real
# Entries grammar: one `/name/revision/timestamp/options/tagdate` line per file (empty options and
# tagdate leave the trailing `//`), and `D/name////` for each subdirectory. The tree is a small
# decoy PHP app — filenames only, no project data, no secrets — so the disclosure is inert.
#
# The id is route-vcs-cvs-entries, WITHOUT the substring `git`: route-git-config (priority 10)
# carries a broad `git` template_needle and findRule is global, so an id containing `git` would let
# that enrich hijack this page and serve the .git/config body instead. No taunt: the Entries format
# is strictly positional (no comment syntax), so an injected `#`/`//` line would be a parse tell —
# same reason /.svn/entries carries none.
new_page:
  method: GET
  paths: ['/CVS/Entries']
  sig: 0
  status: 200
  severity: medium
  tags: [exposure, vcs, cvs, source-disclosure]
  name: 'Exposed CVS/Entries'
  body_words: ['/index.php/']
response:
  headers:
    Content-Type: "text/plain; charset=utf-8"
  body: |
    /index.php/1.4/Mon Nov 18 14:07:52 2019//
    /config.php/1.2/Wed Nov 20 09:31:10 2019//
    /functions.php/1.7/Fri Nov 22 16:45:03 2019//
    /header.php/1.3/Mon Nov 18 14:08:19 2019//
    /footer.php/1.2/Mon Nov 18 14:08:41 2019//
    D/includes////
    D/admin////
expect:
  - '/index.php/1.4/'
  - '/config.php/'
  - 'D/includes////'
