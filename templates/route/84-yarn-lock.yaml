id: route-yarn-lock
priority: 84
# FP-0399: vulnerable npm lockfile decoy at /yarn.lock (yarn v1 format). Enrich on the corpus `yarn-lock`
# bundle. Same REAL OSV-vulnerable npm set as 81-package-lock-json, integrity NAMEs shared so the two npm
# lockfiles agree for one attacker. Content-Type is text/html to match the yarn-lock bundle's header
# witness (a default-type server serving an extension-less .lock; a .lock has no registered media type, so
# this is not the .js-as-HTML class invariant 5 forbids). Versions FIXED (detection payload); resolved/
# integrity {{fake.*}}-seeded. Inert, no request reflected. The header lines are product-intrinsic yarn
# boilerplate.
match:
  template_needle: [yarn-lock]
response:
  headers:
    Content-Type: "text/html; charset=utf-8"
  body: |
    # THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.
    # yarn lockfile v1


    lodash@^4.17.4:
      version "4.17.11"
      resolved "https://registry.yarnpkg.com/lodash/-/lodash-4.17.11.tgz#{{fake.yarn_r_lodash:hex:40}}"
      integrity sha512-{{fake.npm_i_lodash:b64:86}}==

    axios@^0.21.0:
      version "0.21.1"
      resolved "https://registry.yarnpkg.com/axios/-/axios-0.21.1.tgz#{{fake.yarn_r_axios:hex:40}}"
      integrity sha512-{{fake.npm_i_axios:b64:86}}==

    jsonwebtoken@^8.5.0:
      version "8.5.1"
      resolved "https://registry.yarnpkg.com/jsonwebtoken/-/jsonwebtoken-8.5.1.tgz#{{fake.yarn_r_jwt:hex:40}}"
      integrity sha512-{{fake.npm_i_jwt:b64:86}}==

    node-serialize@^0.0.4:
      version "0.0.4"
      resolved "https://registry.yarnpkg.com/node-serialize/-/node-serialize-0.0.4.tgz#{{fake.yarn_r_nodeser:hex:40}}"
      integrity sha512-{{fake.npm_i_nodeser:b64:86}}==

    minimist@^1.2.0:
      version "1.2.5"
      resolved "https://registry.yarnpkg.com/minimist/-/minimist-1.2.5.tgz#{{fake.yarn_r_minimist:hex:40}}"
      integrity sha512-{{fake.npm_i_minimist:b64:86}}==

    qs@6.5.2:
      version "6.5.2"
      resolved "https://registry.yarnpkg.com/qs/-/qs-6.5.2.tgz#{{fake.yarn_r_qs:hex:40}}"
      integrity sha512-{{fake.npm_i_qs:b64:86}}==

    cookie@0.3.1:
      version "0.3.1"
      resolved "https://registry.yarnpkg.com/cookie/-/cookie-0.3.1.tgz#{{fake.yarn_r_cookie:hex:40}}"
      integrity sha1-{{fake.npm_i_cookie:b64:27}}=

    express@^4.16.0:
      version "4.16.4"
      resolved "https://registry.yarnpkg.com/express/-/express-4.16.4.tgz#{{fake.yarn_r_express:hex:40}}"
      integrity sha512-{{fake.npm_i_express:b64:86}}==
      dependencies:
        cookie "0.3.1"
        qs "6.5.2"
taunt: { mode: line, open: '#' }
expect:
  - '# yarn lockfile v1'
  - 'lodash@^4.17.4:'
  - 'version "4.17.11"'
