id: route-apache-error-log
priority: 305
# Brand-new page: an Apache 2.4 error log — a top scanner target the corpus does not cover. Leaks
# the company slug (docroot) and domain (referer). Postgres-neutral (the PHP fatal names no db
# engine). Client IPs from the shared public pool. Number safety: microsecond fields are static and
# never lead with 9; pid/tid are dec:5; the ephemeral client port is `5`+dec:4 (a 5-digit run in the
# valid 5xxxx range); the AHxxxxx result codes are letter-flanked so they carry no bare-6 run.
new_page:
  method: GET
  paths: ['/var/log/apache2/error.log', '/var/log/httpd/error_log']
  sig: 0
  status: 200
  severity: medium
  tags: [exposure, log-disclosure, information-disclosure]
  name: 'Exposed Apache error log (error.log)'
  body_words: ['[core:error]']
response:
  headers:
    Content-Type: "text/plain; charset=utf-8"
  body: |
    [Thu Oct 10 13:55:36.482013 2024] [core:error] [pid {{fake.apid1:dec:5}}:tid {{fake.atid1:dec:5}}] [client {{pick:45.148.10.72,185.220.101.34,91.207.175.14,103.224.182.251,51.158.108.203,195.154.200.88,141.98.11.29,209.141.55.198,176.113.115.84,80.94.92.60,156.146.59.25,89.248.165.44,193.32.126.212,45.61.184.9,167.94.138.60,62.210.88.140}}:5{{fake.aport1:dec:4}}] AH00124: Request exceeded the limit of 10 internal redirects due to probable configuration error, referer: https://{{persona.company.domain}}/
    [Thu Oct 10 13:55:37.128233 2024] [php:error] [pid {{fake.apid2:dec:5}}] [client {{pick:195.154.200.88,141.98.11.29,209.141.55.198,176.113.115.84,80.94.92.60,156.146.59.25,89.248.165.44,193.32.126.212,45.61.184.9,167.94.138.60,62.210.88.140,45.148.10.72,185.220.101.34,91.207.175.14,103.224.182.251,51.158.108.203}}:5{{fake.aport2:dec:4}}] PHP Fatal error:  Uncaught Error: Class "Redis" not found in /var/www/{{persona.company.slug}}/app/Cache.php:24
    [Thu Oct 10 13:55:41.701255 2024] [autoindex:error] [pid {{fake.apid3:dec:5}}] [client {{pick:156.146.59.25,89.248.165.44,193.32.126.212,45.61.184.9,167.94.138.60,62.210.88.140,45.148.10.72,185.220.101.34,91.207.175.14,103.224.182.251,51.158.108.203,195.154.200.88,141.98.11.29,209.141.55.198,176.113.115.84,80.94.92.60}}:5{{fake.aport3:dec:4}}] AH01276: Cannot serve directory /var/www/{{persona.company.slug}}/public/uploads/: No matching DirectoryIndex (index.php,index.html) found
    [Thu Oct 10 13:55:52 2024] [mpm_prefork:notice] [pid {{fake.apid4:dec:5}}] AH00163: Apache/2.4.57 (Debian) PHP/8.1.2 configured -- resuming normal operations
taunt: { mode: line, open: '#' }
expect:
  - '[core:error]'
  - '[client '
  - 'AH00124'
