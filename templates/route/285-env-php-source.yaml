id: route-envfile-php-src
priority: 285
# Brand-new page: a leaked /.env.php — the PHP-array form of the environment file (some frameworks
# ship one). This is a RAW SOURCE LEAK: the interpreter never ran it, so it is served as text/plain,
# NOT application/x-php (executing/handing back x-php would be a tell). Same host identity and the
# same persona-seeded secrets as every other leaked config for this deployment (one host, one
# identity), so the disclosed DB/AWS/Stripe/SendGrid/JWT values agree with the sibling .env files.
# The id avoids the route-dotenv needles (dotenv/exposed-config/environment) and the bare `env-`
# substring; the body_word is AWS_SECRET_ACCESS_KEY (not APP_DEBUG=) — both keep that global enrich
# from hijacking this page to application/octet-stream.
new_page:
  method: GET
  paths: ['/.env.php']
  sig: 0
  status: 200
  severity: high
  tags: [exposure, config-disclosure, secrets, source-leak]
  name: 'Exposed environment file source (.env.php)'
  body_words: ['AWS_SECRET_ACCESS_KEY']
response:
  headers:
    Content-Type: "text/plain; charset=utf-8"
  body: |
    <?php
    // Environment configuration — production.
    // ctf: {{fake.flag:envphp}}

    return [
        'APP_ENV' => 'production',
        'APP_DEBUG' => false,

        'DB_CONNECTION' => 'pgsql',
        'DB_HOST' => '{{persona.db.host}}',
        'DB_PORT' => '5432',
        'DB_DATABASE' => '{{persona.db.name}}',
        'DB_USERNAME' => '{{persona.db.user}}',
        'DB_PASSWORD' => '{{persona.db.password}}',

        'AWS_ACCESS_KEY_ID' => '{{persona.cloud.aws.accessKeyId}}',
        'AWS_SECRET_ACCESS_KEY' => '{{persona.cloud.aws.secretKey}}',
        'AWS_DEFAULT_REGION' => '{{persona.cloud.aws.region}}',

        'STRIPE_SECRET_KEY' => '{{persona.cloud.stripe.secretKey}}',
        'SENDGRID_API_KEY' => '{{persona.cloud.sendgrid.apiKey}}',
        'JWT_SECRET' => '{{persona.secret.jwt}}',
    ];
taunt: { mode: line, open: '#' }
expect:
  - 'return ['
  - "'AWS_SECRET_ACCESS_KEY' =>"
  - 'AKIA'
  - 'sk_live_'
  - 'SG.'
  - 'FLAG.{'
  - '}.GALF'
