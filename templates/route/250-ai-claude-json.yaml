id: route-ai-claude-json
priority: 250
# Brand-new page: a dropped Claude Code project config (~/.claude.json) — carries the live
# API key plus the configured MCP servers, so an agent-config lure lands both a scanner-shaped
# secret and the MCP wiring an attacker would pivot on.
new_page:
  method: GET
  paths: ['/.claude.json']
  sig: 0
  status: 200
  severity: high
  tags: [exposure, ai-config, config-disclosure, appliance]
  name: 'Exposed Claude Code config (.claude.json)'
  body_words: ['mcpServers']
response:
  headers:
    Content-Type: "application/json"
  body: |
    {
    "numStartups": 42,
    "autoUpdaterStatus": "enabled",
    "model": "claude-sonnet-4-20250514",
    "apiKey": "{{persona.cloud.anthropic.apiKey}}",
    "mcpServers": {
      "filesystem": {
        "command": "npx",
        "args": ["-y", "@modelcontextprotocol/server-filesystem", "/srv/app"]
      },
      "github": {
        "command": "npx",
        "args": ["-y", "@modelcontextprotocol/server-github"],
        "env": { "GITHUB_PERSONAL_ACCESS_TOKEN": "ghp_{{fake.gh:hex:36}}" }
      }
    }
    }
taunt: { mode: inline_field, key: '_comment' }
expect: ['sk-ant-api03-', 'mcpServers']
