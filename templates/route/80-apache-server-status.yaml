id: route-apache-server-status
priority: 80
# Apache mod_status (/server-status, /server-info) — RFC-5737 client rows, example vhost.
match:
  template_needle: [apache-server-status, server-status, server-info]
response:
  headers:
    Content-Type: "text/html; charset=utf-8"
  body: |
    <!DOCTYPE html>
    <html><head><title>Apache Status</title></head><body>
    <h1>Apache Server Status for status.example.com (via 192.0.2.10)</h1>
    <dl>
    <dt>Server Version: Apache/{{pick:2.4.58,2.4.52,2.4.41}} (Unix) OpenSSL/3.0</dt>
    <dt>Server MPM: event</dt>
    <dt>Server Built: Jan  1 2024</dt>
    <dt>Current Time: Monday, 01-Jan-2024 00:00:00 UTC</dt>
    <dt>Server uptime: {{pick:3 days,11 hours,27 days}}</dt>
    <dt>Total accesses: 10423 - Total Traffic: 84.2 MB</dt>
    </dl>
    <pre>
    Srv  Client          VHost                Request
    0-0  198.51.100.24   www.example.com      GET / HTTP/1.1
    1-0  203.0.113.7     www.example.com      GET /favicon.ico HTTP/1.1
    </pre>
    </body></html>
taunt: { mode: block, open: '<!--', close: '-->' }
expect: ['Apache Server Status', 'Server Version']
