id: route-whm-login
priority: 383
# Brand-new page: the WHM (Web Host Manager) login screen served by cpsrvd on the reseller/admin
# surface (no nuclei template at this path). WHM is a DISTINCT product from the end-user cPanel login
# (382): a real host serves WHM-branded chrome here — the `Web Host Manager` wordmark, not cPanel — so
# a scanner probing /whm that expects WHM branding must not see the cPanel page. cpsrvd discloses
# itself in the `Server: cpsrvd/<ver>` banner (version-coherent with the body's `Version 118.0.13`).
# Served text/html. Ports 2083/2087 appear in copy only (4-digit, safe). Version is a dotted literal
# (no bare 6-digit run). Authored `low` severity.
new_page:
  method: GET
  paths: ['/whm']
  sig: 0
  status: 200
  severity: low
  tags: [whm, cpanel, panel, login, exposure]
  name: 'WHM login'
  body_words: ['WHM']
response:
  headers:
    Content-Type: "text/html; charset=utf-8"
    Server: "cpsrvd/11.118.0.13"
  body: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="/cpsess0000000000/styled/basic/css/cjt.css">
    </head>
    <body class="whm-login-page">
    <div id="whm_lm_container" class="login-container">
    <div class="brand"><h1>WHM</h1><p class="product">Web Host Manager</p></div>
    <form action="/login/?login_only=1" method="post" id="login_form" name="login_form">
    <input type="hidden" name="goto_uri" value="/">
    <div class="form-group">
    <label for="user">Username</label>
    <input type="text" id="user" name="user" autocomplete="username" placeholder="Enter your username.">
    </div>
    <div class="form-group">
    <label for="pass">Password</label>
    <input type="password" id="pass" name="pass" autocomplete="current-password" placeholder="Enter your password.">
    </div>
    <button type="submit" id="login_submit" class="btn-primary">Log in</button>
    </form>
    <p class="notice">You can reach WHM on port 2087 and cPanel on port 2083.</p>
    <div class="copyright">WHM Version 118.0.13</div>
    </div>
    </body>
    </html>
taunt: { mode: block, open: '<!--', close: '-->' }
expect:
  - '<h1>WHM</h1>'
  - 'Web Host Manager'
  - 'Version 118.0.13'
  - 'Server: cpsrvd/11.118.0.13'
