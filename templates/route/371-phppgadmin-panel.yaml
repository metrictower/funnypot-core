id: route-phppgadmin
priority: 371
# Enrich: the corpus routes /phppgadmin/ to the `phppgadmin-panel` bundle (body words `intro.php`,
# `browser.php`). Minimal synth would emit the bare words; here we serve the real phpPgAdmin frameset
# — the `browser.php` navigation frame and the `intro.php` content frame — plus a generator meta that
# carries the product name and version a scanner reads. Needle is the full upstream id (findRule is
# global). phpPgAdmin manages PostgreSQL, so this panel is coherent with the persona app db (the
# strongest coherence of the pack); it never names MySQL. Version is a dotted literal (no bare 6-digit
# run). Content-Type is text/html.
match:
  template_needle: [phppgadmin-panel]
response:
  headers:
    Content-Type: "text/html; charset=utf-8"
  body: |
    <!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Frameset//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-frameset.dtd">
    <html xmlns="http://www.w3.org/1999/xhtml">
    <head>
    <title>phpPgAdmin</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="generator" content="phpPgAdmin 7.13.0" />
    </head>
    <frameset cols="25%,75%" id="frame">
    <frame src="browser.php" name="browser" title="phpPgAdmin navigation frame" />
    <frame src="intro.php" name="detail" title="phpPgAdmin content frame" />
    <noframes><body>
    <p>Your browser does not support frames. phpPgAdmin requires a browser with frames support.</p>
    <p><a href="intro.php">Continue to phpPgAdmin</a></p>
    </body></noframes>
    </frameset>
    </html>
taunt: { mode: block, open: '<!--', close: '-->' }
expect:
  - 'browser.php'
  - 'intro.php'
  - 'phpPgAdmin 7.13.0'
