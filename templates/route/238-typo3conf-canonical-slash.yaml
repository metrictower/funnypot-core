id: route-typo3conf-canonical-slash
priority: 238
# DirectorySlash 301 for the no-slash /typo3conf base. The autoindex listing (route/391) now owns only
# the trailing-slash /typo3conf/; a bare /typo3conf would resolve the listing's relative link
# (href="localconf.php") against / and dangle. Real Apache answers a no-slash directory with a 301 to the
# slash form, which makes that relative link base-independent — a 200 listing body at the no-slash URL is
# a mild tell whose link also dangles. The Location is the static rooted-relative /typo3conf/ (never Host /
# query / scheme / a captured value), so there is no open redirect; the slash target never matches this
# redirect, so there is no loop. Body/headers are the byte-for-byte IETF-HTML-2.0 shape produced by
# TemplateAttackEmulator::canonicalSlashRedirect(); no taunt, iso-8859-1 as Apache hard-codes for its
# redirect docs. The id avoids the `directory-listing` needle so route 180 never redresses it.
new_page:
  method: GET
  paths: ['/typo3conf']
  sig: 0
  status: 301
  severity: medium
  tags: [exposure, cms, typo3]
  name: 'Canonical-slash redirect for /typo3conf'
  body_words: ['Moved Permanently']
response:
  headers:
    Content-Type: "text/html; charset=iso-8859-1"
    Location: "/typo3conf/"
  body: |
    <!DOCTYPE HTML PUBLIC "-//IETF//DTD HTML 2.0//EN">
    <html><head>
    <title>301 Moved Permanently</title>
    </head><body>
    <h1>Moved Permanently</h1>
    <p>The document has moved <a href="/typo3conf/">here</a>.</p>
    </body></html>
expect:
  - 'Moved Permanently'
  - 'href="/typo3conf/"'
