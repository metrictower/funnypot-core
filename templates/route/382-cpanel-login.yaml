id: route-cpanel-login
priority: 382
# Brand-new page: the cPanel end-user login screen served by cpsrvd (no nuclei template at this path).
# /cpanel is one of the most-probed control-panel paths. cpsrvd discloses itself in the `Server:
# cpsrvd/<ver>` response banner (version-coherent with the body's `Version 118.0.13`). WHM (/whm) is a
# DISTINCT product surface with its own branding, split into its own template (383) — a real host does
# not serve byte-identical chrome on both. Served text/html. Ports 2083/2087 appear in copy only
# (4-digit, safe). Version is a dotted literal (no bare 6-digit run). Authored `low` severity.
new_page:
  method: GET
  paths: ['/cpanel']
  sig: 0
  status: 200
  severity: low
  tags: [cpanel, panel, login, exposure]
  name: 'cPanel login'
  body_words: ['cPanel']
response:
  headers:
    Content-Type: "text/html; charset=utf-8"
    Server: "cpsrvd/11.118.0.13"
  body: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <style>
    :root{color-scheme:light}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(160deg,#133a5e,#071726);color:#1b1b1b;display:flex;align-items:center;justify-content:center;padding:1.5rem}
    .login-container{width:100%;max-width:24rem;background:#fff;border-radius:.5rem;box-shadow:0 .5rem 1.5rem rgba(0,0,0,.35);padding:1.75rem 1.5rem}
    .brand{text-align:center;margin-bottom:1.25rem}
    .brand h1{margin:0;font-size:1.6rem;font-weight:700;color:#ff6c2c}
    .brand .product{margin:.2rem 0 0;color:#555;font-size:.9rem}
    .notice{font-size:.85rem;color:#666;text-align:center;margin:.75rem 0}
    .notice.error{color:#9a2a2a;background:#f8d7da;border:1px solid #f5c2c7;border-radius:.3rem;padding:.5rem}
    .form-group{margin-bottom:1rem}
    .form-group label{display:block;margin-bottom:.3rem;font-size:.85rem;color:#333}
    .form-group input{width:100%;padding:.55rem .7rem;border:1px solid #cfd4da;border-radius:.3rem;font-size:1rem}
    .btn-primary{width:100%;padding:.6rem;border:0;border-radius:.3rem;background:#ff6c2c;color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
    .btn-primary:hover{background:#ff7f45}
    .copyright{text-align:center;color:#888;font-size:.75rem;margin-top:1.1rem}
    </style>
    </head>
    <body class="cpanel-login-page">
    <div id="cpanel_lm_container" class="login-container">
    <div class="brand"><h1>cPanel</h1></div>
    <form action="/login/?login_only=1" method="post" id="login_form" name="login_form">
    <input type="hidden" name="goto_uri" value="/">
    <div class="form-group">
    <label for="user">Username</label>
    <input type="text" id="user" name="user" autocomplete="username" placeholder="Enter your username.">
    </div>
    <div class="form-group">
    <label for="pass">Password</label>
    <input type="password" id="pass" name="pass" autocomplete="current-password" placeholder="Enter your password.">
    </div>
    <button type="submit" id="login_submit" class="btn-primary">Log in</button>
    </form>
    <p class="notice">You can reach cPanel on port 2083 and WHM on port 2087.</p>
    <div class="copyright">cPanel &amp; WHM Version 118.0.13</div>
    </div>
    </body>
    </html>
taunt: { mode: block, open: '<!--', close: '-->' }
expect:
  - '<h1>cPanel</h1>'
  - 'Version 118.0.13'
  - 'Server: cpsrvd/11.118.0.13'
