# mark, NO vendor artwork) whose Shodan favicon hash == 116323821. Provenance + forge:
# resources/favicons/README.md. Served image/x-icon (no charset); bytes base64-at-rest.
new_page:
  method: GET
  paths: ['/manager/favicon.ico']
  sig: 0                # a favicon fetch always serves (not a probe-gated root entry)
  status: 200
  severity: info
  tags: [tomcat, favicon, exposure]
  name: 'Tomcat favicon'
response:
  headers: { Content-Type: 'image/x-icon' }
  body_b64: ''
