id: route-ai-plugin
priority: 334
# Enrich: the corpus routes /.well-known/ai-plugin.json to the `openai-plugin` bundle (body words
# `"schema_version":`, `"name_for_model":`). Minimal synth would emit the bare words; here we serve
# a real ChatGPT-plugin manifest that points at this host's OpenAPI doc and leaks the admin contact,
# persona-seeded to stay coherent. The body opens with a lone `{` so the JSON taunt (a `_comment`
# field after the first newline) keeps the document parseable. Content-Type is application/json.
# The optional `logo_url` (/logo.png) and `legal_info_url` (/legal) fields are omitted: now that the
# sitemap spine (393) is in play they would be advertised same-host URLs that resolve to 404 — a
# partial-tree tell. Dropping them keeps the manifest coherent and advertises nothing unresolvable.
match:
  template_needle: [openai-plugin]
response:
  headers:
    Content-Type: "application/json"
  body: |
    {
    "schema_version": "v1",
    "name_for_model": "{{persona.company.slug}}_api",
    "name_for_human": "{{persona.company.name}} API",
    "description_for_model": "Query the {{persona.company.name}} internal API for users, orders and auth.",
    "description_for_human": "Access {{persona.company.name}} data.",
    "auth": { "type": "service_http", "authorization_type": "bearer" },
    "api": { "type": "openapi", "url": "https://{{persona.company.domain}}/openapi.json" },
    "contact_email": "{{persona.user.admin.email}}"
    }
taunt: { mode: inline_field, key: '_comment' }
expect:
  - '"schema_version": "v1"'
  - '"name_for_model":'
  - '"contact_email":'
