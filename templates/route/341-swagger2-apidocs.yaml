id: route-swagger2-apidocs
priority: 341
# Brand-new page: /v2/api-docs, a Swagger 2.0 document (NOT OpenAPI 3.0). Kept as a real 2.0 doc
# rather than cloning the 3.0 body, so a host that publishes both a 2.0 and a 3.0 spec (a common
# migration/gateway setup) stays internally coherent. The doc is framework-neutral — generic Swagger
# 2.0 with an apiKey bearer scheme — matching the stack-neutral OpenAPI 3.0 doc at /v3/api-docs; now
# that neither doc leaks a PHP docroot there is no framework contradiction across the two surfaces.
# Persona-seeded host + contact. Served application/json (the endpoint's real type). Opens with a lone
# `{` for the JSON taunt. FP-0278: the four operation paths are per-deploy-seeded nouns under the
# expect-pinned basePath /api/v1 ({{surface.noun:c1|c2|d1|d2}}, the SAME nouns the other docs advertise),
# and the definition is a noun-neutral `Page` mirroring the 398 envelope (data/page/per_page/total) so
# no seed can make the doc name a type the served nouns contradict. The example total is dec:4.
new_page:
  method: GET
  paths: ['/v2/api-docs']
  sig: 0
  status: 200
  severity: info
  tags: [exposure, api, swagger, discovery]
  name: 'Exposed Swagger 2.0 document'
  body_words: ['"swagger":', '"paths"']
response:
  headers:
    Content-Type: "application/json"
  body: |
    {
    "swagger": "2.0",
    "info": {
      "title": "{{persona.company.name}} API",
      "version": "1.8.2",
      "contact": { "email": "{{persona.user.admin.email}}" }
    },
    "host": "{{persona.company.domain}}",
    "basePath": "/api/v1",
    "schemes": [ "https" ],
    "securityDefinitions": {
      "Bearer": { "type": "apiKey", "name": "Authorization", "in": "header" }
    },
    "paths": {
      "/{{surface.noun:c1}}": { "get": { "summary": "List {{surface.noun:c1}}", "responses": { "200": { "description": "OK" }, "401": { "description": "Unauthorized" } } } },
      "/{{surface.noun:c2}}": { "get": { "summary": "List {{surface.noun:c2}}", "responses": { "200": { "description": "OK" }, "401": { "description": "Unauthorized" } } } },
      "/{{surface.noun:d1}}": { "get": { "summary": "Service {{surface.noun:d1}}", "responses": { "200": { "description": "OK" } } } },
      "/{{surface.noun:d2}}": { "get": { "summary": "Service {{surface.noun:d2}}", "responses": { "200": { "description": "OK" }, "401": { "description": "Unauthorized" } } } }
    },
    "definitions": {
      "Page": { "type": "object", "properties": { "data": { "type": "array", "items": { "type": "object" } }, "page": { "type": "integer" }, "per_page": { "type": "integer" }, "total": { "type": "integer", "example": {{fake.pagetotal:dec:4}} } } }
    }
    }
taunt: { mode: inline_field, key: '_comment' }
expect:
  - '"swagger": "2.0"'
  - '"basePath": "/api/v1"'
  - '"securityDefinitions"'
