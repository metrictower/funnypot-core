id: route-swagger2-apidocs
priority: 341
# Brand-new page: /v2/api-docs, a Swagger 2.0 document (NOT OpenAPI 3.0). Kept as a real 2.0 doc
# rather than cloning the 3.0 body, so a host that publishes both a 2.0 and a 3.0 spec (a common
# migration/gateway setup) stays internally coherent. The doc is framework-neutral — generic Swagger
# 2.0 with an apiKey bearer scheme — matching the stack-neutral OpenAPI 3.0 doc at /v3/api-docs; now
# that neither doc leaks a PHP docroot there is no framework contradiction across the two surfaces.
# Persona-seeded host + contact. Served application/json (the endpoint's real type). Opens with a lone
# `{` for the JSON taunt; the example id is dec:5.
new_page:
  method: GET
  paths: ['/v2/api-docs']
  sig: 0
  status: 200
  severity: info
  tags: [exposure, api, swagger, discovery]
  name: 'Exposed Swagger 2.0 document'
  body_words: ['"swagger":', '"paths"']
response:
  headers:
    Content-Type: "application/json"
  body: |
    {
    "swagger": "2.0",
    "info": {
      "title": "{{persona.company.name}} API",
      "version": "1.8.2",
      "contact": { "email": "{{persona.user.admin.email}}" }
    },
    "host": "{{persona.company.domain}}",
    "basePath": "/api/v1",
    "schemes": [ "https" ],
    "securityDefinitions": {
      "Bearer": { "type": "apiKey", "name": "Authorization", "in": "header" }
    },
    "paths": {
      "/users": { "get": { "summary": "List users", "responses": { "200": { "description": "OK" }, "401": { "description": "Unauthorized" } } } },
      "/orders": { "get": { "summary": "List orders", "responses": { "200": { "description": "OK" }, "401": { "description": "Unauthorized" } } } },
      "/status": { "get": { "summary": "Service status", "responses": { "200": { "description": "OK" } } } },
      "/config": { "get": { "summary": "Service configuration", "responses": { "200": { "description": "OK" }, "401": { "description": "Unauthorized" } } } }
    },
    "definitions": {
      "User": { "type": "object", "properties": { "id": { "type": "integer", "example": {{fake.userid:dec:5}} }, "email": { "type": "string" } } }
    }
    }
taunt: { mode: inline_field, key: '_comment' }
expect:
  - '"swagger": "2.0"'
  - '"basePath": "/api/v1"'
  - '"securityDefinitions"'
