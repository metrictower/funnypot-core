id: route-llm-auth
priority: 259
# Brand-new page: an OpenAI-compatible chat/completions surface (/v1/chat, /v1/completions). No
# Authorization header returns the vendor's own 401 body — the fingerprint of a live LLM gateway.
# Error responses carry no taunt (they must stay parseable JSON).
new_page:
  method: GET
  paths: ['/v1/chat', '/v1/completions']
  sig: 0
  status: 401
  severity: medium
  tags: [exposure, ai-config, llm-gateway, appliance]
  name: 'LLM gateway auth required'
  body_words: ['invalid_request_error']
response:
  headers:
    Content-Type: "application/json"
  body: |
    {"error":{"message":"You didn't provide an API key. You need to provide your API key in an Authorization header using Bearer auth (i.e. Authorization: Bearer YOUR_KEY).","type":"invalid_request_error","param":null,"code":null}}
expect: ['invalid_request_error', 'Authorization header']
