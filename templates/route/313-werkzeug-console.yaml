id: route-werkzeug-console
priority: 313
# Enrich: /console carries THREE bundles (websphere, selenium, werkzeug); this needle selects ONLY
# the `werkzeug-debugger-detect` bundle (body word `<h1>Interactive Console</h1>`), so it fires just
# when the persona picks the werkzeug bundle — the other two are untouched. We serve the real
# Werkzeug debugger console, but LOCKED: unauthenticated it shows the shell and the PIN wall, never
# a command surface. The PIN itself is never rendered (zero-exec by construction, and no `xxx-xxx-xxx`
# digit token). Needle is the full upstream id (findRule is global).
match:
  template_needle: [werkzeug-debugger-detect]
response:
  headers:
    Content-Type: "text/html; charset=utf-8"
  body: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Console // Werkzeug Debugger</title>
      <style>
      body{margin:0;background:#f8f8f8;color:#000;font-family:"Lucida Grande","Lucida Sans Unicode",Verdana,sans-serif;font-size:15px}
      div.debugger{background:#fff;padding:12px 30px 24px;margin:0}
      h1{font-family:"Georgia","Times New Roman",serif;font-size:36px;font-weight:normal;color:#11557C;margin:18px 0 12px}
      div.console{border:1px solid #ccc;padding:0;background:#fafafa;margin:0 0 12px}
      div.console div.output{background:#fafafa;color:#222;font-family:"Consolas","Deja Vu Sans Mono","Bitstream Vera Sans Mono",monospace;font-size:13px;padding:10px 12px;white-space:pre-wrap}
      div.footer{color:#86989B;font-size:13px;text-align:right;margin:10px 0 0}
      span.fw{font-weight:bold;color:#11557C}
      </style>
    </head>
    <body>
      <div class="debugger">
        <h1>Interactive Console</h1>
        <div class="console"><div class="output">The console is locked and needs to be unlocked by entering the PIN. You can find the PIN printed out on the standard output of your shell that runs the server.</div></div>
        <div class="footer">Brought to you by <span class="fw">Werkzeug 2.3.7</span></div>
      </div>
    </body>
    </html>
taunt: { mode: block, open: '<!--', close: '-->' }
expect:
  - '<h1>Interactive Console</h1>'
  - 'The console is locked'
