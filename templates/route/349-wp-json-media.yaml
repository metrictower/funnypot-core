id: route-wp-json-v2-media
priority: 349
# WordPress REST API media library: GET /wp-json/wp/v2/media. Two image attachments (ids 20 and 24)
# that the posts collection references as featured_media, uploaded by the same persona users. Numbers
# are image dimensions/filesizes only — kept clear of any bare denied digit run. No competing bundle
# on this path.
new_page:
  method: GET
  paths: ['/wp-json/wp/v2/media', '/wp-json/wp/v2/media/']
  sig: 0
  status: 200
  severity: info
  tags: [exposure, api, wordpress, discovery]
  name: 'Exposed WordPress REST API media'
  body_words: ['"type":"attachment"', '"media_type":"image"']
  weight: 1000
response:
