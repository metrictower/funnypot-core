id: route-swagger-json-doc
priority: 340
# Brand-new page: the classic OpenAPI/Swagger doc endpoints (/swagger.json, /v3/api-docs, …) that a
# recon scanner hits to map an app's whole API surface. One shared OpenAPI 3.0 document, byte-
# identical to the /openapi.json enrich for one host, leaking the server URL, the endpoint list and a
# JWT-shaped example bearer token (real HS256 header + seed-derived payload/signature, matching the
# doc's `bearerFormat: JWT` — not the raw HMAC signing secret). The description is framework-neutral
# (no docroot), so it never contradicts the Swagger 2.0 doc at /v2/api-docs. Served application/json
# (the `.json`/api-docs endpoint's real type). The id carries NO `openapi` substring, so the
# /openapi.json `openapi` enrich can never hijack this bundle. Opens with a lone `{` for the JSON
# taunt; the order id is dec:5 (never a bare 6-digit run).
new_page:
  method: GET
  paths: ['/swagger.json', '/api/swagger.json', '/v3/api-docs', '/api-docs', '/.well-known/openapi.json']
  sig: 0
  status: 200
  severity: info
  tags: [exposure, api, openapi, discovery]
  name: 'Exposed OpenAPI/Swagger document'
  body_words: ['"openapi":', '"paths"']
response:
  headers:
    Content-Type: "application/json"
  body: |
    {
    "openapi": "3.0.3",
    "info": {
      "title": "{{persona.company.name}} API",
      "description": "Internal REST API for {{persona.company.name}}. Not for public distribution.",
      "version": "1.8.2",
      "contact": { "email": "{{persona.user.admin.email}}" }
    },
    "servers": [
      { "url": "https://{{persona.company.domain}}", "description": "Production" }
    ],
    "paths": {
      "/api/v1/{{surface.noun:c1}}": {
        "get": {
          "summary": "List {{surface.noun:c1}}",
          "responses": { "200": { "description": "OK" }, "401": { "description": "Unauthorized" } }
        }
      },
      "/api/v1/{{surface.noun:c2}}": {
        "get": {
          "summary": "List {{surface.noun:c2}}",
          "responses": { "200": { "description": "OK" }, "401": { "description": "Unauthorized" } }
        }
      },
      "/api/v1/{{surface.noun:d1}}": {
        "get": {
          "summary": "Service {{surface.noun:d1}}",
          "responses": { "200": { "description": "OK" } }
        }
      },
      "/api/v1/{{surface.noun:d2}}": {
        "get": {
          "summary": "Service {{surface.noun:d2}}",
          "responses": { "200": { "description": "OK" }, "401": { "description": "Unauthorized" } }
        }
      },
      "/metrics": {
        "get": {
          "summary": "Prometheus metrics",
          "responses": { "200": { "description": "OK" } }
        }
      },
      "/webhooks": {
        "get": {
          "summary": "List webhook subscriptions",
          "responses": { "200": { "description": "OK" }, "401": { "description": "Unauthorized" } }
        }
      },
      "/auth/login": {
        "post": {
          "summary": "Authenticate and receive a bearer token",
          "responses": { "200": { "description": "OK" }, "400": { "description": "Bad Request" } }
        }
      },
      "/auth/token": {
        "post": {
          "summary": "Exchange credentials for a bearer token",
          "responses": { "200": { "description": "OK" }, "401": { "description": "Unauthorized" } }
        }
      }
    },
    "components": {
      "securitySchemes": {
        "bearerAuth": { "type": "http", "scheme": "bearer", "bearerFormat": "JWT" },
        "apiKey": { "type": "apiKey", "in": "header", "name": "X-API-Key" }
      },
      "examples": {
        "authToken": { "summary": "Example Authorization header", "value": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ{{fake.jwtpayload:b64url:43}}.{{fake.jwtsig:b64url:43}}" }
      }
    }
    }
taunt: { mode: inline_field, key: '_comment' }
expect:
  - '"openapi": "3.0.3"'
  - '"paths"'
  - '"securitySchemes"'
  - 'Bearer '
