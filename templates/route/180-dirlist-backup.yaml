id: route-dirlist-backup
priority: 180
# Path-aware listing of a /backup/ directory. route_key-guarded to GET /backup/. Its three links —
# credentials.txt, config.xml, users.csv — resolve to served lures under /backup/. The bundle
# carries only a regex witness ("Index of a/backup"), placed verbatim in an HTML comment so the rich
# body is served instead of the bare-witness minimal fallback (FP-0316).
match:
  template_needle: [directory-listing]
  route_key: ['GET /backup/']
response:
  headers:
    Content-Type: "text/html; charset=utf-8"
  body: |
    <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 3.2 Final//EN">
    <html><head><title>Index of /backup</title></head>
    <body>
    <h1>Index of /backup</h1>
    <pre><a href="?C=N;O=D">Name</a>  <a href="?C=M;O=A">Last modified</a>  <a href="?C=S;O=A">Size</a>
    <hr>
    <a href="../">Parent Directory</a>                      -
    <a href="credentials.txt">credentials.txt</a>  2024-01-01 12:00   983
    <a href="config.xml">config.xml</a>            2024-01-01 12:00  2.4K
    <a href="users.csv">users.csv</a>              2024-01-01 12:00   832
    <hr></pre>
    <address>Apache Server at {{persona.company.domain}} Port 80</address>
    <!-- Index of a/backup -->
    </body></html>
taunt: { mode: block, open: '<!--', close: '-->' }
expect:
  - 'Index of /backup'
  - 'href="credentials.txt"'
