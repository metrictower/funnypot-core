id: route-confluence-setup-admin
priority: 422
# FP-0465: the CVE-2023-22515 setup-administrator form. After 22515 re-opens the setup wizard, the
# exploit GETs /setup/setupadministrator.action and then POSTs username/password/email/fullName to
# create an unauthenticated admin. A stateless core cannot gate this behind the flipped flag, so the
# easy-lure choice is to always serve the form (GET) and always accept the POST (sibling 423 -> 302),
# capturing the submitted credentials in ordinary request telemetry — the intel value. No admin is ever
# really created. Inert: static form HTML, no request byte reflected, any origin. The matching
# {{persona.confluence.version}} footer keeps this coherent with the dashboard/server-info surfaces.
new_page:
  method: GET
  paths: ['/setup/setupadministrator.action']
  sig: 0
  status: 200
  severity: high
  tags: [confluence, atlassian, setup, auth-bypass, admin-trap]
  name: 'Confluence setup administrator form'
  body_words: ['Confluence', 'Administrator Account']
response:
  headers:
    Content-Type: "text/html;charset=UTF-8"
  body: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Configure System Administrator Account - Confluence</title>
    <style>
    body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;color:#172b4d;background:#f4f5f7}
    #wrap{max-width:32rem;margin:40px auto;background:#fff;border:1px solid #dfe1e6;border-radius:3px;padding:28px 32px}
    .logo{font-weight:700;color:#0052cc;font-size:20px;margin-bottom:8px}
    h1{font-size:20px;font-weight:500;margin:0 0 20px}
    label{display:block;font-size:13px;color:#6b778c;margin:14px 0 4px}
    input{display:block;width:100%;padding:8px 10px;border:1px solid #dfe1e6;border-radius:3px;font-size:14px;box-sizing:border-box}
    button{margin-top:22px;padding:8px 18px;border:0;border-radius:3px;background:#0052cc;color:#fff;font-size:14px;cursor:pointer}
    #footer{color:#6b778c;font-size:12px;text-align:center;margin-top:24px}
    </style>
    </head>
    <body>
    <div id="wrap">
    <div class="logo">Confluence</div>
    <h1>Configure System Administrator Account</h1>
    <form action="/setup/setupadministrator.action" method="post">
    <label for="fullName">Full Name</label>
    <input type="text" id="fullName" name="fullName" autocomplete="name">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" autocomplete="email">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" value="admin">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="new-password">
    <label for="confirm">Confirm Password</label>
    <input type="password" id="confirm" name="confirm" autocomplete="new-password">
    <button type="submit">Next</button>
    </form>
    <div id="footer">Atlassian Confluence <span id='footer-build-information'>{{persona.confluence.version}}</span></div>
    </div>
    </body>
    </html>
expect:
  - "Administrator Account"
