id: route-falcosidekick-login
priority: 418
# FP-0529: styled Falcosidekick UI landing for the shared poly-stack /login/ path; weight:100000 so a
# styled product login wins over the corpus minimal (PersonaSelector). Self-contained inline CSS + SVG
# (FP-0526). Re-derived, never vendored.
new_page:
  method: GET
  paths: ['/login/', '/login']
  sig: 0
  status: 200
  severity: low
  weight: 100000
  tags: [falcosidekick, panel, login, exposure]
  name: 'Falcosidekick login'
  body_words: ['falcosidekick']
response:
  headers:
    Content-Type: "text/html; charset=utf-8"
  body: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>falcosidekick ui</title>
    <style>
    :root{color-scheme:light}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#12141c;color:#e6e8ef;display:flex;align-items:center;justify-content:center;padding:1.5rem}
    .panel{width:100%;max-width:23rem;background:#1b1e29;border:1px solid #2a2f3d;border-radius:.5rem;box-shadow:0 .5rem 1.5rem rgba(0,0,0,.5);padding:2rem 1.75rem;text-align:center}
    .mark svg{width:52px;height:52px}
    .title{font-size:1.35rem;font-weight:700;margin:.6rem 0 .2rem}
    .title .ui{color:#3fb6a8}
    .sub{font-size:.85rem;color:#8b93a7;margin-bottom:1.6rem}
    form{text-align:left}
    .field{margin-bottom:1rem}
    label{display:block;margin-bottom:.35rem;font-size:.8rem;color:#8b93a7}
    input{display:block;width:100%;padding:.55rem .7rem;border:1px solid #2a2f3d;border-radius:.3rem;background:#12141c;color:#e6e8ef;font-size:1rem}
    .btn{width:100%;padding:.6rem;border:0;border-radius:.3rem;background:#3fb6a8;color:#0b1113;font-size:1rem;font-weight:600;cursor:pointer}
    .btn:hover{background:#4cc9ba}
    .foot{margin-top:1.4rem;font-size:.72rem;color:#5b6376}
    </style>
    </head>
    <body>
    <div class="panel">
    <div class="mark">
    <svg viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg" aria-label="Falcosidekick"><circle cx="28" cy="28" r="26" fill="#1b1e29" stroke="#3fb6a8" stroke-width="2.5"/><path d="M18 34c4-14 16-18 22-18-2 8-8 11-8 11l4 1-3 3 3 1c-6 4-14 4-18 1z" fill="#3fb6a8"/><circle cx="33" cy="22" r="1.8" fill="#12141c"/></svg>
    </div>
    <div class="title">falcosidekick <span class="ui">ui</span></div>
    <div class="sub">Runtime security event console</div>
    <form method="post" action="/login/">
    <div class="field">
    <label for="username">User</label>
    <input type="text" id="username" name="username" autocomplete="username" autofocus>
    </div>
    <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password">
    </div>
    <button type="submit" class="btn">Enter</button>
    </form>
    <div class="foot">falcosidekick ui</div>
    </div>
    </body>
    </html>
taunt: { mode: block, open: '<!--', close: '-->' }
expect:
  - 'falcosidekick ui'
  - 'name="username"'
