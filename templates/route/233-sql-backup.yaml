id: route-sql-backup
priority: 233
# Brand-new page: a downloadable SQL backup at a bare path (no nuclei template routes here).
# api_keys table exists so the dump also trips AWS/Stripe/SendGrid secret scanners.
new_page:
  method: GET
  paths: ['/backup.sql', '/database.sql', '/dump.sql', '/db_backup.sql']
  sig: 0
  status: 200
  severity: high
  tags: [exposure, database, backup]
  name: 'Exposed SQL backup'
  body_words: ['CREATE TABLE']
response:
  headers:
    Content-Type: "application/sql"
  body: |
    -- MySQL dump 10.13  Distrib 8.0.36
    -- Host: localhost    Database: {{pick:app_prod,cms,billing,shop}}
    -- ------------------------------------------------------

    DROP TABLE IF EXISTS `users`;
    CREATE TABLE `users` (
      `id` int(11) NOT NULL AUTO_INCREMENT,
      `email` varchar(255) NOT NULL,
      `password` varchar(255) NOT NULL,
      PRIMARY KEY (`id`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    INSERT INTO `users` VALUES (1,'{{persona.user.admin.email}}','$2y$10${{fake.bc1:hex:53}}');
    INSERT INTO `users` VALUES (2,'{{fake.person.email:bak-r2}}','$2y$10${{fake.bc2:hex:53}}');
    INSERT INTO `users` VALUES (3,'{{fake.person.email:bak-r3}}','$2y$10${{fake.bc3:hex:53}}');
    INSERT INTO `users` VALUES (4,'{{fake.person.email:bak-r4}}','$2y$10${{fake.bc4:hex:53}}');
    INSERT INTO `users` VALUES (5,'support@{{persona.company.domain}}','$2y$10${{fake.bc5:hex:53}}');

    DROP TABLE IF EXISTS `api_keys`;
    CREATE TABLE `api_keys` (
      `id` int(11) NOT NULL AUTO_INCREMENT,
      `name` varchar(64) NOT NULL,
      `secret` varchar(255) NOT NULL,
      PRIMARY KEY (`id`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    INSERT INTO `api_keys` VALUES (1,'AWS_ACCESS_KEY_ID','{{persona.cloud.aws.accessKeyId}}');
    INSERT INTO `api_keys` VALUES (2,'AWS_SECRET_ACCESS_KEY','{{persona.cloud.aws.secretKey}}');
    INSERT INTO `api_keys` VALUES (3,'STRIPE_SECRET','{{persona.cloud.stripe.secretKey}}');
    INSERT INTO `api_keys` VALUES (4,'SENDGRID_API_KEY','{{persona.cloud.sendgrid.apiKey}}');
taunt: { mode: line, open: '--' }
expect: ['CREATE TABLE', 'PRIMARY KEY']
