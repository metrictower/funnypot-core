id: route-webmin
priority: 370
# Enrich: the corpus routes /webmin/ to the `webmin-panel` bundle (body word
# `<title>Login to Webmin</title>`). Minimal synth would emit the bare title; here we serve the real
# Webmin session-login page — the `session_login.cgi` POST form with its `user`/`pass` fields. The
# real pre-auth login page names the HOSTNAME only: no product version, no OS (those appear on the
# post-login index). The version is disclosed where real miniserv discloses it pre-auth — the `Server:
# MiniServ/<ver>` response banner (keep the literal in lockstep with any version bump). No OS/distro
# is named, so nothing floats against the Apache server-status `(Unix)` surface. Needle is the full
# upstream id (findRule is global). Content-Type is text/html; version is a dotted literal (no bare
# 6-digit run). The `testing` cookie is miniserv's static cookie-support probe (literal value `1`,
# byte-static on every login-page load), not a session token — a random 32-hex value here is a tell.
match:
  template_needle: [webmin-panel]
response:
  headers:
    Content-Type: "text/html; charset=utf-8"
    Server: "MiniServ/2.111"
    Set-Cookie: "testing=1; path=/; secure; httponly"
  body: |
    <!DOCTYPE html>
    <html><head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Login to Webmin</title>
    <link rel="stylesheet" type="text/css" href="/unauthenticated/style.css">
    </head>
    <body class="login" leftmargin="0" topmargin="0">
    <div class="login-page">
    <form action="/session_login.cgi" method="post" name="loginform" autocomplete="off">
    <input type="hidden" name="page" value="/">
    <h1>Login to Webmin</h1>
    <p>You must enter a username and password to login to the Webmin server on {{persona.company.domain}}.</p>
    <table cellpadding="3">
    <tr><td><b>Username</b></td><td><input name="user" type="text" size="20" value=""></td></tr>
    <tr><td><b>Password</b></td><td><input name="pass" type="password" size="20" value=""></td></tr>
    </table>
    <input type="submit" value="Login">
    <label><input type="checkbox" name="save" value="1"> Remember login permanently?</label>
    </form>
    </div>
    </body></html>
taunt: { mode: block, open: '<!--', close: '-->' }
expect:
  - '<title>Login to Webmin</title>'
  - 'action="/session_login.cgi"'
  - 'Server: MiniServ/2.111'
  - 'Set-Cookie: testing=1'
