id: route-wp-json-v2-categories
priority: 350
# WordPress REST API category terms: GET /wp-json/wp/v2/categories. The two categories the posts
# collection assigns (id 1 Uncategorized, id 5 News); each `count` matches the number of posts served
# under it (post 1 under 1; posts 8 and 15 under 5), so the term counts never contradict the corpus.
new_page:
  method: GET
  paths: ['/wp-json/wp/v2/categories', '/wp-json/wp/v2/categories/']
  sig: 0
  status: 200
  severity: info
  tags: [exposure, api, wordpress, discovery]
  name: 'Exposed WordPress REST API categories'
  body_words: ['"taxonomy":"category"', '"slug"']
  weight: 1000
response:
  headers:
    Content-Type: "application/json"
  body: |
    [{"id":1,"count":1,"description":"","link":"https://{{persona.company.domain}}/category/uncategorized/","name":"Uncategorized","slug":"uncategorized","taxonomy":"category","parent":0,"meta":[],"_links":{"self":[{"href":"https://{{persona.company.domain}}/wp-json/wp/v2/categories/1"}],"collection":[{"href":"https://{{persona.company.domain}}/wp-json/wp/v2/categories"}],"about":[{"href":"https://{{persona.company.domain}}/wp-json/wp/v2/taxonomies/category"}]}},
    {"id":5,"count":2,"description":"Company news and announcements","link":"https://{{persona.company.domain}}/category/news/","name":"News","slug":"news","taxonomy":"category","parent":0,"meta":[],"_links":{"self":[{"href":"https://{{persona.company.domain}}/wp-json/wp/v2/categories/5"}],"collection":[{"href":"https://{{persona.company.domain}}/wp-json/wp/v2/categories"}],"about":[{"href":"https://{{persona.company.domain}}/wp-json/wp/v2/taxonomies/category"}]}}]
expect:
  - '"taxonomy":"category"'
  - '"slug":"news"'
