id: route-kibana
priority: 372
# Enrich: the corpus routes /app/kibana to the `exposed-kibana` bundle (body words `kibanaWelcomeView`,
# `<title>Kibana</title>`). Minimal synth would emit the bare words; here we serve the real Kibana
# bootstrap shell — the `kbn-injected-metadata` element (carrying the exact version a scanner reads)
# and the `kibanaWelcomeView` loading screen. Needle is `exposed-kibana`, the tighter of the two co-ids
# on this route and unique across the corpus (findRule is global). Kibana is engine-agnostic, so this
# panel names no database. Version is a dotted literal and the buildNumber is a 5-digit tag (no bare
# 6-digit run). Content-Type is text/html.
match:
  template_needle: [exposed-kibana]
response:
  headers:
    Content-Type: "text/html; charset=utf-8"
  body: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width">
    <title>Kibana</title>
    <style>.kibanaWelcomeView{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}</style>
    </head>
    <body>
    <kbn-injected-metadata data='{"version":"7.17.18","buildNumber":61123,"branch":"7.17","legacyMetadata":{"uiSettings":{"defaults":{},"user":{}}}}'></kbn-injected-metadata>
    <div class="kibanaWelcomeView" id="kbn_loading_message" style="display:none">
    <div class="kibanaWelcomeLogo"></div>
    <div class="kibanaLoaderWrap"><div class="kibanaLoader"></div><p class="kibanaWelcomeText">Loading Kibana</p></div>
    </div>
    <div class="kibanaWelcomeView" id="kbn_legacy_browser_error" style="display:none">
    <p class="kibanaWelcomeText">Please upgrade your browser.</p>
    </div>
    <script>window.onload=function(){document.getElementById('kbn_loading_message').style.display='flex';};</script>
    </body>
    </html>
taunt: { mode: block, open: '<!--', close: '-->' }
expect:
  - 'kibanaWelcomeView'
  - '<title>Kibana</title>'
  - 'kbn-injected-metadata'
  - '"version":"7.17.18"'
