id: route-dirlist-files-sessions
priority: 180
# Path-aware listing of a /files/_sessions/ directory (a GLPI session store). route_key-guarded to
# GET /files/_sessions/. Its one link resolves to route-glpi-session; the parent link resolves to the
# existing /files/ listing. The bundle's "glpi" product word rides in an HTML comment (FP-0316).
match:
  template_needle: [directory-listing]
  route_key: ['GET /files/_sessions/']
response:
  headers:
    Content-Type: "text/html; charset=utf-8"
  body: |
    <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 3.2 Final//EN">
    <html><head><title>Index of /files/_sessions</title></head>
    <body>
    <h1>Index of /files/_sessions</h1>
    <pre><a href="?C=N;O=D">Name</a>  <a href="?C=M;O=A">Last modified</a>  <a href="?C=S;O=A">Size</a>
    <hr>
    <a href="../">Parent Directory</a>                                                        -
    <a href="sess_8f640be55b7e9080c1ad18f6d9">sess_8f640be55b7e9080c1ad18f6d9</a>  2024-01-01 12:00  4.1K
    <hr></pre>
    <address>Apache Server at {{persona.company.domain}} Port 80</address>
    <!-- glpi -->
    </body></html>
taunt: { mode: block, open: '<!--', close: '-->' }
expect:
  - 'Index of /files/_sessions'
  - 'href="sess_8f640be55b7e9080c1ad18f6d9"'
