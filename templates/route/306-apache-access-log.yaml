id: route-apache-access-log
priority: 306
# Brand-new page: an Apache access.log (NCSA combined) at its real /var/log path. Distinct key and
# body from the nginx/corpus access logs. Client IPs from the shared public pool; Referer/Host from
# the persona domain. Number safety: octets/status <=3 digits; sizes dec:4/dec:3 (never dec:6).
new_page:
  method: GET
  paths: ['/var/log/apache2/access.log']
  sig: 0
  status: 200
  severity: medium
  tags: [exposure, log-disclosure, information-disclosure]
  name: 'Exposed Apache access log (access.log)'
  body_words: ['"GET /']
