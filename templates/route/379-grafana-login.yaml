id: route-grafana-login
priority: 379
# Brand-new page: the Grafana login shell (no nuclei template at these paths). A scanner probes
# /grafana/ and /grafana/login to confirm Grafana and read its bootstrap version. Served text/html
# (the app shell's real type). Uses the DEDICATED /grafana/ path, not the persona-capped /login, so it
# always serves. The `grafanaBootData` version (10.4.2) matches the /api/health and /api/frontend/
# settings surfaces — one host. A fresh `grafana_session` cookie per request (a static or absent one
# is a tell). Version is a dotted literal (no bare 6-digit run). Grafana is engine-agnostic; no db.
new_page:
  method: GET
  paths: ['/grafana/', '/grafana/login']
  sig: 0
  status: 200
  severity: info
  tags: [grafana, panel, login, exposure]
  name: 'Grafana login'
  body_words: ['Grafana']
set_cookie: grafana_session
response:
  headers:
    Content-Type: "text/html; charset=utf-8"
  body: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width"/>
    <title>Grafana</title>
    <base href="/grafana/"/>
    <link rel="icon" type="image/png" href="public/img/fav32.png"/>
    <link rel="stylesheet" href="public/build/grafana.dark.css"/>
    </head>
    <body class="theme-dark app-grafana">
    <grafana-app class="grafana-app">
    <div class="preloader">
    <div class="preloader__enter"><div class="preloader__bounce"><div class="preloader__logo"></div></div></div>
    </div>
    </grafana-app>
    <div id="reactRoot"></div>
    <script nonce="">
    window.grafanaBootData = {
    "user":{"isSignedIn":false,"id":0,"orgId":0,"login":"","theme":"dark"},
    "settings":{"appSubUrl":"/grafana","appUrl":"https://{{persona.company.domain}}/grafana/","disableLoginForm":false,"buildInfo":{"version":"10.4.2","edition":"Open Source","env":"production"}}
    };
    </script>
    <script src="public/build/runtime.js" type="text/javascript"></script>
    <script src="public/build/app.js" type="text/javascript"></script>
    </body>
    </html>
taunt: { mode: block, open: '<!--', close: '-->' }
expect:
  - '<grafana-app class="grafana-app">'
  - '"version":"10.4.2"'
