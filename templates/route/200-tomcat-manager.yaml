id: route-tomcat-manager
priority: 200
# Exposed Tomcat Web Application Manager — dresses the existing nuclei tomcat bundle. Tomcat/JVM
# versions are the shared persona fields, so this table, catalina.out, the Actuator info block and the
# WEB-INF/web.xml descriptor tell one Tomcat 9 / Java 17 story (Tomcat 9 is the `javax.servlet` line).
match:
  template_needle: [apache-tomcat-exposed, tomcat-default-login, tomcat]
set_cookie: JSESSIONID
response:
  headers:
    Content-Type: "text/html;charset=utf-8"
  body: |
    <!DOCTYPE html>
    <html><head><title>/manager</title><link rel="icon" href="/manager/favicon.ico"></head>
    <body>
    <h1>Tomcat Web Application Manager</h1>
    <table>
    <tr><th>Path</th><th>Version</th><th>Display Name</th><th>Running</th><th>Sessions</th></tr>
    <tr><td>/</td><td>None</td><td>Welcome to Tomcat</td><td>true</td><td>0</td></tr>
    <tr><td>/manager</td><td>None</td><td>Tomcat Manager Application</td><td>true</td><td>1</td></tr>
    </table>
    <h2>Server Information</h2>
    <table>
    <tr><th>Tomcat Version</th><th>JVM Version</th><th>OS Name</th></tr>
    <tr><td>Apache Tomcat/{{persona.tomcat.version}}</td><td>{{persona.java.version}}</td><td>Linux</td></tr>
    </table>
    </body></html>
taunt: { mode: block, open: '<!--', close: '-->' }
expect: ['Tomcat Web Application Manager', 'Server Information', 'Tomcat Version']
