id: route-surface-admin
priority: 400
# Brand-new page (FP-0233): the admin dashboard index archetype — an HTML shell (a structurally
# distinct crawl node from the JSON archetypes). CRITICAL for the route-integrity dangling-link
# gate: every href here is a ROOT-ABSOLUTE path (never relative — the phpMyAdmin failure mode) and
# resolves to a COMPILED in-family decoy (all surface-graph bundles share the `api` family via
# their first non-generic tag), so the linter sees no dangling / cross-family / unanchored link.
# No stylesheet/script/img asset link (that would dangle) — anchors only, all to compiled paths.
# FP-0278: the two admin nav links are per-deploy-seeded collection nouns (/admin/{{surface.noun:c1|c2}}
# — the SAME c-nouns the docs advertise); the linter strips the directive, leaving /admin/ which
# resolves in-family (this page's own paths). The /api link (not /api/v1/<noun>) is deliberate: the
# stripped /api/v1/ has nothing compiled at it (a dangling WARN), whereas /api resolves (397).
# Inert: GET, 200, no request byte reflected, fully persona-seeded. Served text/html. Block HTML
# comment taunt after the body. No numbers on the page (no digit-run risk).
new_page:
  method: GET
  paths: ['/admin', '/admin/']
  sig: 0
  status: 200
  severity: info
  weight: 100000
  tags: [exposure, api, discovery]
  name: 'Exposed admin dashboard index'
  body_words: ['<title>', 'Dashboard']
response:
  headers:
    Content-Type: "text/html; charset=utf-8"
  body: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>{{persona.company.name}} Admin</title>
      <style>
      :root{color-scheme:light}
      *{box-sizing:border-box}
      body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f4f5f7;color:#1f2733}
      header.topbar{background:#1f2733;color:#fff;padding:.9rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
      header.topbar .title{font-size:1.1rem;font-weight:600}
      header.topbar .who{font-size:.85rem;color:#b7c0cd}
      .layout{display:flex;min-height:calc(100vh - 3.4rem)}
      nav.side{width:15rem;background:#fff;border-right:1px solid #e3e7ec;padding:1rem 0}
      nav.side ul{list-style:none;margin:0;padding:0}
      nav.side a{display:block;padding:.6rem 1.5rem;color:#334;text-decoration:none;font-size:.95rem}
      nav.side a:hover{background:#eef1f5}
      main{flex:1;padding:1.5rem}
      main h1{font-size:1.3rem;margin:0 0 1rem}
      .card{background:#fff;border:1px solid #e3e7ec;border-radius:.4rem;padding:1.1rem 1.25rem;max-width:34rem}
      </style>
    </head>
    <body>
      <header class="topbar">
        <span class="title">{{persona.company.name}} Admin</span>
        <span class="who">{{persona.user.admin.email}}</span>
      </header>
      <div class="layout">
        <nav class="side">
          <ul>
            <li><a href="/admin/{{surface.noun:c1}}">{{surface.noun:c1}}</a></li>
            <li><a href="/admin/{{surface.noun:c2}}">{{surface.noun:c2}}</a></li>
            <li><a href="/api">API</a></li>
            <li><a href="/webhooks">Webhooks</a></li>
            <li><a href="/status">Status</a></li>
            <li><a href="/metrics">Metrics</a></li>
          </ul>
        </nav>
        <main>
          <h1>{{persona.company.name}} Dashboard</h1>
          <div class="card">
            <p>Signed in as {{persona.user.admin.email}}.</p>
          </div>
        </main>
      </div>
    </body>
    </html>
taunt: { mode: block, open: '<!--', close: '-->' }
expect:
  - '<title>'
  - 'Dashboard</h1>'
  - 'href="/admin/'
