# Trimmed sample of OWASP CoreRuleSet RESPONSE-951-DATA-LEAKAGES-SQL.conf (v4.29.0).
# Verbatim CRS content (Apache-2.0). A negated, response-side rule — must be SKIPPED
# (funnypot never sees the real backend's response, and a "!@" operator is a NOT match).

SecRule RESPONSE_BODY "!@pmFromFile sql-errors.data" \
    "id:951100,\
    phase:4,\
    block,\
    capture,\
    t:none,\
    msg:'SQL Information Leakage',\
    tag:'application-multi',\
    tag:'attack-disclosure',\
    tag:'paranoia-level/1',\
    tag:'OWASP_CRS',\
    severity:'CRITICAL'"
