# Trimmed sample of OWASP CoreRuleSet REQUEST-930-APPLICATION-ATTACK-LFI.conf (v4.29.0).
# Verbatim CRS content (Apache-2.0). Exercises a portable @rx and a @pmFromFile dictionary.

# 930110 — @rx path traversal: portable, KEPT.
SecRule REQUEST_URI_RAW|ARGS|REQUEST_HEADERS|!REQUEST_HEADERS:Referer|FILES|XML:/*|XML://@* "@rx (?:^|[/;\x5c])\.{2,3}[/;\x5c]" \
    "id:930110,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Path Traversal Attack (/../) or (/.../)',\
    tag:'application-multi',\
    tag:'attack-lfi',\
    tag:'paranoia-level/1',\
    tag:'OWASP_CRS',\
    severity:'CRITICAL',\
    setvar:'tx.lfi_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 930120 — @pmFromFile OS-file dictionary: portable, KEPT (one branch per phrase).
SecRule REQUEST_COOKIES|REQUEST_COOKIES_NAMES|ARGS_NAMES|ARGS|XML:/*|XML://@* "@pmFromFile lfi-os-files.data" \
    "id:930120,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'OS File Access Attempt',\
    tag:'application-multi',\
    tag:'attack-lfi',\
    tag:'paranoia-level/1',\
    tag:'OWASP_CRS',\
    severity:'CRITICAL',\
    setvar:'tx.lfi_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"
